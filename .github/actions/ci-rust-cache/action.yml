name: Ordinary CI Rust cache
description: Keep dependency caches reusable without consuming the release cache budget.
inputs:
  shared-key:
    description: Compatible build mode; feature/profile variants keep separate keys.
    required: true
  incremental:
    description: Keep workspace crates and a lane-scoped incremental target cache.
    default: 'false'
  backend-reserve:
    description: This job allocates the backend swap reserve; reclaim hosted SDK space and budget that allocation.
    default: 'false'
  save-if:
    description: Only CI Cache Warm opts in. Push still writes main only.
    default: 'false'
outputs:
  save-enabled:
    description: True when this run may write ordinary caches for its ref.
    value: ${{ steps.save-policy.outputs.enabled }}
  incremental-key:
    description: Primary incremental cache key. Empty unless incremental is true.
    value: ${{ steps.incremental-contract.outputs.key }}
  incremental-path:
    description: Exact actions/cache path list. Writers must pass this unchanged.
    value: ${{ steps.incremental-contract.outputs.path }}
runs:
  using: composite
  steps:
    # Push publishes main only. workflow_dispatch also publishes the selected
    # ref; Actions scopes that entry to the branch and does not replace main.
    # Ordinary CI passes save-if false, so it never writes.
    - name: Decide whether this run may write ordinary caches
      id: save-policy
      shell: bash
      env:
        SAVE_IF: ${{ inputs.save-if }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        enabled=false
        if [[ "$SAVE_IF" == "true" && ( "$EVENT" == "workflow_dispatch" || "$REF" == "refs/heads/main" ) ]]; then
          enabled=true
        fi
        echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
    # rust-cache hashes *every* installed compiler. Unused runner stable updates
    # (1.99.0 vs 1.99.1) duplicated caches even though CI builds with 1.98.1.
    - name: Keep only the active pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        active="$(rustup show active-toolchain | cut -d ' ' -f 1)"
        while read -r installed _; do
          if [[ -n "$installed" && "$installed" != "$active" ]]; then
            rustup toolchain uninstall "$installed"
          fi
        done < <(rustup toolchain list --quiet)
    - name: Prepare disk before dependency restore
      if: runner.os == 'Linux' && inputs.backend-reserve == 'true'
      shell: bash
      run: python3 .github/scripts/backend_disk.py before-dependencies
    - uses: Swatinem/rust-cache@v2
      # These affect metadata scheduling/runtime stacks, not compiled artifacts.
      # Pin them for the cache step so equivalent test jobs have identical keys.
      env:
        CARGO_BUILD_JOBS: '2'
        CARGO_INCREMENTAL: '0'
        RUST_MIN_STACK: '8388608'
      with:
        shared-key: ${{ inputs.shared-key }}
        # Keep the existing dependency/artifact generation; native incremental
        # storage and compiler arguments are unchanged.
        prefix-key: ${{ inputs.incremental == 'true' && 'v1-rust-incremental' || 'v0-rust' }}
        save-if: ${{ steps.save-policy.outputs.enabled }}
        # taiki-e installs these tools by pinned version already. Keep compiled
        # dependencies, not another copy of each nextest/llvm-cov executable.
        cache-bin: false
        cache-targets: true
        cache-all-crates: false
        cache-workspace-crates: ${{ inputs.incremental == 'true' && 'true' || 'false' }}
    # The actions/cache version is the path list, not only the key. Restore and
    # every save must use this step's outputs. A second copy of the expression
    # changes the version and the lookup misses.
    - name: Define the incremental cache contract
      id: incremental-contract
      if: inputs.incremental == 'true'
      shell: bash
      env:
        INCREMENTAL_KEY: v1-rust-graph-${{ inputs.shared-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock', 'rust-toolchain*', '.cargo/config.toml') }}-${{ github.sha }}
      run: |
        set -euo pipefail
        commit="${INCREMENTAL_KEY##*-}"
        without_commit="${INCREMENTAL_KEY%-"$commit"}"
        manifest_prefix="${without_commit}-"
        # Drop the manifest hash as well. An unrelated member lock change can
        # reuse this lane; a version bump may spend a few minutes downloading
        # a graph rustc will not use.
        broad_prefix="${without_commit%-*}-"
        {
          echo "key<<EOF"
          printf '%s\n' "$INCREMENTAL_KEY"
          echo "EOF"
          echo "path<<EOF"
          printf '%s\n' target/debug/incremental target/llvm-cov-target/debug/incremental
          echo "EOF"
          echo "restore-keys<<EOF"
          printf '%s\n' "$manifest_prefix" "$broad_prefix"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    # rust-cache intentionally removes incremental directories before saving.
    # Ordinary CI is a reader even on main. CI Cache Warm saves the same path
    # list through ci-rust-incremental-save.
    - name: Check disk before incremental restore
      id: incremental-space
      if: inputs.incremental == 'true'
      shell: bash
      env:
        BACKEND_RESERVE: ${{ inputs.backend-reserve }}
      run: python3 .github/scripts/backend_disk.py before-incremental --backend-reserve "$BACKEND_RESERVE"
    - name: Restore incremental build cache
      id: incremental-restore
      if: inputs.incremental == 'true' && steps.incremental-space.outputs.allowed == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.incremental-contract.outputs.path }}
        key: ${{ steps.incremental-contract.outputs.key }}
        restore-keys: ${{ steps.incremental-contract.outputs.restore-keys }}
    - name: Record restored graph sizes
      if: inputs.incremental == 'true'
      shell: bash
      run: python3 .github/scripts/incremental_cache.py inventory --label after-restore
    - name: Select incremental compilation policy
      shell: bash
      env:
        REQUESTED: ${{ inputs.incremental }}
        PRODUCER: ${{ steps.save-policy.outputs.enabled }}
        RESTORED_KEY: ${{ steps.incremental-restore.outputs.cache-matched-key }}
        RESTORE_ALLOWED: ${{ steps.incremental-space.outputs.allowed }}
      run: |
        set -euo pipefail
        incremental=0
        reason=not-requested
        if [[ "$REQUESTED" == "true" ]]; then
          if [[ "$RESTORE_ALLOWED" != "true" ]]; then
            reason=disk-guard
          elif [[ -n "$RESTORED_KEY" ]]; then
            reason=hit
          else
            reason=miss
          fi
        fi
        if [[ "$REQUESTED" == "true" && "$reason" != disk-guard && ( "$PRODUCER" == "true" || -n "$RESTORED_KEY" ) ]]; then
          incremental=1
        fi
        echo "CARGO_INCREMENTAL=$incremental" >> "$GITHUB_ENV"
        echo "[ci-incremental] enabled=$incremental producer=$PRODUCER restored=$RESTORED_KEY reason=$reason"
        if [[ "$PRODUCER" == "true" && "$reason" == disk-guard ]]; then
          echo '::error::Cache warm disk guard refused restore; inspect the [ci-disk] budget before retrying.'
          exit 1
        fi
        if [[ "$incremental" == 1 ]]; then
          python3 .github/scripts/incremental_cache.py mark
        fi
