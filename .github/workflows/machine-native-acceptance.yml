name: Machine Native Acceptance

on:
  workflow_call:
  schedule:
    - cron: '17 6 * * 2'

permissions:
  contents: read

jobs:
  native:
    name: Native Machine Separation (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Initialize native build target after the runner is assigned
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/machine-native-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require non-skippable native and full-image acceptance wiring
        run: |
          python3 -m venv "$RUNNER_TEMP/machine-acceptance-policy"
          "$RUNNER_TEMP/machine-acceptance-policy/bin/pip" install --require-hashes --only-binary=:all: -r security/python-build-requirements.txt
          "$RUNNER_TEMP/machine-acceptance-policy/bin/python" scripts/test-machine-acceptance-ci.py
      - name: Install authenticated snapshot build, display and offline fixture prerequisites
        run: |
          bash .github/scripts/install-linux-build-deps.sh
          sudo -n sh scripts/apt-snapshot-install.sh --install-only security/apt-snapshots.tsv ubuntu:noble -- \
            xvfb xauth x11-utils openbox dbus-x11 bubblewrap at-spi2-core fonts-liberation libnss3-tools \
            python3-venv python3-pip build-essential git openssl util-linux cargo rustc nodejs npm
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: machine-native-amd64
          workspaces: |
            . -> ${{ runner.temp }}/machine-native-target
            cli/tests/machine_context_spike -> ${{ runner.temp }}/machine-native-target
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install locked fixture transport and checksummed CUA driver
        run: |
          npm ci --ignore-scripts --prefix cli/tests/updater-npm
          python3 scripts/install-pinned-cua.py --destination "$RUNNER_TEMP/machine-native-cua"
      - name: Require actual Landlock and packaged Google Chrome prerequisites
        run: |
          sudo -n env PATH="$PATH" NODE_PATH="$GITHUB_WORKSPACE/cli/tests/updater-npm/node_modules" \
            python3 scripts/check-machine-native-prereqs.py
      - name: Build committed CLI and production-module fixture with their locks
        run: |
          cargo build --locked -p nyxid-cli --bin nyxid
          cargo build --locked --manifest-path cli/tests/machine_context_spike/Cargo.toml
      - name: Run native managed-browser, two-context and full adversarial acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machine-native-evidence"
          sudo -n env PATH="$PATH" NODE_PATH="$GITHUB_WORKSPACE/cli/tests/updater-npm/node_modules" \
            NYXID_TEST_CLI="$CARGO_TARGET_DIR/debug/nyxid" \
            NYXID_TEST_CUA_DRIVER="$RUNNER_TEMP/machine-native-cua/cua-driver" \
            NYXID_TEST_CONTEXT_SPIKE="$CARGO_TARGET_DIR/debug/nyxid-machine-context-spike" \
            NYXID_TEST_REQUIRE_APPARMOR_USERNS=1 NYXID_TEST_PROBE_SAMPLES=100 \
            bash cli/tests/machine_native_acceptance.sh --disposable \
            2>&1 | tee "$RUNNER_TEMP/machine-native-evidence/acceptance.log"
      - name: Preserve fixed-label native timings including first sample, p99 and maximum
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/machine-native-evidence"
          if test -f "$RUNNER_TEMP/machine-native-evidence/acceptance.log"; then
            awk '/^probe_(timing|summary|bound_review) /' "$RUNNER_TEMP/machine-native-evidence/acceptance.log" \
              > "$RUNNER_TEMP/machine-native-evidence/probe-timings.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: machine-native-amd64-probe-timings
          path: ${{ runner.temp }}/machine-native-evidence/probe-timings.txt
          if-no-files-found: error
          retention-days: 14
