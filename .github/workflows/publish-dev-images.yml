name: Publish Dev Images

# Publishes the staging images on every push to `dev`:
#   backend and frontend, linux/amd64 only -> tags: dev, dev-<sha>
#
# Deliberately separate from publish-images.yml. A dev push never creates,
# moves or attests a production tag (`main`, `main-<sha>`, `edge`, semver,
# `latest`), never builds the node or machine images, and never writes the
# `buildcache-*` references that main builds restore from.
#
# There is no CI gate here: ci.yml already runs on pushes and pull requests to
# `dev`, and a staging image may be published while those checks still run.

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: publish-dev-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} (dev)
    # A manual run from any other branch must not publish `dev` tags.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            file: backend/Dockerfile
            cargo_build_args: CARGO_BUILD_JOBS=4
          - component: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Prepare backend image memory reserve
        if: matrix.component == 'backend'
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh

      - name: Compute image repo and tags
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "repo=ghcr.io/${owner}/nyxid/${{ matrix.component }}"
            echo "sha_tag=dev-${GITHUB_SHA::7}"
            echo "hash=$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure Ubuntu archive DNS
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-ubuntu-archive-dns.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo-root context for both images, as in publish-images.yml.
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:dev
            ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.title=nyxid-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            NYXID_GIT_HASH=${{ steps.image.outputs.hash }}
            ${{ matrix.cargo_build_args }}
          # Restore from the dev cache first, then main's. Only the dev
          # reference is written, so main builds keep their own cache intact.
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-linux-amd64
          cache-to: type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64,mode=max,ignore-error=true
          provenance: false
