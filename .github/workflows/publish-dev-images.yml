name: Publish Dev Images

# Publishes the staging images on every push to `dev`:
#   backend and frontend, linux/amd64 only -> dev-<sha> and dev (current tip).
#
# Deliberately separate from publish-images.yml. A dev push never creates,
# moves or attests a production tag (`main`, `main-<sha>`, `edge`, semver,
# `latest`), never builds the node or machine images, and never writes the
# `buildcache-*` references that main builds restore from.
#
# There is no CI gate here: ci.yml already runs on pushes and pull requests to
# `dev`, and a staging image may be published while those checks still run.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} (dev)
    # A manual run from any other branch must not publish `dev` tags.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-dev-images-${{ matrix.component }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            file: backend/Dockerfile
            cargo_build_args: CARGO_BUILD_JOBS=4
          - component: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Prepare backend image memory reserve
        if: matrix.component == 'backend'
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh

      - name: Compute image repo and tags
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/nyxid/${{ matrix.component }}"
          tip=$(git ls-remote --exit-code origin refs/heads/dev)
          {
            echo "repo=$repo"
            echo "tags<<EOF"
            echo "$repo:dev-${GITHUB_SHA::7}"
            if [[ "${tip%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
              echo "$repo:dev"
            fi
            echo "EOF"
            echo "hash=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure Ubuntu archive DNS
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-ubuntu-archive-dns.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Repo-root context for both images, as in publish-images.yml.
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=nyxid-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            NYXID_GIT_HASH=${{ steps.image.outputs.hash }}
            ${{ matrix.cargo_build_args }}
          # Restore from the dev cache first, then main's. Only the dev
          # reference is written, so main builds keep their own cache intact.
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-linux-amd64
          cache-to: type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64,mode=max,ignore-error=true
          provenance: false

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.nyxid.ai
    concurrency:
      # A slow older build can reach this queue after a newer one.
      group: deploy-nyxid-staging
      queue: max
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v6
      - name: Check current dev tip
        id: revision
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/dev)
          if [[ "${tip%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded staging deployment for $GITHUB_SHA."
          fi
      - name: Roll out backend and frontend
        if: steps.revision.outputs.current == 'true'
        env:
          NYXID_STAGING_DEPLOY_CLIENT_ID: ${{ secrets.NYXID_STAGING_DEPLOY_CLIENT_ID }}
          NYXID_STAGING_DEPLOY_CLIENT_SECRET: ${{ secrets.NYXID_STAGING_DEPLOY_CLIENT_SECRET }}
        run: python3 .github/scripts/deploy_staging.py
