name: Release branch policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  main-merge-guard:
    name: Main Merge Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the release branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import subprocess
          import sys

          def refuse(reason):
              print(f"::error::{reason} Allowed sources are this repository's dev, release/YYYY-MM-DD[-N], and hotfix/<name>.")
              sys.exit(1)

          def api(path, *options):
              try:
                  return subprocess.check_output(
                      ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/{path}", *options], text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  refuse("GitHub could not verify the branch history. Retry the guard.")

          def tip(branch):
              sha = api(f"git/ref/heads/{branch}", "--jq", ".object.sha")
              if not re.fullmatch("[0-9a-f]{40}", sha):
                  refuse(f"GitHub returned an invalid {branch} head.")
              return sha

          def changes(base, head):
              # Pin both tips so advancing branches cannot shift commits between pages.
              raw = api(f"compare/{base}...{head}?per_page=100", "--paginate", "--slurp")
              try:
                  pages = json.loads(raw)
                  first = pages[0]
                  commits = {c["sha"] for page in pages for c in page["commits"]}
                  status = first["status"]
                  if len(commits) != first["total_commits"] or not all(re.fullmatch("[0-9a-f]{40}", c) for c in commits):
                      refuse("GitHub returned an incomplete commit list.")
                  if status in ("ahead", "diverged") and head.lower() in commits:
                      return status, commits
                  if status in ("identical", "behind") and not commits:
                      return status, commits
              except (ValueError, KeyError, IndexError, TypeError):
                  pass
              refuse("GitHub returned an incomplete commit comparison.")

          if os.environ["BASE"] != "main":
              sys.exit(0)
          if os.environ["HEAD_REPO"] != os.environ["GITHUB_REPOSITORY"]:
              refuse("A release PR must come from this repository.")
          branch = os.environ["HEAD_BRANCH"]
          if branch == "dev":
              sys.exit(0)
          release = re.fullmatch(r"release/([0-9]{4}-[0-9]{2}-[0-9]{2})(?:-(?:[2-9]|[1-9][0-9]+))?", branch)
          hotfix = re.fullmatch(r"hotfix/[a-z0-9][a-z0-9._-]{0,63}", branch)
          if not (release or hotfix):
              refuse("Use a dated release (optional suffix starting at -2) or a 1–64 character lowercase hotfix name.")
          sha = os.environ["HEAD_SHA"]
          if not re.fullmatch("[0-9a-fA-F]{40}", sha):
              refuse("The PR head must be a 40-hex commit SHA.")
          if release:
              try:
                  datetime.date.fromisoformat(release[1])
              except ValueError:
                  refuse("The release branch must contain a valid calendar date.")
              status = api(f"compare/dev...{sha}", "--jq", ".status")
              if status in ("ahead", "diverged"):
                  refuse("The release commit must already be in dev's history.")
              if status not in ("behind", "identical"):
                  refuse("GitHub returned an unknown release comparison status.")
          else:
              main = tip("main")
              status, hotfix_commits = changes(main, sha)
              if status not in ("ahead", "identical"):
                  refuse("Update the hotfix to contain the current head of main.")
              _, unreleased = changes(main, tip("dev"))
              overlap = hotfix_commits & unreleased
              if overlap:
                  refuse(f"The hotfix includes unreleased dev commit {min(overlap)}.")
