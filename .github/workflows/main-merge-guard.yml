name: Release branch policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  main-merge-guard:
    name: Main Merge Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check the release branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$BASE" == main && ( "$HEAD_BRANCH" != dev || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ) ]]; then
            echo "::error::Target dev with feature PRs, then open a release PR from this repository's dev branch into main."
            exit 1
          fi
