name: Release branch policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  main-merge-guard:
    name: Main Merge Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the release branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() { echo "::error::$1"; exit 1; }
          [[ "$BASE" == main ]] || exit 0
          [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || refuse "A release PR must come from this repository."
          [[ "$HEAD_BRANCH" == dev ]] && exit 0

          pattern='^release/([0-9]{4}-[0-9]{2}-[0-9]{2})(-([2-9]|[1-9][0-9]+))?$'
          [[ "$HEAD_BRANCH" =~ $pattern ]] || refuse "Use dev or release/YYYY-MM-DD with an optional suffix starting at -2."
          if ! python3 -c 'import datetime, sys; datetime.date.fromisoformat(sys.argv[1])' "${BASH_REMATCH[1]}" 2>/dev/null; then
            refuse "The release branch must contain a valid calendar date."
          fi
          [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || refuse "The release head must be a 40-hex commit SHA."

          # Compare reports the second commit relative to the first.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/dev...$HEAD_SHA" --jq '.status') ||
            refuse "GitHub could not verify the release commit against dev."
          case "$status" in
            behind|identical) ;;
            ahead|diverged) refuse "The release commit must already be in dev's history." ;;
            *) refuse "GitHub returned an unknown comparison status." ;;
          esac
