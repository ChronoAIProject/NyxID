name: CI

on:
  pull_request:
    # Rollup PRs must be gated with the same CI coverage as main/dev PRs.
    branches: [main, dev, 'rollup-*']
  push:
    # `main` is intentionally not listed here -- pushes to main are gated
    # through publish-images.yml, which calls this workflow via workflow_call.
    # Listing main twice would cause CI to run on every merge commit twice.
    branches: [dev, 'rollup-*']
  # Allow other workflows (publish-images, release) to reuse this one as a
  # gate via `uses: ./.github/workflows/ci.yml`. Callers should pass
  # `force-all: true` to skip path filtering and run the full suite as a
  # release/publish gate.
  workflow_call:
    inputs:
      force-all:
        description: >-
          When true, run every job regardless of which paths changed.
          Used by publish-images.yml so a release-gate run is always a
          full validation.
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# Backend test and coverage jobs start an explicit single-node replica set and use this
# authoritative URI. Multi-document transaction tests must never fall back to a
# standalone developer mongod or silently skip because topology is unsupported.
  NYXID_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the monorepo changed so downstream jobs can skip
  # work that isn't relevant to this PR. Always runs first; outputs feed the
  # `if:` guards on every other job.
  #
  # Filter conventions:
  #   - `backend`    = backend crate OR shared workspace files (root
  #                    Cargo.toml/Cargo.lock/nextest config) OR
  #                    `cloud-auth` (depended on by backend, NyxID#716)
  #   - `cli`        = cli crate OR shared workspace files OR `cloud-auth`
  #                    (also depended on by the CLI's node agent)
  #     => a Cargo.lock or cloud-auth change fires BOTH `backend` and
  #        `cli`, since they are members of the same `[workspace]` and
  #        share the lock file + the cloud-auth dependency.
  #   - `rust`       = backend OR cli OR shared workspace files (workspace-wide
  #                    fmt + clippy)
  #   - `wizard`  = anything that could change the committed wizard bundle
  #                 hash (frontend sources, .node-version, cli wizard glue)
  #   - `ci`      = this workflow itself; forces a full run when changed
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      packaging: ${{ steps.filter.outputs.packaging }}
      apt: ${{ steps.filter.outputs.apt }}
      apk: ${{ steps.filter.outputs.apk }}
      catalogs: ${{ steps.filter.outputs.catalogs }}
      cli: ${{ steps.filter.outputs.cli }}
      machine: ${{ steps.filter.outputs.machine }}
      permissions: ${{ steps.filter.outputs.permissions }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      sdk: ${{ steps.filter.outputs.sdk }}
      wizard: ${{ steps.filter.outputs.wizard }}
      cursor_plugin: ${{ steps.filter.outputs.cursor_plugin }}
      codex_plugin: ${{ steps.filter.outputs.codex_plugin }}
      claude_plugin: ${{ steps.filter.outputs.claude_plugin }}
      oracle_worker: ${{ steps.filter.outputs.oracle_worker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate every workflow with checksummed actionlint
        run: python3 scripts/check-actionlint.py --bin-dir "$RUNNER_TEMP/actionlint"
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Shared workspace files (Cargo.toml / Cargo.lock / nextest config)
          # are duplicated into both `backend` and `cli` filters by design:
          # any change to the shared lock file must retest both crates,
          # since they are members of the same `[workspace]`.
          # YAML anchors aren't used here -- aliased sequences expand to
          # nested lists in js-yaml, which paths-filter does not flatten.
          filters: |
            packaging:
              - 'scripts/*runtime*'
              - 'scripts/*rootfs*'
              - 'scripts/*elf*'
              - 'scripts/*image*entrypoint*'
              - 'scripts/*image*disposition*'
              - 'security/image-dispositions.json'
              - 'scripts/*official*'
              - 'scripts/*release*sign*'
              - 'scripts/*rehearsal*'
              - 'scripts/*signing*'
              - 'scripts/release_verifier.rs'
              - 'cli/examples/release-verifier*'
              - 'security/signing-tools/**'
              - 'scripts/*sbom*'
              - 'scripts/machine_fixture_tls.py'
              - 'scripts/check-dist-artifacts.py'
              - 'scripts/shipped_composition_sbom.py'
              - 'scripts/oci_subjects.py'
              - 'scripts/setup-sbom-tools.sh'
              - 'scripts/validate-cyclonedx.py'
              - 'scripts/test_cyclonedx.py'
              - 'security/schemas/**'
              - 'security/python-sbom-requirements.txt'
              - 'scripts/*scan*'
              - 'scripts/*vulnerabilit*'
              - 'scripts/*dependency*'
              - 'scripts/*audit*'
              - 'scripts/*csp*'
              - 'scripts/*machine*docker*'
              - 'cli/tests/updater-npm/**'
              - 'frontend/Dockerfile.policy-tests'
              - 'scripts/*identity*'
              - 'scripts/*artifacts*'
              - 'scripts/*packaging*'
              - 'scripts/*credential*'
              - 'scripts/*publication*'
              - 'scripts/*build*.py'
              - 'docs/site/**'
            catalogs:
              - 'scripts/*catalog*'
              - 'scripts/*build-input*'
              - 'scripts/*hosted*'
              - 'scripts/check-build-input-freshness.py'
              - 'renovate.json'
              - '.github/dependabot.yml'
              - '.node-version'
              - 'rust-toolchain.toml'
            apt:
              - '**/Dockerfile*'
              - 'Dockerfile*'
              - 'scripts/*apt*'
              - 'scripts/check-build-inputs.py'
              - 'scripts/test-build-inputs.py'
              - 'scripts/install-release-dependencies.sh'
              - '.github/scripts/install-linux-build-deps.sh'
              - 'security/apt-snapshots.tsv'
              - 'security/apt-transport-ca.*'
              - 'security/build-input-pins.json'
              - '.dockerignore'
            apk:
              - '**/Dockerfile*'
              - 'Dockerfile*'
              - 'scripts/*apk*'
              - 'scripts/apt_inputs.py'
              - 'scripts/check-build-inputs.py'
              - 'scripts/test-build-inputs.py'
              - 'security/apk/**'
              - 'security/build-input-pins.json'
              - '.dockerignore'
            backend_image:
              - 'backend/Dockerfile'
              - 'build-support/**'
              - 'scripts/*build-source.py'
              - '.dockerignore'
              - '.github/scripts/prepare-backend-runner.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
            permissions:
              - 'permissions/**'
              - 'scripts/test-drive-permissions-poc.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
            machine:
              - 'build-support/**'
              - 'scripts/*build-source.py'
              - 'scripts/build-local-image.py'
              - 'frontend/scripts/machine-seccomp.ts'
              - 'frontend/src/schemas/machines.ts'
              - 'cli/src/commands/update_attestation*'
              - 'cli/src/commands/update_attestation/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'cli/src/node/machine/**'
              - 'cli/resources/machine-browser/**'
              - 'cli/resources/machine-container/**'
              - 'cli/container/**'
              - 'cli/Dockerfile.machine'
              - 'cli/Dockerfile.machine-updater'
              - 'cli/src/machine_updater/**'
              - 'cli/src/commands/machine_native_update.rs'
              - 'cli/tests/machine*'
              - 'cli/tests/Dockerfile.machine'
              - 'cli/tests/Dockerfile.updater-browser'
              - 'cli/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
            backend:
              - 'build-support/**'
              - 'scripts/export-build-source.py'
              - 'scripts/run-exported-build.py'
              - 'scripts/test-backend-docker-embeds.py'
              - 'backend/**'
              - 'permissions/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'integrations/oracle/cdp-worker/worker.mjs'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'docs/AI_AGENT_PLAYBOOK.md'
              - '.dockerignore'
              - 'scripts/check-backend-docker-embeds.py'
              - 'scripts/check-rci-backend-boundary.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            cli:
              - 'build-support/**'
              - 'cli/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'skills/nyxid/scripts/**'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            rust:
              - 'build-support/**'
              # `mcp-demo` is the fourth workspace member; workspace-wide
              # fmt + clippy must re-run on changes there even though no
              # job currently builds or tests it directly. `cloud-auth`
              # is depended on by backend + cli (NyxID#716) so it also
              # needs to trigger workspace-wide checks.
              - 'backend/**'
              - 'integrations/oracle/cdp-worker/worker.mjs'
              - 'cli/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'mcp-demo/**'
              - 'permissions/**'
              - 'docs/AI_AGENT_PLAYBOOK.md'
              - '.dockerignore'
              - 'scripts/check-backend-docker-embeds.py'
              - 'scripts/check-rci-backend-boundary.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            frontend:
              - 'frontend/**'
              - '.node-version'
            mobile:
              - 'mobile/**'
              - '.node-version'
            sdk:
              - 'sdk/**'
              - '.node-version'
            # Inputs hashed by `cli/tests/wizard_bundle_freshness.rs`:
            #   - every file listed in `cli/src/wizard/bundle-meta/index.manifest`
            #     (always under `frontend/`).
            #   - EXTRAS: `frontend/package-lock.json`,
            #     `frontend/vite.wizard.config.ts`, `frontend/wizard.html`,
            #     `frontend/vite-plugins/wizard-manifest.ts`, `.node-version`.
            #   - the committed manifest + hash files themselves.
            #   - the test source file.
            # Keep this filter a superset of the EXTRAS list in that test.
            wizard:
              - 'frontend/**'
              - '.node-version'
              - 'cli/src/wizard/**'
              - 'cli/tests/wizard_bundle_freshness.rs'
            cursor_plugin:
              - 'integrations/cursor-plugin/**'
              - '.cursor-plugin/**'
              - 'scripts/validate-cursor-plugin.py'
            codex_plugin:
              - 'integrations/codex-plugin/**'
              - 'integrations/plugin-source/**'
              - '.agents/plugins/**'
              - 'scripts/build-codex-plugin.sh'
              - 'scripts/sync-plugins.py'
            claude_plugin:
              - 'integrations/claude-plugin/**'
              - 'integrations/plugin-source/**'
              - '.claude-plugin/**'
              - 'scripts/validate-claude-plugin.py'
              - 'scripts/sync-plugins.py'
              - '.github/tools/claude/**'
              - 'security/build-tools.json'
              - 'scripts/bootstrap-build-tool.py'
            oracle_worker:
              - 'integrations/oracle/cdp-worker/**'
              - '.node-version'
            # Any workflow change forces a full run -- stops a broken
            # publish-gate or release pipeline from sneaking through under
            # path filtering.
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/tools/**'
              - 'security/**'

  security-scans:
    name: Security Scans
    permissions:
      contents: read
    uses: ./.github/workflows/security-scans.yml

  # Run the same package-boundary matrix on PRs, weekly and in publication CI.
  apt-inputs:
    name: APT Inputs
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.apt == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/apt-inputs.yml

  apk-inputs:
    name: APK Inputs
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.apk == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/apk-inputs.yml

  catalog-maintenance:
    name: Build Input Maintenance
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.apt == 'true' || needs.changes.outputs.apk == 'true' || needs.changes.outputs.catalogs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-input-maintenance.yml

  # ---------------------------------------------------------------------------
  # Reusable workflow permissions: a ci.yml job requesting a scope that the
  # Publish Images `ci-gate` call does not grant passes on PRs but makes Publish
  # Images fail to start on main and tags. Cheap enough to run every time.
  # ---------------------------------------------------------------------------
  workflow-permissions:
    name: Workflow Permissions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - name: Install integrity-locked workflow and SBOM validators
        run: |
          pip install --require-hashes --only-binary=:all: -r security/python-build-requirements.txt
          pip install --require-hashes --only-binary=:all: -r security/python-sbom-requirements.txt
      - name: Check reusable workflow permissions against their callers
        run: |
          python3 scripts/check-actionlint.py --bin-dir "$RUNNER_TEMP/actionlint"
          python3 -m unittest discover -s .github/scripts -p 'test_actionlint.py'
          python3 scripts/check-workflow-yaml.py
          python3 scripts/test-workflow-yaml.py
          python3 scripts/check-reusable-workflow-permissions.py
      - name: Check pinned inputs and generated release policy
        run: |
          python3 scripts/check-build-inputs.py
          python3 scripts/test-build-inputs.py
          python3 scripts/check-node-install-policy.py
          python3 scripts/test_node_install_policy.py
          python3 scripts/test_embedded_wizard.py
          python3 scripts/test_rust_binary_sbom.py
          python3 scripts/test_cyclonedx.py
          python3 scripts/test_publication_contract.py
          python3 scripts/test_dist_artifacts.py
          python3 scripts/test-export-build-source.py
          python3 scripts/test-source-identity.py
          python3 scripts/test-build-release-source.py
          python3 scripts/test-dist-build-completion.py
          python3 scripts/test-run-exported-build.py
          python3 scripts/test-build-local-image.py
          python3 scripts/test-backend-docker-embeds.py
          python3 scripts/test_oci_subjects.py

  # ---------------------------------------------------------------------------
  # Permission engine: no database or Google credentials required.
  # ---------------------------------------------------------------------------
  permissions-test:
    name: Google Permissions
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.permissions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt -p nyxid-permissions --check
      - run: cargo clippy -p nyxid-permissions --all-targets --locked -- -D warnings
      - run: cargo test -p nyxid-permissions --locked
      - run: python3 scripts/test-drive-permissions-poc.py

  # Cursor plugin: manifest, component, MCP variable, and marketplace checks.
  cursor-plugin-validate:
    name: Cursor Plugin Validate
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cursor_plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Cursor plugin
        run: python3 scripts/validate-cursor-plugin.py

  # Codex / OpenAI plugin: generated files, manifest, MCP, skills, and
  # package allowlist.
  codex-plugin-validate:
    name: Codex Plugin Validate
    permissions:
      contents: read
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.codex_plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check generated plugin files match integrations/plugin-source
        run: python3 scripts/sync-plugins.py --check
      - name: Validate Codex plugin
        run: scripts/build-codex-plugin.sh --check

  # Claude plugin: manifest, remote MCP, skills, and directory bundle limits.
  # The repository-limit step runs on every PR because the Claude directory
  # also reads repository-wide size and entry counts; the package steps run
  # only when the plugin or its validator changes.
  claude-plugin-validate:
    name: Claude Plugin Validate
    permissions:
      contents: read
    needs: changes
    runs-on: ubuntu-latest
    env:
      PACKAGE_CHANGED: ${{ inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.claude_plugin == 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check repository limits for the Claude directory
        run: python3 scripts/validate-claude-plugin.py --repo-only
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: env.PACKAGE_CHANGED == 'true'
        with:
          node-version-file: .node-version
      - name: Install locked offline plugin validator
        if: env.PACKAGE_CHANGED == 'true'
        run: |
          python3 scripts/bootstrap-build-tool.py npm --bin-dir "$RUNNER_TEMP/nyxid-node-tools"
          "$RUNNER_TEMP/nyxid-node-tools/npm" ci --ignore-scripts --prefix .github/tools/claude
          echo "$GITHUB_WORKSPACE/.github/tools/claude/bin" >> "$GITHUB_PATH"
      - name: Check generated plugin files match integrations/plugin-source
        if: env.PACKAGE_CHANGED == 'true'
        run: python3 scripts/sync-plugins.py --check
      - name: Validate Claude plugin
        if: env.PACKAGE_CHANGED == 'true'
        run: python3 scripts/validate-claude-plugin.py --require-claude
      - name: Validate Claude marketplace
        if: env.PACKAGE_CHANGED == 'true'
        run: claude plugin validate --strict .

  oracle-worker-test:
    name: Oracle Worker Test
    permissions:
      contents: read
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.oracle_worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/oracle/cdp-worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
        env:
          NYXID_TEST_BROWSER: '1'

  # ---------------------------------------------------------------------------
  # Rust: format check
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: Rust Format
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path security/artifact-tools/Cargo.toml -- --check

  # ---------------------------------------------------------------------------
  # Rust: clippy lint
  # ---------------------------------------------------------------------------
  rust-clippy:
    name: Rust Clippy
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Workspace all-target analysis exhausted 16 GiB RAM + 3 GiB swap.
    # Retain every target while bounding simultaneous compiler memory use.
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check Clippy with resource samples
        run: python3 .github/scripts/ci_resources.py clippy cargo clippy --locked --workspace --all-targets --features nyxid/aws-kms,nyxid/gcp-kms -- -D warnings
      - name: Check vendored compiler regression with original negative control
        run: python3 scripts/test-proc-macro-visibility.py --evidence-dir "$RUNNER_TEMP/proc-macro-visibility"
      - name: Check locked artifact metadata tools
        run: cargo clippy --locked --manifest-path security/artifact-tools/Cargo.toml --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rust: backend tests
  # Handler + service tests use the explicit NYXID_TEST_DATABASE_URL above. The
  # container is started as a single-node replica set so atomic rotation/binding
  # tests exercise real transactions rather than silently skipping.
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Reduce debug-information volume while retaining locations and backtraces.
    # Resource samples distinguish future compilation shutdowns from test failures.
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Start transaction-capable MongoDB
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: backend
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Check RCI backend boundary
        run: bash scripts/check-rci-backend-boundary.sh

      - name: Run backend tests
        run: python3 .github/scripts/ci_resources.py backend-test cargo nextest run --locked -p nyxid -p nyxid-service-adapters --features nyxid/aws-kms,nyxid/gcp-kms --profile ci
      - name: Test MongoDB diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        run: bash .github/scripts/dump-test-mongodb.sh

      - name: Publish test summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/nextest/ci/junit.xml
          show: fail

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-backend
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resources-backend-test
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # Keep the standalone test-profile build and smoke assertion. It exercises
  # a different Cargo feature-unification path from the combined nextest run.
  backend-billing-smoke:
    name: Backend Billing Smoke
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same test-binary compile as backend-test; see the note there.
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Start transaction-capable MongoDB
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: backend-billing-smoke
      - name: Billing route coverage smoke
        run: python3 .github/scripts/ci_resources.py billing-smoke cargo test -p nyxid billing_route_coverage_smoke -- --nocapture
      - name: Test MongoDB diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        run: bash .github/scripts/dump-test-mongodb.sh

      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resources-backend-billing-smoke
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # Keep the production feature/profile and dep-info guard together while
  # letting the full backend tests run on their own runner.
  backend-image-inputs:
    name: Backend Image Inputs
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Export exact committed backend inputs
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/backend-source" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: backend-image-inputs
          workspaces: ${{ runner.temp }}/backend-source/source -> target
      - name: Build backend image binary
        run: |
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/backend-source" \
            --commit "${{ steps.source.outputs.commit }}" --receipt "$RUNNER_TEMP/backend-build-execution.json" \
            --generated target -- cargo build --locked --release -p nyxid --bin nyxid-server \
            --features gcp-kms --message-format=json-render-diagnostics > "$RUNNER_TEMP/backend-build.jsonl"
      - name: Check backend Docker embedded assets
        working-directory: ${{ runner.temp }}/backend-source/source
        run: python3 scripts/check-backend-docker-embeds.py --build-messages "$RUNNER_TEMP/backend-build.jsonl"

  # Final image extraction supersedes the former cache-only backend image smoke.
  artifact-packaging:
    name: Artifact Packaging
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.packaging == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend_image == 'true' || needs.changes.outputs.apt == 'true' || needs.changes.outputs.apk == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/artifact-packaging.yml

  release-signing:
    name: Release Signing Policy
    permissions:
      contents: read
    uses: ./.github/workflows/release-signing.yml

  signing-rehearsal:
    name: Signing Rehearsal
    needs: [artifact-packaging, release-signing]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/security-release-rehearsal.yml

  machine-native:
    name: Machine Native Acceptance
    permissions:
      contents: read
    uses: ./.github/workflows/machine-native-acceptance.yml

  # ---------------------------------------------------------------------------
  # Rust: CLI / node-agent build + test (no DB required)
  # ---------------------------------------------------------------------------
  machine-container:
    name: Machine Container E2E
    needs: changes
    permissions:
      contents: read
      attestations: read
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.machine == 'true'
    runs-on: ubuntu-latest
    # The additional 100 real full-image probes can consume up to 25 minutes
    # at the unchanged three-browser-probe observation bounds.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Export exact committed image inputs
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/image-source" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build machine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image-source/source
          file: ${{ runner.temp }}/image-source/source/cli/Dockerfile.machine
          build-args: |
            NYXID_GIT_HASH=${{ steps.source.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          load: true
          tags: nyxid-node-machine:ci
          cache-from: type=gha,scope=machine-pr
          cache-to: type=gha,mode=max,scope=machine-pr
      - name: Build updater E2E image with verified APK inputs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image-source/source
          file: ${{ runner.temp }}/image-source/source/cli/Dockerfile.machine-updater
          target: e2e
          build-args: |
            NYXID_GIT_HASH=${{ steps.source.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          load: true
          tags: nyxid-machine-updater-e2e:local
          cache-from: type=gha,scope=updater-pr
          cache-to: type=gha,mode=max,scope=updater-pr
      - name: Build production updater image with verified APK inputs
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image-source/source
          file: ${{ runner.temp }}/image-source/source/cli/Dockerfile.machine-updater
          target: production
          build-args: |
            NYXID_GIT_HASH=${{ steps.source.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          load: true
          tags: nyxid-machine-updater:production-test
          cache-from: type=gha,scope=updater-pr
      - name: Verify exported image inputs after build
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: python3 scripts/export-build-source.py verify --destination "$RUNNER_TEMP/image-source" --commit "${{ steps.source.outputs.commit }}"
      - name: Build trusted fixture overlay on the actual machine image
        run: docker build --build-arg MACHINE_IMAGE=nyxid-node-machine:ci -f cli/tests/Dockerfile.machine -t nyxid-machine-e2e:ci .
      - name: Time 100 actual Debian Chromium probes without registration or persistent mounts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/machine-container-evidence"
          docker volume ls --format '{{.Name}}' | sort > "$RUNNER_TEMP/machine-container-evidence/volumes-before.txt"
          docker run --rm --init --name nyxid-machine-probe-acceptance --shm-size=512m \
            --security-opt seccomp=cli/resources/machine-container/seccomp.json \
            --entrypoint python3 nyxid-machine-e2e:ci \
            /test/machine_probe_acceptance.py --disposable --binary /usr/local/bin/nyxid --container --samples 100 \
            2>&1 | tee "$RUNNER_TEMP/machine-container-evidence/probe-timings.txt"
          docker volume ls --format '{{.Name}}' | sort > "$RUNNER_TEMP/machine-container-evidence/volumes-after.txt"
          diff -u "$RUNNER_TEMP/machine-container-evidence/volumes-before.txt" "$RUNNER_TEMP/machine-container-evidence/volumes-after.txt"
          test -z "$(docker ps -aq --filter name='^/nyxid-machine-probe-acceptance$')"
      - name: Preserve fixed-label full-image timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: machine-container-amd64-probe-timings
          path: ${{ runner.temp }}/machine-container-evidence/probe-timings.txt
          if-no-files-found: error
          retention-days: 14
      - name: Verify sandbox, isolation, saved logins, takeover and live desktop
        run: |
          docker run --rm --shm-size=256m --security-opt seccomp=cli/resources/machine-container/seccomp.json nyxid-machine-e2e:ci
          python3 cli/tests/machine_mount_denied_profile.py cli/resources/machine-container/seccomp.json /tmp/nyxid-machine-deny-mount.json
          docker run --rm --shm-size=256m --security-opt seccomp=/tmp/nyxid-machine-deny-mount.json nyxid-machine-e2e:ci
      - name: Verify existing-profile migration, signed updates and rollback
        env:
          MACHINE_IMAGE: nyxid-node-machine:ci
          UPDATER_E2E_IMAGE: nyxid-machine-updater-e2e:local
          MACHINE_TEST_SECCOMP: /tmp/nyxid-machine-deny-mount.json
        run: sh cli/tests/machine_updater_e2e.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install command-rendering dependencies
        run: npm ci --ignore-scripts --prefix frontend
      - name: Verify read-only production updater and rendered commands
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPDATER_PRODUCTION_IMAGE: nyxid-machine-updater:production-test
        run: node cli/tests/machine_updater_production.mjs
      - name: Remove test images and build cache
        if: always()
        run: |
          docker image rm -f nyxid-machine-e2e:ci nyxid-node-machine:ci nyxid-machine-updater-e2e:local nyxid-machine-updater:production-test || true
          docker builder prune -f

  cli-test:
    name: CLI Test
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cli
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Build CLI
        run: cargo build --locked -p nyxid-cli

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Test saved-login extension and signed package freshness
        run: node --test cli/tests/machine_filler.test.mjs

      - name: Run CLI tests
        run: cargo nextest run -p nyxid-cli -p nyxid-machine -p nyxid-machine-updater --profile ci

      - name: Publish test summary
        if: always()
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: target/nextest/ci/junit.xml
          show: fail

      - name: Upload CLI test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-cli
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Rust: build with feature flags (KMS providers). Backend-only build.
  # ---------------------------------------------------------------------------
  rust-features:
    name: Rust Features (${{ matrix.features }})
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: aws-kms
            cache-suffix: aws-kms
          - features: gcp-kms
            cache-suffix: gcp-kms
          - features: aws-kms,gcp-kms
            cache-suffix: aws-and-gcp-kms
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: features-${{ matrix.cache-suffix }}
      - name: Build with --features ${{ matrix.features }}
        run: python3 .github/scripts/ci_resources.py features-${{ matrix.cache-suffix }} cargo build --locked -p nyxid --features ${{ matrix.features }}
      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resources-rust-features-${{ matrix.cache-suffix }}
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Frontend: lint, type-check, test, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use reviewed npm11 installer
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/bootstrap-build-tool.py" npm --bin-dir "$RUNNER_TEMP/nyxid-node-tools"
          echo "$RUNNER_TEMP/nyxid-node-tools" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Mobile: committed native state, unit tests, and type-check
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../scripts/test-mobile-yaml-compat.cjs
      - name: Prove production bundle excludes build-only glob modules
        run: node ../scripts/check-mobile-bundle.cjs
      - run: pnpm check:native-sync
      - run: pnpm test
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # CLI wizard bundle: source-closure freshness check.
  #
  # The CLI embeds the React wizard bundle at `cli/src/wizard/assets/index.html`
  # via `rust_embed`. We commit the prebuilt artifact so `cargo build --locked -p
  # nyxid-cli` doesn't need a Node toolchain. To detect drift, `build:wizard`
  # also writes the wizard's full module graph to
  # `cli/src/wizard/bundle-meta/index.manifest` and a SHA-256 over every
  # source file in that graph (+ package-lock, vite config, node-version) to
  # `cli/src/wizard/bundle-meta/index.hash`.
  #
  # This job recomputes the hash from sources and fails if it no longer
  # matches the committed hash -- i.e. someone edited wizard source without
  # running `npm --prefix frontend run build:wizard`. Because the check is
  # source-only, it is immune to byte-level non-determinism between Vite /
  # esbuild versions that previously caused spurious failures on unrelated
  # PRs. Runs in parallel with `cli-test`; overall pipeline wall-clock is
  # unchanged. See CONTRIBUTING.md § CLI Wizard Bundle for the rebuild
  # workflow.
  # ---------------------------------------------------------------------------
  wizard-bundle-freshness:
    name: CLI Wizard Bundle Freshness
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.wizard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wizard-freshness
      - name: Verify wizard bundle freshness
        run: cargo test --locked -p nyxid-cli --test wizard_bundle_freshness
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
      - name: Verify final wizard seal against source provenance
        run: |
          python3 scripts/bootstrap-build-tool.py npm --bin-dir "$RUNNER_TEMP/wizard-npm"
          "$RUNNER_TEMP/wizard-npm/npm" ci --prefix frontend
          node frontend/scripts/seal-shipped-composition.mjs wizard verify

  # ---------------------------------------------------------------------------
  # SDK: build all packages
  # ---------------------------------------------------------------------------
  sdk:
    name: SDK Build
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Use reviewed npm11 installer
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/bootstrap-build-tool.py" npm --bin-dir "$RUNNER_TEMP/nyxid-node-tools"
          echo "$RUNNER_TEMP/nyxid-node-tools" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run build

  # ===========================================================================
  # Code coverage gates (issue #785).
  #
  # Three measurement jobs (Backend / CLI / Frontend) each:
  #   1. Measure line coverage on the PR head and FAIL if it drops below the
  #      enforced threshold (Rust: `cargo llvm-cov --fail-under-lines`;
  #      Frontend: vitest `coverage.thresholds.lines` in vite.config.ts).
  #   2. Emit a machine-readable line-% number + an lcov report.
  #   3. On pull_request events, also compare with the BASE branch so the
  #      comment can show a per-component line-% delta (AC #4). Backend base
  #      measurement runs in parallel and reuses an exact-commit report when
  #      available. Base results remain best-effort and never gate the head.
  #   4. Upload the report + a tiny `coverage-<component>.json` summary as a CI
  #      artifact (AC #6). The summary files feed the PR-comment job.
  #
  # Enforced thresholds (fail the PR if line % drops below):
  #   Backend (nyxid)      >= 73%   (currently ~74.8%)
  #   CLI (nyxid-cli)      >= 64%   (currently ~65.5%)
  #   Frontend (vitest)    >= 15%   (currently ~41%)
  #
  # RATCHET PLAN: Future ratchets must only move thresholds UP. Raise each Rust
  # `--fail-under-lines` gate and matching `coverage_summary.py` summary
  # threshold together when coverage rises; never lower a threshold to make a
  # failing run pass. Keep the frontend summary threshold in sync with
  # `coverage.thresholds.lines` in frontend/vite.config.ts.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Backend (nyxid) line coverage. Mirrors `backend-test`: uses the same explicit
  # single-node replica set so DB and transaction tests run. PR-head coverage
  # retains its threshold; the informational base comparison runs separately.
  # ---------------------------------------------------------------------------
  coverage-backend:
    name: Coverage (Backend)
    needs: changes
    # Cache a report for every rollup tip, including documentation-only pushes.
    if: inputs.force-all || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rollup-')) || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # A live suite exceeded 45 minutes on a slow hosted runner. Allow headroom
    # for compilation, complete test execution and export without retrying tests.
    timeout-minutes: 90
    # Coverage counters do not require full DWARF; retain line locations.
    # Resource samples record whether compilation approaches runner limits.
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      # Merge per-test coverage into four profiles per binary to bound disk use.
      LLVM_PROFILE_FILE_NAME: "nyxid-%4m.profraw"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Identify coverage measurement inputs
        id: coverage-identity
        run: python3 .github/scripts/coverage_identity.py
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Start transaction-capable MongoDB
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage-backend
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146

      # Head: instrument + measure WITHOUT the gate, emitting an lcov report and
      # a one-line summary JSON. The threshold is enforced as the final step in
      # this job (below) so the report, summary, and base delta are always
      # produced — even on a regression — and surface in the PR comment.
      # `report` is package-scoped so the % isn't diluted by the rest of the
      # workspace (whose tests this job does not run).
      # Match backend-test's process isolation and bounded, no-retry CI profile.
      - name: Measure (head)
        run: >-
          python3 .github/scripts/ci_resources.py coverage-test
          cargo llvm-cov nextest --package nyxid --profile ci --no-report
      - name: Test MongoDB diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        run: bash .github/scripts/dump-test-mongodb.sh
      - name: Export head coverage
        run: |
          cargo llvm-cov report --package nyxid --lcov --output-path coverage-backend.lcov
          cargo llvm-cov report --package nyxid --json --summary-only --output-path coverage-backend.raw.json

      - name: Build head summary JSON
        run: |
          python3 .github/scripts/coverage_summary.py \
            backend "Backend (nyxid)" 73 \
            coverage-backend.raw.json coverage-backend.json

      # Push and publish runs make their measured head available to PRs whose
      # base is this exact commit. Recipe or runner-image changes invalidate it.
      - name: Prepare reusable base report
        if: github.event_name != 'pull_request'
        run: cp coverage-backend.raw.json coverage-backend.base.json
      - name: Cache reusable base report
        if: github.event_name != 'pull_request' && steps.coverage-identity.outputs.reusable == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: coverage-backend.base.json
          key: coverage-backend-base-v2-${{ github.sha }}-${{ steps.coverage-identity.outputs.fingerprint }}

      # Re-reads the existing profdata (no re-run). The report and summary are
      # produced before a regression fails the job and remain available to the
      # PR comment.
      - name: Enforce coverage gate (head)
        run: cargo llvm-cov report --package nyxid --fail-under-lines 73

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'backend-coverage-head' || 'coverage-backend' }}
          path: |
            coverage-backend.lcov
            coverage-backend.json
          if-no-files-found: warn

      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resources-coverage-backend
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # The base percentage is informational. Reuse only a report for the exact
  # base SHA, measurement recipe and runner image; otherwise measure afresh
  # as before on the base commit, in parallel with PR-head coverage.
  coverage-backend-base:
    name: Coverage (Backend Base)
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      LLVM_PROFILE_FILE_NAME: "nyxid-%4m.profraw"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Identify coverage measurement inputs
        id: coverage-identity
        run: python3 .github/scripts/coverage_identity.py
      - name: Restore exact base report
        if: steps.coverage-identity.outputs.reusable == 'true'
        id: base-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: coverage-backend.base.json
          key: coverage-backend-base-v2-${{ github.event.pull_request.base.sha }}-${{ steps.coverage-identity.outputs.fingerprint }}
      - name: Checkout base tree
        if: steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-coverage
      - name: Prepare backend memory reserve
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Start transaction-capable MongoDB
        if: steps.base-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Install system dependencies
        if: steps.base-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, llvm-tools-preview, rustfmt
        if: steps.base-cache.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: steps.base-cache.outputs.cache-hit != 'true'
        with:
          key: coverage-backend-base
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        if: steps.base-cache.outputs.cache-hit != 'true'
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.146
      - name: Measure base branch
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: base-coverage
        run: >-
          python3 "$GITHUB_WORKSPACE/.github/scripts/ci_resources.py" coverage-test
          cargo llvm-cov nextest --package nyxid --profile ci --no-report
      - name: Test MongoDB diagnostics
        if: (failure() || cancelled()) && steps.base-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash "$GITHUB_WORKSPACE/.github/scripts/dump-test-mongodb.sh"
      - name: Export base coverage
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: base-coverage
        run: |
          cargo llvm-cov report --package nyxid --json --summary-only \
            --output-path "$GITHUB_WORKSPACE/coverage-backend.base.json"
      - name: Cache measured base report
        if: steps.base-cache.outputs.cache-hit != 'true' && steps.coverage-identity.outputs.reusable == 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: coverage-backend.base.json
          key: coverage-backend-base-v2-${{ github.event.pull_request.base.sha }}-${{ steps.coverage-identity.outputs.fingerprint }}
      - name: Upload base report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-base-report
          path: coverage-backend.base.json
          if-no-files-found: warn

      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resources-coverage-backend-base
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # Restore the original PR artifact contract after the parallel base lookup.
  # This is informational; the coverage-backend job remains the threshold gate.
  coverage-backend-summary:
    name: Coverage (Backend Summary)
    needs: [changes, coverage-backend, coverage-backend-base]
    if: always() && github.event_name == 'pull_request' && (needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download head report
        id: head-report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage-head
        continue-on-error: true
      - name: Download base report
        if: steps.head-report.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-base-report
        continue-on-error: true
      - name: Merge base line % into summary
        if: steps.head-report.outcome == 'success'
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-backend.json coverage-backend.base.json
      - name: Upload coverage artifact
        if: steps.head-report.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-backend
          path: |
            coverage-backend.lcov
            coverage-backend.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # CLI (nyxid-cli) line coverage. No DB needed (mirrors `cli-test`).
  # ---------------------------------------------------------------------------
  coverage-cli:
    name: Coverage (CLI)
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: coverage-cli
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Measure WITHOUT the gate (enforced as the final step below). `report` is
      # package-scoped so the % isn't diluted by the rest of the workspace.
      - name: Measure (head)
        run: |
          cargo llvm-cov --package nyxid-cli --no-report
          cargo llvm-cov report --package nyxid-cli --lcov --output-path coverage-cli.lcov
          cargo llvm-cov report --package nyxid-cli --json --summary-only --output-path coverage-cli.raw.json

      - name: Build head summary JSON
        run: |
          python3 .github/scripts/coverage_summary.py \
            cli "CLI (nyxid-cli)" 64 \
            coverage-cli.raw.json coverage-cli.json

      - name: Measure base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base-coverage "$BASE_REF"
          ( cd ../base-coverage && cargo llvm-cov --package nyxid-cli --no-report \
              && cargo llvm-cov report --package nyxid-cli --json --summary-only \
                 --output-path "$GITHUB_WORKSPACE/coverage-cli.base.json" )

      - name: Merge base line % into summary
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-cli.json coverage-cli.base.json

      # Enforce the threshold LAST (see backend job for rationale).
      - name: Enforce coverage gate (head)
        run: cargo llvm-cov report --package nyxid-cli --fail-under-lines 64

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-cli
          path: |
            coverage-cli.lcov
            coverage-cli.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Frontend (vitest --coverage). The line threshold is enforced by
  # `coverage.thresholds.lines` in frontend/vite.config.ts, so `test:coverage`
  # exits non-zero on a regression. We read the line % from the v8
  # json-summary reporter (coverage/coverage-summary.json).
  # ---------------------------------------------------------------------------
  coverage-frontend:
    name: Coverage (Frontend)
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use reviewed npm11 installer
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/bootstrap-build-tool.py" npm --bin-dir "$RUNNER_TEMP/nyxid-node-tools"
          echo "$RUNNER_TEMP/nyxid-node-tools" >> "$GITHUB_PATH"
      - run: npm ci

      # Head: measure WITHOUT the gate (override the line threshold to 0) so the
      # coverage summary is always produced; the threshold is enforced as the
      # final step below — mirroring the Rust jobs — so a regression still
      # surfaces the failing number in the PR comment.
      - name: Measure (head)
        run: npm run test:coverage -- --coverage.thresholds.lines=0

      - name: Build head summary JSON
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/coverage_summary.py \
            frontend "Frontend (vitest)" 15 \
            frontend/coverage/coverage-summary.json coverage-frontend.json

      # Base: best-effort. Check out the base tree, install, run coverage
      # WITHOUT the threshold gate (--coverage.thresholds.lines=0) so a low base
      # never errors here.
      - name: Measure base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base-coverage "$BASE_REF"
          ( cd ../base-coverage/frontend \
              && npm ci \
              && env NODE_ENV=test npx vitest run --coverage --coverage.thresholds.lines=0 )
          cp ../base-coverage/frontend/coverage/coverage-summary.json \
             frontend-coverage-base.json

      - name: Merge base line % into summary
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-frontend.json frontend-coverage-base.json

      # Enforce the FE threshold LAST, reading the already-produced summary (no
      # re-run) so a regression fails the job *and* still surfaces in the PR
      # comment. Keep this threshold in sync with vite.config.ts (lines: 15).
      - name: Enforce coverage gate (head)
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json, sys
          total = json.load(open("frontend/coverage/coverage-summary.json"))["total"]
          pct = float(total["lines"]["pct"])
          threshold = 15.0
          print(f"Frontend line coverage: {pct}% (threshold {threshold}%)")
          sys.exit(0 if pct >= threshold else 1)
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
            coverage-frontend.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # PR comment payload: aggregate the three coverage summaries into one sticky
  # comment body showing each component's line %, its enforced threshold, and
  # the delta vs. the base branch (AC #4). Runs only on pull_request, after the
  # measurement jobs, and tolerates skipped components (docs-only PR -> some
  # jobs skip).
  #
  # This job only BUILDS the comment body and uploads it as an artifact; the
  # actual posting happens in coverage-comment.yml. Posting needs a
  # write-scoped token, but `pull_request` runs from forks get a read-only
  # GITHUB_TOKEN (the job's `permissions:` block is capped, not honored), so an
  # in-line `issues.createComment` 403s on every fork PR. The companion
  # `workflow_run` workflow runs from the default branch with the base repo's
  # token and never executes PR/fork code, so it can post safely.
  # ---------------------------------------------------------------------------
  coverage-comment:
    name: Coverage Comment Payload
    if: always() && github.event_name == 'pull_request'
    needs:
      - coverage-backend-summary
      - coverage-cli
      - coverage-frontend
    runs-on: ubuntu-latest
    permissions:
      # `actions/checkout` needs contents:read; declaring any permissions block
      # otherwise drops all unlisted scopes to none and the checkout 403s. No
      # write scopes here -- this job never touches the PR conversation.
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download coverage summaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
      - name: Build comment body
        run: |
          python3 .github/scripts/coverage_comment.py \
            coverage-artifacts > coverage-comment.md
          cat coverage-comment.md
      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload coverage comment payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Deliberately NOT matching `coverage-*` so the pattern download
          # above never picks this payload up on a re-run.
          name: pr-coverage-comment
          path: |
            coverage-comment.md
            pr-number.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Aggregator: a single status check that summarises the whole pipeline.
  #
  # Branch protection / required-checks rules should require ONLY this job by
  # name (`CI Pipeline`). Conditional jobs above may legitimately be skipped
  # (e.g. a docs-only PR), and listing them individually as required would
  # leave PRs stuck pending. This job runs unconditionally (`if: always()`)
  # and treats `success` and `skipped` as OK; `failure` or `cancelled` in
  # any upstream job fails the gate.
  #
  # Reference: https://devopsdirective.com/posts/2025/08/github-actions-required-checks-for-conditional-jobs/
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI Pipeline
    if: always()
    needs:
      - changes
      - workflow-permissions
      - apt-inputs
      - apk-inputs
      - catalog-maintenance
      - security-scans
      - cursor-plugin-validate
      - codex-plugin-validate
      - claude-plugin-validate
      - oracle-worker-test
      - rust-fmt
      - rust-clippy
      - backend-test
      - permissions-test
      - backend-billing-smoke
      - backend-image-inputs
      - artifact-packaging
      - release-signing
      - signing-rehearsal
      - machine-native
      - cli-test
      - machine-container
      - rust-features
      - frontend
      - mobile
      - wizard-bundle-freshness
      - sdk
      - coverage-backend
      - coverage-cli
      - coverage-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded or were skipped intentionally
        env:
          # NOTE: `coverage-comment` is intentionally NOT gated here -- it is an
          # informational PR comment, not a correctness check. The three
          # `coverage-*` measurement jobs ARE gated: they fail when line
          # coverage drops below the enforced threshold.
          RESULTS: |
            changes=${{ needs.changes.result }}
            workflow-permissions=${{ needs.workflow-permissions.result }}
            apt-inputs=${{ needs.apt-inputs.result }}
            apk-inputs=${{ needs.apk-inputs.result }}
            catalog-maintenance=${{ needs.catalog-maintenance.result }}
            security-scans=${{ needs.security-scans.result }}
            cursor-plugin-validate=${{ needs.cursor-plugin-validate.result }}
            codex-plugin-validate=${{ needs.codex-plugin-validate.result }}
            claude-plugin-validate=${{ needs.claude-plugin-validate.result }}
            oracle-worker-test=${{ needs.oracle-worker-test.result }}
            rust-fmt=${{ needs.rust-fmt.result }}
            rust-clippy=${{ needs.rust-clippy.result }}
            backend-test=${{ needs.backend-test.result }}
            permissions-test=${{ needs.permissions-test.result }}
            backend-billing-smoke=${{ needs.backend-billing-smoke.result }}
            backend-image-inputs=${{ needs.backend-image-inputs.result }}
            artifact-packaging=${{ needs.artifact-packaging.result }}
            release-signing=${{ needs.release-signing.result }}
            signing-rehearsal=${{ needs.signing-rehearsal.result }}
            machine-native=${{ needs.machine-native.result }}
            cli-test=${{ needs.cli-test.result }}
            machine-container=${{ needs.machine-container.result }}
            rust-features=${{ needs.rust-features.result }}
            frontend=${{ needs.frontend.result }}
            mobile=${{ needs.mobile.result }}
            wizard-bundle-freshness=${{ needs.wizard-bundle-freshness.result }}
            sdk=${{ needs.sdk.result }}
            coverage-backend=${{ needs.coverage-backend.result }}
            coverage-cli=${{ needs.coverage-cli.result }}
            coverage-frontend=${{ needs.coverage-frontend.result }}
        run: |
          set -eu
          echo "Job results:"
          failed=0
          while IFS='=' read -r job result; do
            [ -z "$job" ] && continue
            printf '  %s=%s\n' "$job" "$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Job '$job' did not pass (result=$result)"
                failed=1
                ;;
            esac
          done <<< "$RESULTS"
          exit "$failed"
