name: CI

on:
  pull_request:
    # Rollup PRs must be gated with the same CI coverage as main/dev PRs.
    # Also validate fixes targeting the Oracle retirement branch.
    branches: [main, dev, 'rollup-*', 'chore/retire-builtin-oracle']
  push:
    # `main` is intentionally not listed here -- pushes to main are gated
    # through publish-images.yml, which calls this workflow via workflow_call.
    # Listing main twice would cause CI to run on every merge commit twice.
    branches: [dev, 'rollup-*']
  # Allow other workflows (publish-images, release) to reuse this one as a
  # gate via `uses: ./.github/workflows/ci.yml`. Callers should pass
  # `force-all: true` to skip path filtering and run the full suite as a
  # release/publish gate.
  workflow_call:
    inputs:
      force-all:
        description: >-
          When true, run every job regardless of which paths changed.
          Used by publish-images.yml so a release-gate run is always a
          full validation.
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Preserve file/line diagnostics while shrinking compiled dependency caches.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Backend test and coverage jobs start an explicit single-node replica set and use this
# authoritative URI. Multi-document transaction tests must never fall back to a
# standalone developer mongod or silently skip because topology is unsupported.
  NYXID_TEST_DATABASE_URL: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true

jobs:
  # ---------------------------------------------------------------------------
  # Detect which areas of the monorepo changed so downstream jobs can skip
  # work that isn't relevant to this PR. Always runs first; outputs feed the
  # `if:` guards on every other job.
  #
  # Filter conventions:
  #   - `backend`    = backend crate OR shared workspace files (root
  #                    Cargo.toml/Cargo.lock/nextest config) OR
  #                    `cloud-auth` (depended on by backend, NyxID#716)
  #   - `cli`        = cli crate OR shared workspace files OR `cloud-auth`
  #                    (also depended on by the CLI's node agent)
  #     => a Cargo.lock or cloud-auth change fires BOTH `backend` and
  #        `cli`, since they are members of the same `[workspace]` and
  #        share the lock file + the cloud-auth dependency.
  #   - `rust`       = backend OR cli OR shared workspace files (workspace-wide
  #                    fmt + clippy)
  #   - `wizard`  = anything that could change the committed wizard bundle
  #                 hash (frontend sources, .node-version, cli wizard glue)
  #   - `ci`      = this workflow itself; forces a full run when changed
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      backend_image: ${{ steps.filter.outputs.backend_image }}
      cli: ${{ steps.filter.outputs.cli }}
      machine: ${{ steps.filter.outputs.machine }}
      permissions: ${{ steps.filter.outputs.permissions }}
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      sdk: ${{ steps.filter.outputs.sdk }}
      wizard: ${{ steps.filter.outputs.wizard }}
      cursor_plugin: ${{ steps.filter.outputs.cursor_plugin }}
      codex_plugin: ${{ steps.filter.outputs.codex_plugin }}
      claude_plugin: ${{ steps.filter.outputs.claude_plugin }}
      oracle_worker: ${{ steps.filter.outputs.oracle_worker }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v6
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check private security-report routing
        run: |
          python3 -m unittest discover -s scripts -p 'test_security_reporting.py'
          python3 scripts/check-security-reporting.py
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Shared workspace files (Cargo.toml / Cargo.lock / nextest config)
          # are duplicated into both `backend` and `cli` filters by design:
          # any change to the shared lock file must retest both crates,
          # since they are members of the same `[workspace]`.
          # YAML anchors aren't used here -- aliased sequences expand to
          # nested lists in js-yaml, which paths-filter does not flatten.
          filters: |
            backend_image:
              - 'scripts/docker-dependency-recipe.py'
              - 'scripts/test-docker-dependency-recipe.py'
              - 'backend/Dockerfile'
              - '.dockerignore'
              - '.github/scripts/prepare-backend-runner.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-images.yml'
            permissions:
              - 'permissions/**'
              - 'scripts/test-drive-permissions-poc.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
            machine:
              - 'frontend/scripts/machine-seccomp.ts'
              - 'frontend/src/schemas/machines.ts'
              - 'cli/src/commands/update_attestation*'
              - 'cli/src/commands/update_attestation/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'cli/src/node/machine/**'
              - 'cli/resources/machine-browser/**'
              - 'cli/resources/machine-container/**'
              - 'cli/container/**'
              - 'cli/Dockerfile.machine'
              - 'cli/Dockerfile.machine-updater'
              - 'cli/src/machine_updater/**'
              - 'cli/src/commands/machine_native_update.rs'
              - 'cli/tests/machine*'
              - 'cli/tests/Dockerfile.machine'
              - 'cli/tests/Dockerfile.updater-browser'
              - 'cli/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
            backend:
              - 'scripts/docker-dependency-recipe.py'
              - 'scripts/test-docker-dependency-recipe.py'
              - 'backend/**'
              - 'permissions/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'integrations/oracle/cdp-worker/worker.mjs'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'docs/AI_AGENT_PLAYBOOK.md'
              - '.dockerignore'
              - 'scripts/check-backend-docker-embeds.py'
              - 'scripts/check-rci-backend-boundary.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            cli:
              - 'cli/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'skills/nyxid/scripts/**'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            rust:
              # `mcp-demo` is the fourth workspace member; workspace-wide
              # fmt + clippy must re-run on changes there even though no
              # job currently builds or tests it directly. `cloud-auth`
              # is depended on by backend + cli (NyxID#716) so it also
              # needs to trigger workspace-wide checks.
              - 'backend/**'
              - 'integrations/oracle/cdp-worker/worker.mjs'
              - 'cli/**'
              - 'machine/**'
              - 'machine-updater/**'
              - 'cloud-auth/**'
              - 'service-adapters/**'
              - 'nyxid-crypto/**'
              - 'mcp-demo/**'
              - 'permissions/**'
              - 'docs/AI_AGENT_PLAYBOOK.md'
              - '.dockerignore'
              - 'scripts/check-backend-docker-embeds.py'
              - 'scripts/check-rci-backend-boundary.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/nextest.toml'
            frontend:
              - 'frontend/**'
              - '.node-version'
            mobile:
              - 'mobile/**'
              - '.node-version'
            sdk:
              - 'sdk/**'
              - '.node-version'
            # Inputs hashed by `cli/tests/wizard_bundle_freshness.rs`:
            #   - every file listed in `cli/src/wizard/bundle-meta/index.manifest`
            #     (always under `frontend/`).
            #   - EXTRAS: `frontend/package-lock.json`,
            #     `frontend/vite.wizard.config.ts`, `frontend/wizard.html`,
            #     `frontend/vite-plugins/wizard-manifest.ts`, `.node-version`.
            #   - the committed manifest + hash files themselves.
            #   - the test source file.
            # Keep this filter a superset of the EXTRAS list in that test.
            wizard:
              - 'frontend/**'
              - '.node-version'
              - 'cli/src/wizard/**'
              - 'cli/tests/wizard_bundle_freshness.rs'
            cursor_plugin:
              - 'integrations/cursor-plugin/**'
              - '.cursor-plugin/**'
              - 'scripts/validate-cursor-plugin.py'
            codex_plugin:
              - 'integrations/codex-plugin/**'
              - 'integrations/plugin-source/**'
              - '.agents/plugins/**'
              - 'scripts/build-codex-plugin.sh'
              - 'scripts/sync-plugins.py'
            claude_plugin:
              - 'integrations/claude-plugin/**'
              - 'integrations/plugin-source/**'
              - '.claude-plugin/**'
              - 'scripts/validate-claude-plugin.py'
              - 'scripts/sync-plugins.py'
            oracle_worker:
              - 'integrations/oracle/cdp-worker/**'
              - '.node-version'
            # Any workflow change forces a full run -- stops a broken
            # publish-gate or release pipeline from sneaking through under
            # path filtering.
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'

  # ---------------------------------------------------------------------------
  # Reusable workflow permissions: a ci.yml job requesting a scope that the
  # Publish Images `ci-gate` call does not grant passes on PRs but makes Publish
  # Images fail to start on main and tags. Cheap enough to run every time.
  # ---------------------------------------------------------------------------
  workflow-permissions:
    name: Workflow Permissions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Check reusable workflow permissions against their callers
        run: python3 scripts/check-reusable-workflow-permissions.py

  # ---------------------------------------------------------------------------
  # Permission engine: no database or Google credentials required.
  # ---------------------------------------------------------------------------
  permissions-test:
    name: Google Permissions
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.permissions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: permissions-test
      - run: cargo fmt -p nyxid-permissions --check
      - run: cargo clippy -p nyxid-permissions --all-targets --locked -- -D warnings
      - run: cargo test -p nyxid-permissions --locked
      - run: python3 scripts/test-drive-permissions-poc.py

  # Cursor plugin: manifest, component, MCP variable, and marketplace checks.
  cursor-plugin-validate:
    name: Cursor Plugin Validate
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cursor_plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Cursor plugin
        run: python3 scripts/validate-cursor-plugin.py

  # Codex / OpenAI plugin: generated files, manifest, MCP, skills, and
  # package allowlist.
  codex-plugin-validate:
    name: Codex Plugin Validate
    permissions:
      contents: read
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.codex_plugin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check generated plugin files match integrations/plugin-source
        run: python3 scripts/sync-plugins.py --check
      - name: Validate Codex plugin
        run: scripts/build-codex-plugin.sh --check

  # Claude plugin: manifest, remote MCP, skills, and directory bundle limits.
  # The repository-limit step runs on every PR because the Claude directory
  # also reads repository-wide size and entry counts; the package steps run
  # only when the plugin or its validator changes.
  claude-plugin-validate:
    name: Claude Plugin Validate
    permissions:
      contents: read
    needs: changes
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.284
      PACKAGE_CHANGED: ${{ inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.claude_plugin == 'true' }}
    steps:
      - uses: actions/checkout@v6
      - name: Check repository limits for the Claude directory
        run: python3 scripts/validate-claude-plugin.py --repo-only
      - uses: actions/setup-node@v6
        if: env.PACKAGE_CHANGED == 'true'
        with:
          node-version-file: .node-version
      - name: Install pinned Claude Code
        if: env.PACKAGE_CHANGED == 'true'
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Check generated plugin files match integrations/plugin-source
        if: env.PACKAGE_CHANGED == 'true'
        run: python3 scripts/sync-plugins.py --check
      - name: Validate Claude plugin
        if: env.PACKAGE_CHANGED == 'true'
        run: python3 scripts/validate-claude-plugin.py --require-claude
      - name: Validate Claude marketplace
        if: env.PACKAGE_CHANGED == 'true'
        run: claude plugin validate --strict .

  oracle-worker-test:
    name: Oracle Worker Test
    permissions:
      contents: read
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.oracle_worker == 'true'
    runs-on: ubuntu-latest
    # Cold Chromium dependency downloads need room alongside the browser suite.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/oracle/cdp-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run test:browser
        env:
          NYXID_TEST_BROWSER: '1'

  # ---------------------------------------------------------------------------
  # Rust: format check
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: Rust Format
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Rust: clippy lint
  # ---------------------------------------------------------------------------
  rust-clippy:
    name: Rust Clippy
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Workspace all-target analysis exhausted 16 GiB RAM + 3 GiB swap.
    # Retain every target while bounding simultaneous compiler memory use.
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: rust-clippy
      - name: Check Clippy with resource samples
        run: python3 .github/scripts/ci_resources.py clippy cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rust: backend tests
  # Handler + service tests use the explicit NYXID_TEST_DATABASE_URL above. The
  # container is started as a single-node replica set so atomic rotation/binding
  # tests exercise real transactions rather than silently skipping.
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Test
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-tests.yml

  # Keep the standalone test-profile build and smoke assertion. It exercises
  # a different Cargo feature-unification path from the combined nextest run.
  backend-billing-smoke:
    name: Backend Billing Smoke
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same test-binary compile as backend-test; see the note there.
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Start transaction-capable MongoDB
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: backend-build
          save-if: 'false'
      - name: Billing route coverage smoke
        run: python3 .github/scripts/ci_resources.py billing-smoke cargo test -p nyxid billing_route_coverage_smoke -- --nocapture
      - name: Test MongoDB diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        run: bash .github/scripts/dump-test-mongodb.sh

      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: resources-backend-billing-smoke
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # Keep the production feature/profile and dep-info guard together while
  # letting the full backend tests run on their own runner.
  backend-image-inputs:
    name: Backend Image Inputs
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: backend-image-inputs-backend-image-inputs
      - name: Check dependency recipe invariants
        run: python3 scripts/test-docker-dependency-recipe.py
      - name: Build backend image binary
        run: cargo build --release -p nyxid --bin nyxid-server --features gcp-kms
      - name: Check backend Docker embedded assets
        run: python3 scripts/check-backend-docker-embeds.py

  # Exercise the image's compiler and release build when its infrastructure changes.
  backend-image-smoke:
    name: Backend Release Image
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend image memory reserve
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Locate published backend build cache
        id: backend-cache
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/nyxid/backend:buildcache-linux-amd64" >> "$GITHUB_OUTPUT"
      - name: Build backend release image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          build-args: |
            NYXID_GIT_HASH=${{ github.sha }}
            CARGO_BUILD_JOBS=2
          outputs: type=cacheonly
          push: false
          cache-from: |
            type=registry,ref=${{ steps.backend-cache.outputs.ref }}
          # Import only from the registry: even mode=min GHA export stalled for
          # ~40 minutes after compilation in #2052. Trusted publishing retains
          # compiler layers in the registry; PRs neither overwrite it nor use
          # Actions cache storage.
          provenance: false

  # ---------------------------------------------------------------------------
  # Rust: CLI / node-agent build + test (no DB required)
  # ---------------------------------------------------------------------------
  machine-container:
    name: Machine Container E2E
    needs: changes
    permissions:
      contents: read
      attestations: read
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.machine == 'true'
    runs-on: ubuntu-latest
    # Cold desktop package downloads can consume the former 45-minute budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Locate published machine build cache
        id: machine-cache
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/nyxid/nyxid-node-machine:buildcache-linux-amd64" >> "$GITHUB_OUTPUT"
      - name: Build machine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cli/Dockerfile.machine
          load: true
          tags: nyxid-node-machine:ci
          cache-from: |
            type=registry,ref=${{ steps.machine-cache.outputs.ref }}
          # Import only: registry publishing retains the full compiler layers.
      - name: Verify sandbox, isolation, saved logins, takeover and live desktop
        run: |
          docker build --build-arg MACHINE_IMAGE=nyxid-node-machine:ci -f cli/tests/Dockerfile.machine -t nyxid-machine-e2e:ci .
          docker run --rm --shm-size=256m --security-opt seccomp=cli/resources/machine-container/seccomp.json nyxid-machine-e2e:ci
          python3 cli/tests/machine_mount_denied_profile.py cli/resources/machine-container/seccomp.json /tmp/nyxid-machine-deny-mount.json
          docker run --rm --shm-size=256m --security-opt seccomp=/tmp/nyxid-machine-deny-mount.json nyxid-machine-e2e:ci
      - name: Verify existing-profile migration, signed updates and rollback
        env:
          MACHINE_IMAGE: nyxid-node-machine:ci
          MACHINE_TEST_SECCOMP: /tmp/nyxid-machine-deny-mount.json
        run: sh cli/tests/machine_updater_e2e.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install command-rendering dependencies
        run: npm ci --ignore-scripts --prefix frontend
      - name: Verify read-only production updater and rendered commands
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node cli/tests/machine_updater_production.mjs
      - name: Remove test images and build cache
        if: always()
        run: |
          docker image rm -f nyxid-machine-e2e:ci nyxid-node-machine:ci nyxid-machine-updater-e2e:local nyxid-machine-updater:production-test || true
          docker builder prune -f

  cli-test:
    name: CLI Test
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: cli-cli-test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Build CLI
        run: cargo build -p nyxid-cli

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Test saved-login extension and signed package freshness
        run: node --test cli/tests/machine_filler.test.mjs

      - name: Run CLI tests
        run: cargo nextest run -p nyxid-cli -p nyxid-machine -p nyxid-machine-updater --profile ci

      - name: Publish test summary
        if: always()
        uses: test-summary/action@v2.6
        with:
          paths: target/nextest/ci/junit.xml
          show: fail

      - name: Upload CLI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cli
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Rust: build with feature flags (KMS providers). Backend-only build.
  # ---------------------------------------------------------------------------
  rust-features:
    name: Rust Features (${{ matrix.features }})
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: aws-kms
            cache-suffix: aws-kms
          - features: gcp-kms
            cache-suffix: gcp-kms
          - features: aws-kms,gcp-kms
            cache-suffix: aws-and-gcp-kms
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend memory reserve
        run: bash .github/scripts/prepare-backend-runner.sh
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: features-${{ matrix.cache-suffix }}-rust-features
      - name: Build with --features ${{ matrix.features }}
        run: python3 .github/scripts/ci_resources.py features-${{ matrix.cache-suffix }} cargo build -p nyxid --features ${{ matrix.features }}
      - name: Upload resource samples
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: resources-rust-features-${{ matrix.cache-suffix }}
          path: ${{ runner.temp }}/nyxid-ci-resources
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Frontend: lint, type-check, test, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Mobile: committed native state, unit tests, and type-check
  # ---------------------------------------------------------------------------
  mobile:
    name: Mobile
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native-sync
      - run: pnpm test
      - run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # CLI wizard bundle: source-closure freshness check.
  #
  # The CLI embeds the React wizard bundle at `cli/src/wizard/assets/index.html`
  # via `rust_embed`. We commit the prebuilt artifact so `cargo build -p
  # nyxid-cli` doesn't need a Node toolchain. To detect drift, `build:wizard`
  # also writes the wizard's full module graph to
  # `cli/src/wizard/bundle-meta/index.manifest` and a SHA-256 over every
  # source file in that graph (+ package-lock, vite config, node-version) to
  # `cli/src/wizard/bundle-meta/index.hash`.
  #
  # This job recomputes the hash from sources and fails if it no longer
  # matches the committed hash -- i.e. someone edited wizard source without
  # running `npm --prefix frontend run build:wizard`. Because the check is
  # source-only, it is immune to byte-level non-determinism between Vite /
  # esbuild versions that previously caused spurious failures on unrelated
  # PRs. Runs in parallel with `cli-test`; overall pipeline wall-clock is
  # unchanged. See CONTRIBUTING.md § CLI Wizard Bundle for the rebuild
  # workflow.
  # ---------------------------------------------------------------------------
  wizard-bundle-freshness:
    name: CLI Wizard Bundle Freshness
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.wizard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: cli-cli-test
          save-if: 'false'
      - name: Verify wizard bundle freshness
        run: cargo test -p nyxid-cli --test wizard_bundle_freshness

  # ---------------------------------------------------------------------------
  # SDK: build all packages
  # ---------------------------------------------------------------------------
  sdk:
    name: SDK Build
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm run build

  # ===========================================================================
  # Code coverage gates (issue #785).
  #
  # Three measurement jobs (Backend / CLI / Frontend) each:
  #   1. Measure line coverage on the PR head and FAIL if it drops below the
  #      enforced threshold (Rust: `cargo llvm-cov --fail-under-lines`;
  #      Frontend: vitest `coverage.thresholds.lines` in vite.config.ts).
  #   2. Emit a machine-readable line-% number + an lcov report.
  #   3. On pull_request events, also compare with the BASE branch so the
  #      comment can show a per-component line-% delta (AC #4). Backend base
  #      reports reuse an exact-commit measurement when available; a cache miss
  #      reports N/A. Base results remain best-effort and never gate the head.
  #   4. Upload the report + a tiny `coverage-<component>.json` summary as a CI
  #      artifact (AC #6). The summary files feed the PR-comment job.
  #
  # Enforced thresholds (fail the PR if line % drops below):
  #   Backend (nyxid)      >= 73%   (currently ~74.8%)
  #   CLI (nyxid-cli)      >= 64%   (currently ~65.5%)
  #   Frontend (vitest)    >= 15%   (currently ~41%)
  #
  # RATCHET PLAN: Future ratchets must only move thresholds UP. Raise each Rust
  # `--fail-under-lines` gate and matching `coverage_summary.py` summary
  # threshold together when coverage rises; never lower a threshold to make a
  # failing run pass. Keep the frontend summary threshold in sync with
  # `coverage.thresholds.lines` in frontend/vite.config.ts.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Backend (nyxid) line coverage. Mirrors `backend-test`: uses the same explicit
  # single-node replica set so DB and transaction tests run. PR-head coverage
  # retains its threshold; the informational base comparison runs separately.
  # ---------------------------------------------------------------------------
  coverage-backend:
    name: Coverage (Backend)
    needs: changes
    # Publish exact-commit baselines on rollup tips and full publish gates.
    if: inputs.force-all || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rollup-')) || needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-tests.yml
    with:
      coverage: true

  # Base coverage is an informational comparison, not a correctness gate.
  # Reuse an exact source/recipe/runner OS report from a trusted push/publish run.
  # Try the exact-SHA cache, then a published baseline; otherwise report N/A.
  # Head coverage always executes all current tests; never rerun the base suite.
  coverage-backend-base:
    name: Coverage (Backend Base)
    permissions:
      contents: read
      actions: read
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Identify coverage measurement inputs
        id: coverage-identity
        run: python3 .github/scripts/coverage_identity.py
      - name: Restore exact base report
        if: steps.coverage-identity.outputs.reusable == 'true'
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: coverage-backend.base.json
          key: coverage-backend-base-v2-${{ github.event.pull_request.base.sha }}-${{ steps.coverage-identity.outputs.fingerprint }}
      - name: Look up published baseline for the exact base SHA
        if: steps.base-cache.outputs.cache-hit != 'true' && steps.coverage-identity.outputs.reusable == 'true'
        id: base-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 .github/scripts/coverage_base_lookup.py select
          --repository "$GITHUB_REPOSITORY" --sha "$BASE_SHA"
      - name: Download published baseline
        if: steps.base-run.outputs.run-id != ''
        id: base-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.base-run.outputs.artifact-id }}
          merge-multiple: true
          run-id: ${{ steps.base-run.outputs.run-id }}
          github-token: ${{ github.token }}
          path: published-baseline
      - name: Verify published baseline measurement identity
        if: steps.base-download.outcome == 'success'
        id: base-artifact
        env:
          FINGERPRINT: ${{ steps.coverage-identity.outputs.fingerprint }}
          REUSABLE: ${{ steps.coverage-identity.outputs.reusable }}
        run: >-
          python3 .github/scripts/coverage_base_lookup.py verify
          --directory published-baseline --fingerprint "$FINGERPRINT"
          --reusable "$REUSABLE"
      - name: Report unavailable baseline
        if: steps.base-cache.outputs.cache-hit != 'true' && steps.base-artifact.outputs.available != 'true'
        run: >-
          echo 'Base coverage delta: N/A (no report for this exact base commit,
          measurement recipe and runner OS). Head tests and coverage remain required.'
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload base report
        if: steps.base-cache.outputs.cache-hit == 'true' || steps.base-artifact.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-base-report
          path: coverage-backend.base.json
          if-no-files-found: error

  # Restore the original PR artifact contract after the parallel base lookup.
  # This is informational; the coverage-backend job remains the threshold gate.
  coverage-backend-summary:
    name: Coverage (Backend Summary)
    needs: [changes, coverage-backend, coverage-backend-base]
    if: always() && github.event_name == 'pull_request' && (needs.changes.outputs.ci == 'true' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download head report
        id: head-report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-head
        continue-on-error: true
      - name: Download base report
        if: steps.head-report.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: backend-base-report
        continue-on-error: true
      - name: Merge base line % into summary
        if: steps.head-report.outcome == 'success'
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-backend.json coverage-backend.base.json
      - name: Upload coverage artifact
        if: steps.head-report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: |
            coverage-backend.lcov
            coverage-backend.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # CLI (nyxid-cli) line coverage. No DB needed (mirrors `cli-test`).
  # ---------------------------------------------------------------------------
  coverage-cli:
    name: Coverage (CLI)
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system dependencies
        timeout-minutes: 5
        run: bash .github/scripts/install-linux-build-deps.sh
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: llvm-tools-preview
      - uses: ./.github/actions/ci-rust-cache
        with:
          shared-key: coverage-cli-coverage-cli
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      # Measure WITHOUT the gate (enforced as the final step below). `report` is
      # package-scoped so the % isn't diluted by the rest of the workspace.
      - name: Measure (head)
        run: |
          cargo llvm-cov --package nyxid-cli --no-report
          cargo llvm-cov report --package nyxid-cli --lcov --output-path coverage-cli.lcov
          cargo llvm-cov report --package nyxid-cli --json --summary-only --output-path coverage-cli.raw.json

      - name: Build head summary JSON
        run: |
          python3 .github/scripts/coverage_summary.py \
            cli "CLI (nyxid-cli)" 64 \
            coverage-cli.raw.json coverage-cli.json

      - name: Measure base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base-coverage "$BASE_REF"
          ( cd ../base-coverage && cargo llvm-cov --package nyxid-cli --no-report \
              && cargo llvm-cov report --package nyxid-cli --json --summary-only \
                 --output-path "$GITHUB_WORKSPACE/coverage-cli.base.json" )

      - name: Merge base line % into summary
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-cli.json coverage-cli.base.json

      # Enforce the threshold LAST (see backend job for rationale).
      - name: Enforce coverage gate (head)
        run: cargo llvm-cov report --package nyxid-cli --fail-under-lines 64

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cli
          path: |
            coverage-cli.lcov
            coverage-cli.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Frontend (vitest --coverage). The line threshold is enforced by
  # `coverage.thresholds.lines` in frontend/vite.config.ts, so `test:coverage`
  # exits non-zero on a regression. We read the line % from the v8
  # json-summary reporter (coverage/coverage-summary.json).
  # ---------------------------------------------------------------------------
  coverage-frontend:
    name: Coverage (Frontend)
    needs: changes
    if: inputs.force-all || needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Head: measure WITHOUT the gate (override the line threshold to 0) so the
      # coverage summary is always produced; the threshold is enforced as the
      # final step below — mirroring the Rust jobs — so a regression still
      # surfaces the failing number in the PR comment.
      - name: Measure (head)
        run: npm run test:coverage -- --coverage.thresholds.lines=0

      - name: Build head summary JSON
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/coverage_summary.py \
            frontend "Frontend (vitest)" 15 \
            frontend/coverage/coverage-summary.json coverage-frontend.json

      # Base: best-effort. Check out the base tree, install, run coverage
      # WITHOUT the threshold gate (--coverage.thresholds.lines=0) so a low base
      # never errors here.
      - name: Measure base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add ../base-coverage "$BASE_REF"
          ( cd ../base-coverage/frontend \
              && npm ci \
              && env NODE_ENV=test npx vitest run --coverage --coverage.thresholds.lines=0 )
          cp ../base-coverage/frontend/coverage/coverage-summary.json \
             frontend-coverage-base.json

      - name: Merge base line % into summary
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/coverage_merge_base.py \
            coverage-frontend.json frontend-coverage-base.json

      # Enforce the FE threshold LAST, reading the already-produced summary (no
      # re-run) so a regression fails the job *and* still surfaces in the PR
      # comment. Keep this threshold in sync with vite.config.ts (lines: 15).
      - name: Enforce coverage gate (head)
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json, sys
          total = json.load(open("frontend/coverage/coverage-summary.json"))["total"]
          pct = float(total["lines"]["pct"])
          threshold = 15.0
          print(f"Frontend line coverage: {pct}% (threshold {threshold}%)")
          sys.exit(0 if pct >= threshold else 1)
          PY

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
            coverage-frontend.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # PR comment payload: aggregate the three coverage summaries into one sticky
  # comment body showing each component's line %, its enforced threshold, and
  # the delta vs. the base branch (AC #4). Runs only on pull_request, after the
  # measurement jobs, and tolerates skipped components (docs-only PR -> some
  # jobs skip).
  #
  # This job only BUILDS the comment body and uploads it as an artifact; the
  # actual posting happens in coverage-comment.yml. Posting needs a
  # write-scoped token, but `pull_request` runs from forks get a read-only
  # GITHUB_TOKEN (the job's `permissions:` block is capped, not honored), so an
  # in-line `issues.createComment` 403s on every fork PR. The companion
  # `workflow_run` workflow runs from the default branch with the base repo's
  # token and never executes PR/fork code, so it can post safely.
  # ---------------------------------------------------------------------------
  coverage-comment:
    name: Coverage Comment Payload
    if: always() && github.event_name == 'pull_request'
    needs:
      - coverage-backend-summary
      - coverage-cli
      - coverage-frontend
    runs-on: ubuntu-latest
    permissions:
      # `actions/checkout` needs contents:read; declaring any permissions block
      # otherwise drops all unlisted scopes to none and the checkout 403s. No
      # write scopes here -- this job never touches the PR conversation.
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download coverage summaries
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true
      - name: Build comment body
        run: |
          python3 .github/scripts/coverage_comment.py \
            coverage-artifacts > coverage-comment.md
          cat coverage-comment.md
      - name: Record PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload coverage comment payload
        uses: actions/upload-artifact@v4
        with:
          # Deliberately NOT matching `coverage-*` so the pattern download
          # above never picks this payload up on a re-run.
          name: pr-coverage-comment
          path: |
            coverage-comment.md
            pr-number.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Aggregator: a single status check that summarises the whole pipeline.
  #
  # Branch protection / required-checks rules should require ONLY this job by
  # name (`CI Pipeline`). Conditional jobs above may legitimately be skipped
  # (e.g. a docs-only PR), and listing them individually as required would
  # leave PRs stuck pending. This job runs unconditionally (`if: always()`)
  # and treats `success` and `skipped` as OK; `failure` or `cancelled` in
  # any upstream job fails the gate.
  #
  # Reference: https://devopsdirective.com/posts/2025/08/github-actions-required-checks-for-conditional-jobs/
  # ---------------------------------------------------------------------------
  ci-pass:
    name: CI Pipeline
    if: always()
    needs:
      - changes
      - workflow-permissions
      - cursor-plugin-validate
      - codex-plugin-validate
      - claude-plugin-validate
      - oracle-worker-test
      - rust-fmt
      - rust-clippy
      - backend-test
      - permissions-test
      - backend-billing-smoke
      - backend-image-inputs
      - backend-image-smoke
      - cli-test
      - machine-container
      - rust-features
      - frontend
      - mobile
      - wizard-bundle-freshness
      - sdk
      - coverage-backend
      - coverage-cli
      - coverage-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded or were skipped intentionally
        env:
          # NOTE: `coverage-comment` is intentionally NOT gated here -- it is an
          # informational PR comment, not a correctness check. The three
          # `coverage-*` measurement jobs ARE gated: they fail when line
          # coverage drops below the enforced threshold.
          RESULTS: |
            changes=${{ needs.changes.result }}
            workflow-permissions=${{ needs.workflow-permissions.result }}
            cursor-plugin-validate=${{ needs.cursor-plugin-validate.result }}
            codex-plugin-validate=${{ needs.codex-plugin-validate.result }}
            claude-plugin-validate=${{ needs.claude-plugin-validate.result }}
            oracle-worker-test=${{ needs.oracle-worker-test.result }}
            rust-fmt=${{ needs.rust-fmt.result }}
            rust-clippy=${{ needs.rust-clippy.result }}
            backend-test=${{ needs.backend-test.result }}
            permissions-test=${{ needs.permissions-test.result }}
            backend-billing-smoke=${{ needs.backend-billing-smoke.result }}
            backend-image-inputs=${{ needs.backend-image-inputs.result }}
            backend-image-smoke=${{ needs.backend-image-smoke.result }}
            cli-test=${{ needs.cli-test.result }}
            machine-container=${{ needs.machine-container.result }}
            rust-features=${{ needs.rust-features.result }}
            frontend=${{ needs.frontend.result }}
            mobile=${{ needs.mobile.result }}
            wizard-bundle-freshness=${{ needs.wizard-bundle-freshness.result }}
            sdk=${{ needs.sdk.result }}
            coverage-backend=${{ needs.coverage-backend.result }}
            coverage-cli=${{ needs.coverage-cli.result }}
            coverage-frontend=${{ needs.coverage-frontend.result }}
        run: |
          set -eu
          echo "Job results:"
          failed=0
          while IFS='=' read -r job result; do
            [ -z "$job" ] && continue
            printf '  %s=%s\n' "$job" "$result"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Job '$job' did not pass (result=$result)"
                failed=1
                ;;
            esac
          done <<< "$RESULTS"
          exit "$failed"
