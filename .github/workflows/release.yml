#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "attestations": "write"
  "contents": "write"
  "id-token": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Plan without creating a remote release.
  plan:
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      tag-flag: ${{ !github.event.pull_request && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ !github.event.pull_request }}
      source-commit: ${{ steps.source.outputs.commit }}
      source-epoch: ${{ steps.source.outputs.epoch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Bumped from @v4 by hand to match repo convention; reapply if dist init regenerates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Resolve exact release source
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/plan-source" --commit "$(git rev-parse HEAD)"
      - name: Install checksummed dist
        run: |
          python3 scripts/bootstrap-build-tool.py cargo-dist --bin-dir "$HOME/.cargo/bin"
          python3 scripts/bootstrap-build-tool.py cargo-auditable --bin-dir "$HOME/.cargo/bin"
      - name: Cache dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        env:
          DIST_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          tag_args=()
          if [ -n "$DIST_TAG" ]; then tag_args+=("--tag=$DIST_TAG"); fi
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/plan-source" \
            --commit "${{ steps.source.outputs.commit }}" --receipt "$RUNNER_TEMP/plan-execution.json" \
            --generated target -- dist plan "${tag_args[@]}" --output-format=json > "$RUNNER_TEMP/plan-dist-manifest.json"
          python3 scripts/check-build-inputs.py --dist-plan "$RUNNER_TEMP/plan-dist-manifest.json"
          python3 scripts/make-publication-plan.py cli --dist-plan "$RUNNER_TEMP/plan-dist-manifest.json" --output "$RUNNER_TEMP/publication-plan.json"
          echo "dist ran successfully"
          echo "manifest=$(jq -c "." "$RUNNER_TEMP/plan-dist-manifest.json")" >> "$GITHUB_OUTPUT"
      # Hand-added; reapply if dist init regenerates. Release Build Cache runs
      # `dist build` on main without a tag, which needs every dist-able package
      # at one version. `dist plan` does not check that; `dist manifest` matches
      # `dist build` without building, so pull requests catch it here.
      - name: Verify the untagged dist build announces one version
        if: ${{ github.event.pull_request }}
        run: dist manifest --output-format=json --artifacts=local --target=x86_64-unknown-linux-gnu > /dev/null
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-plan-dist-manifest
          path: ${{ runner.temp }}/plan-dist-manifest.json
      - name: Upload complete expected publication plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expected-publication-plan
          path: ${{ runner.temp }}/publication-plan.json
          if-no-files-found: error

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      NYXID_GIT_HASH: ${{ needs.plan.outputs.source-commit }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source-epoch }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      # Bumped from @v4 by hand to match repo convention; reapply if dist init regenerates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Export exact committed release inputs
        run: python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/release-source" --commit "${{ needs.plan.outputs.source-commit }}"
      - name: Install reviewed release dependencies
        run: sh scripts/install-release-dependencies.sh
      - name: Install checksummed Rust bootstrap in container
        if: ${{ matrix.container }}
        run: |
          python3 scripts/bootstrap-build-tool.py rustup --bin-dir "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Select exact Rust toolchain
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: 1.98.1
      # Added by hand (allow-dirty = ["ci"]); reapply if dist init regenerates.
      # Tag runs cannot share caches with each other, only with `main`, so this
      # restores the dependency cache that release-cache.yml warms on `main`.
      # Keep the key inputs in sync with that workflow.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist-${{ join(matrix.targets, '-') }}
          # The producer removes directory-only restored staging residue and
          # rejects/preserves any stale artifact or symlink before dist runs.
          workspaces: ${{ runner.temp }}/release-source/source -> target
          save-if: false
      - name: Install checksummed dist
        run: |
          python3 scripts/bootstrap-build-tool.py cargo-dist --bin-dir "$HOME/.cargo/bin"
          python3 scripts/bootstrap-build-tool.py cargo-auditable --bin-dir "$HOME/.cargo/bin"
      - name: Fetch complete expected publication plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: expected-publication-plan
          path: ${{ runner.temp }}/release-plan
      - name: Build artifacts
        env:
          TARGET: ${{ matrix.targets[0] }}
          TARGET_COUNT: ${{ toJSON(matrix.targets) }}
        shell: bash
        run: |
          jq -e 'length == 1' <<< "$TARGET_COUNT"
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            export CC=clang
            export CXX=clang++
          fi
          python3 scripts/run-dist-build.py --export "$RUNNER_TEMP/release-source" \
            --plan "$RUNNER_TEMP/release-plan/publication-plan.json" --mode local --target "$TARGET" \
            --evidence "$RUNNER_TEMP/build-evidence/$TARGET"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: ${{ runner.temp }}/build-evidence/${{ matrix.targets[0] }}/artifacts/
          if-no-files-found: error
      - name: Upload actual required child build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence-${{ matrix.targets[0] }}
          path: ${{ runner.temp }}/build-evidence/
          if-no-files-found: error

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      NYXID_GIT_HASH: ${{ needs.plan.outputs.source-commit }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source-epoch }}
    steps:
      # Bumped from @v4 by hand to match repo convention; reapply if dist init regenerates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Export exact committed global inputs
        run: python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/release-source" --commit "${{ needs.plan.outputs.source-commit }}"
      - name: Fetch complete expected publication plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: expected-publication-plan
          path: ${{ runner.temp }}/release-plan
      - name: Install cached dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/local-artifacts
          merge-multiple: true
      - name: Fetch required local build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-evidence-*
          path: ${{ runner.temp }}/local-evidence
          merge-multiple: true
      - name: Package all global artifacts from verified source and completed local builds
        shell: bash
        run: |
          python3 scripts/run-dist-build.py --export "$RUNNER_TEMP/release-source" \
            --plan "$RUNNER_TEMP/release-plan/publication-plan.json" --mode global \
            --local-artifacts "$RUNNER_TEMP/local-artifacts" --local-evidence "$RUNNER_TEMP/local-evidence" \
            --evidence "$RUNNER_TEMP/global-evidence"
          cp "$RUNNER_TEMP/global-evidence/dist-manifest.json" "$RUNNER_TEMP/global-evidence/artifacts/global-dist-manifest.json"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-build-global
          path: ${{ runner.temp }}/global-evidence/artifacts/
          if-no-files-found: error
      - name: Upload global source and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence-global
          path: ${{ runner.temp }}/global-evidence/
          if-no-files-found: error

  release-integrity-manifest:
    name: Release Integrity Manifest
    needs:
      - plan
    runs-on: "ubuntu-24.04"
    env:
      SOURCE_COMMIT: ${{ needs.plan.outputs.source-commit }}
      SOURCE_DATE_EPOCH: ${{ needs.plan.outputs.source-epoch }}
      RELEASE_INTEGRITY_SIGNING_ENABLED: ${{ vars.RELEASE_INTEGRITY_SIGNING_ENABLED || 'false' }}
      RELEASE_INTEGRITY_SIGN_CMD: ${{ secrets.RELEASE_INTEGRITY_SIGN_CMD || vars.RELEASE_INTEGRITY_SIGN_CMD }}
      RELEASE_INTEGRITY_PUBLISH_CMD: ${{ secrets.RELEASE_INTEGRITY_PUBLISH_CMD || vars.RELEASE_INTEGRITY_PUBLISH_CMD }}
      RELEASE_INTEGRITY_MANIFEST_URL: ${{ vars.RELEASE_INTEGRITY_MANIFEST_URL }}
      RELEASE_INTEGRITY_SIGNING_KEY: ${{ secrets.RELEASE_INTEGRITY_SIGNING_KEY }}
      RELEASE_INTEGRITY_PUBLISH_TOKEN: ${{ secrets.RELEASE_INTEGRITY_PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Export exact committed credential inputs
        run: python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/credential-source" --commit "$SOURCE_COMMIT"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install reviewed npm
        run: |
          python3 scripts/bootstrap-build-tool.py npm --bin-dir "$RUNNER_TEMP/build-tools"
          echo "$RUNNER_TEMP/build-tools" >> "$GITHUB_PATH"
      - name: Build standalone credential accept bundle
        run: |
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/credential-source" \
            --commit "$SOURCE_COMMIT" --receipt "$RUNNER_TEMP/credential-install-execution.json" \
            --generated frontend/node_modules --cwd frontend -- npm ci
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/credential-source" \
            --commit "$SOURCE_COMMIT" --receipt "$RUNNER_TEMP/wizard-seal-execution.json" \
            --generated frontend/node_modules -- node frontend/scripts/seal-shipped-composition.mjs wizard verify
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/credential-source" \
            --commit "$SOURCE_COMMIT" --receipt "$RUNNER_TEMP/credential-build-execution.json" \
            --generated frontend/node_modules --generated frontend/dist --cwd frontend -- npm run build:credential-accept
      - name: Upload release integrity manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-release-integrity-manifest
          path: ${{ runner.temp }}/credential-source/source/frontend/dist/release-integrity/releases.json
          if-no-files-found: error
      - name: Sign and publish release integrity manifest
        shell: bash
        run: |
          if [ "${{ needs.plan.outputs.publishing }}" != "true" ]; then
            echo "::warning::Release integrity signing skipped because this is not a publishing run."
            exit 0
          fi
          if [ "${RELEASE_INTEGRITY_SIGNING_ENABLED:-false}" != "true" ]; then
            echo "::warning::Release integrity signing disabled; set RELEASE_INTEGRITY_SIGNING_ENABLED=true and provide command env vars to publish a signed manifest."
            exit 0
          fi

          missing=()
          [ -n "${RELEASE_INTEGRITY_SIGN_CMD:-}" ] || missing+=("RELEASE_INTEGRITY_SIGN_CMD")
          [ -n "${RELEASE_INTEGRITY_PUBLISH_CMD:-}" ] || missing+=("RELEASE_INTEGRITY_PUBLISH_CMD")
          [ -n "${RELEASE_INTEGRITY_MANIFEST_URL:-}" ] || missing+=("RELEASE_INTEGRITY_MANIFEST_URL")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Release integrity signing enabled but missing required env: %s\n' "${missing[*]}"
            exit 1
          fi

          export RELEASE_INTEGRITY_MANIFEST_PATH="$RUNNER_TEMP/credential-source/source/frontend/dist/release-integrity/releases.json"
          bash -c "$RELEASE_INTEGRITY_SIGN_CMD"
          bash -c "$RELEASE_INTEGRITY_PUBLISH_CMD"
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - release-integrity-manifest
    # Every required build must succeed, independently of artifact presence.
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.release-integrity-manifest.result == 'success' && needs.build-global-artifacts.result == 'success' && needs.build-local-artifacts.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      # Bumped from @v4 by hand to match repo convention; reapply if dist init regenerates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json artifacts/dist-manifest.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: artifacts/*
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        # `dist host` only plans the release; it does not call the GitHub API
        # to create it. Upstream cargo-dist's generated workflow ends with a
        # `gh release create ... artifacts/*` step that both creates the
        # release and uploads every artifact in one shot. We mirror that
        # pattern but inject our custom changelog + container-images footer
        # on top of dist's announcement body. If `dist init` regenerates this
        # workflow, reapply the custom notes block and keep `gh release
        # create` (not `gh release edit`).
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          CHANGELOG: "${{ steps.changelog.outputs.changes }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          {
            printf '%s\n\n' "$ANNOUNCEMENT_BODY"
            printf '## Changes\n\n%s\n\n' "$CHANGELOG"
            printf '## Container images\n\n'
            printf 'Multi-arch (linux/amd64, linux/arm64) images for this release are published to GitHub Container Registry by the `Publish Images` workflow:\n\n'
            printf -- '- `ghcr.io/chronoaiproject/nyxid/backend:%s`\n' "${{ github.ref_name }}"
            printf -- '- `ghcr.io/chronoaiproject/nyxid/frontend:%s`\n' "${{ github.ref_name }}"
            printf -- '- `ghcr.io/chronoaiproject/nyxid/node-agent:%s`\n' "${{ github.ref_name }}"
          } > $RUNNER_TEMP/notes.txt

          gh release create "${{ needs.plan.outputs.tag }}" \
            --target "$RELEASE_COMMIT" \
            $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            artifacts/*

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Bumped from @v4 by hand to match repo convention; reapply if dist init regenerates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
