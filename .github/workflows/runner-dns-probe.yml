name: Runner DNS probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/runner-dns-probe.yml', '.github/scripts/ensure-ubuntu-archive-dns.sh']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Before
        run: |
          getent ahostsv4 archive.ubuntu.com | head -1 || echo "archive.ubuntu.com does not resolve"
          resolvectl dns
      - name: Apply fallback
        run: bash .github/scripts/ensure-ubuntu-archive-dns.sh
      - name: After
        run: |
          resolvectl dns
          for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com ports.ubuntu.com github.com; do printf '%s => %s\n' "$h" "$(getent ahostsv4 "$h" | awk 'NR==1{print $1}')"; done
          grep -v '^#' /run/systemd/resolve/resolv.conf
      - name: Build dependencies script
        run: bash .github/scripts/install-linux-build-deps.sh
      - name: Stock runner apt sources
        run: sudo apt-get update -o Acquire::Retries=1 -o APT::Update::Error-Mode=any
      - name: Plain container
        run: docker run --rm ubuntu:24.04 sh -c 'cat /etc/resolv.conf | grep -v "^#"; apt-get update -o APT::Update::Error-Mode=any >/dev/null && echo container-apt-ok'
      - name: Default builder
        run: |
          printf 'FROM ubuntu:24.04\nRUN apt-get update -o APT::Update::Error-Mode=any && apt-get install -y --no-install-recommends node-ws && echo build-apt-ok\n' > /tmp/Dockerfile.probe
          docker build --no-cache -f /tmp/Dockerfile.probe /tmp
      - uses: docker/setup-buildx-action@v3
      - name: Container-driver builder
        run: docker buildx build --no-cache -f /tmp/Dockerfile.probe /tmp
