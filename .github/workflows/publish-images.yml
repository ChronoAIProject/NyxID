name: Publish Images

# Publishes multi-arch (amd64 + arm64) container images to GitHub Container
# Registry on:
#   - every push to `main`             -> tags: main, main-<sha>, edge
#   - every pushed tag matching v*.*.* -> tags: <version>, <major>.<minor>, <major>, latest
#
# Components: backend, frontend, node-agent, nyxid-node-machine.
# mcp-proxy is intentionally excluded (source not yet in repo).
#
# Build strategy: native runner matrix (no QEMU). The `build` job fans out
# across (component x platform), with linux/arm64 jobs running on
# ubuntu-24.04-arm for native speed. Each build pushes by digest only; the
# `merge` job validates/publishes indices by digest; `promote` applies real tags
# only after the complete image publication SBOM set has passed.
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Published images are public. A one-time visibility flip runs after each
# run; the flip is idempotent.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------------
  # Reuse the CI workflow as a gate so we never publish a broken build.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # Must cover every scope a ci.yml job requests, or this workflow fails to
    # start (checked on PRs by scripts/check-reusable-workflow-permissions.py).
    permissions:
      contents: read
      attestations: read
    with:
      # The publish gate is a release validation, not a PR check, so path
      # filtering must not skip anything. Force the full suite to run
      # regardless of which files were touched in the merge commit.
      force-all: true

  # ---------------------------------------------------------------------------
  # CI, including source dependency/history scans, precedes every registry write.
  # Build and scan each final native image locally, then copy its exact digest.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    needs: ci-gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, node-agent, nyxid-node-machine, nyxid-machine-updater]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: linux-arm64
          - component: backend
            context: .
            file: backend/Dockerfile
          - component: frontend
            # Repo-root context (not frontend/): the frontend image needs the
            # docs source at docs/site, read by the vite docs-sync publish-gate
            # at build time, which lives outside frontend/. See frontend/Dockerfile.
            context: .
            file: frontend/Dockerfile
          - component: node-agent
            context: .
            file: cli/Dockerfile.node
          - component: nyxid-node-machine
            context: .
            file: cli/Dockerfile.machine
          - component: nyxid-machine-updater
            context: .
            file: cli/Dockerfile.machine-updater
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Export exact committed image inputs
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/image-source" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare backend image memory reserve
        if: matrix.component == 'backend'
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh

      - name: Compute lowercase image repo
        id: repo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nyxid/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only -- tags are applied by the merge job on the manifest list.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.repo.outputs.image }}
          labels: |
            org.opencontainers.image.title=nyxid-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Verify exported image inputs before build
        run: python3 scripts/export-build-source.py verify --destination "$RUNNER_TEMP/image-source" --commit "${{ steps.source.outputs.commit }}"

      - name: Build staged image without registry writes
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image-source/source
          file: ${{ runner.temp }}/image-source/source/${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Full source commit and commit epoch identify every actual builder.
          # Telemetry config is fetched at runtime
          # from the backend's /api/v1/public/config endpoint, so no
          # build-args for telemetry are needed here.
          build-args: |
            NYXID_GIT_HASH=${{ steps.source.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          load: true
          push: false
          tags: nyxid-publish:staged
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform_pair }}
          provenance: false

      - name: Verify exported image inputs after build
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: python3 scripts/export-build-source.py verify --destination "$RUNNER_TEMP/image-source" --commit "${{ steps.source.outputs.commit }}"

      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      - name: Require final publication image source identity before attestation and promotion
        env:
          IMAGE: nyxid-publish:staged
          PLATFORM: ${{ matrix.platform }}
          COMPONENT: ${{ matrix.component }}
        run: |
          CARGO_BUILD_JOBS=2 CARGO_TARGET_DIR="$RUNNER_TEMP/artifact-target" cargo build --locked --release --manifest-path security/artifact-tools/Cargo.toml
          python3 scripts/check-image-identity.py --image "$IMAGE" --component "$COMPONENT" \
            --arch "${PLATFORM#linux/}" --source-root "$RUNNER_TEMP/image-source/source" \
            --commit '${{ steps.source.outputs.commit }}' --epoch '${{ steps.source.outputs.epoch }}' \
            --extractor "$RUNNER_TEMP/artifact-target/release/nyxid-artifact-info"
      - name: Verify machine browser and desktop
        if: matrix.component == 'nyxid-node-machine'
        timeout-minutes: 10
        env:
          MACHINE_IMAGE: nyxid-publish:staged
        run: |
          docker build --build-arg MACHINE_IMAGE="$MACHINE_IMAGE" \
            -f cli/tests/Dockerfile.machine -t nyxid-machine-e2e:ci .
          docker run --rm --shm-size=256m --security-opt seccomp=cli/resources/machine-container/seccomp.json nyxid-machine-e2e:ci
          python3 cli/tests/machine_mount_denied_profile.py cli/resources/machine-container/seccomp.json /tmp/nyxid-machine-deny-mount.json
          docker run --rm --shm-size=256m --security-opt seccomp=/tmp/nyxid-machine-deny-mount.json nyxid-machine-e2e:ci

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Verify production updater under documented restrictions
        if: matrix.component == 'nyxid-machine-updater'
        timeout-minutes: 10
        env:
          UPDATER_PRODUCTION_IMAGE: nyxid-publish:staged
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts --prefix frontend
          node cli/tests/machine_updater_production.mjs

      - name: Install checksummed final image scanners and digest copier
        run: |
          python3 scripts/bootstrap-build-tool.py trivy --bin-dir "$RUNNER_TEMP/scan-tools"
          python3 scripts/bootstrap-build-tool.py regctl --bin-dir "$RUNNER_TEMP/scan-tools"
      - name: Require vulnerability scan of the exact staged publication subject
        run: |
          python3 scripts/check-image-vulnerabilities.py --image nyxid-publish:staged \
            --component '${{ matrix.component }}' --platform '${{ matrix.platform }}' \
            --commit '${{ steps.source.outputs.commit }}' --trivy "$RUNNER_TEMP/scan-tools/trivy" \
            --regctl "$RUNNER_TEMP/scan-tools/regctl" --stage "$RUNNER_TEMP/scanned-image"
      - name: Require actual final filesystem, executable and frontend composition SBOM before registry writes
        run: |
          sh scripts/setup-sbom-tools.sh "$RUNNER_TEMP/sbom-tools"
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/check-image-sbom.py \
            --stage "$RUNNER_TEMP/scanned-image" --source-root "$RUNNER_TEMP/image-source/source" \
            --epoch '${{ steps.source.outputs.epoch }}' --extractor "$RUNNER_TEMP/artifact-target/release/nyxid-artifact-info" \
            --syft "$RUNNER_TEMP/sbom-tools/bin/syft"
      - name: Preserve replayable final platform SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-platform-sbom-${{ matrix.component }}-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/scanned-image/sbom/
          if-no-files-found: error
          retention-days: 14
      - name: Copy only the passing immutable OCI subject to GHCR
        id: publish
        run: |
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/publish-scanned-image.py --stage "$RUNNER_TEMP/scanned-image" \
            --repository '${{ steps.repo.outputs.image }}' --regctl "$RUNNER_TEMP/scan-tools/regctl"
      - name: Preserve final image vulnerability report and digest binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-scan-${{ matrix.component }}-${{ matrix.platform_pair }}
          path: |
            ${{ runner.temp }}/scanned-image/trivy.json
            ${{ runner.temp }}/scanned-image/image-scan.json
          if-no-files-found: error
          retention-days: 7

      - name: Attest published image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.repo.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.publish.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Require parity of actual publication subjects before any public tag promotion.
  credential-parity:
    name: Published Credential Packaging (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digests-backend-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/credential-digests/backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: digests-frontend-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/credential-digests/frontend
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require exact image-extracted credential parity before promotion
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/check-published-credentials.py --digests "$RUNNER_TEMP/credential-digests" \
            --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nyxid" --arch "$ARCH" \
            --source-root "$GITHUB_WORKSPACE" --commit "$(git rev-parse HEAD)" --epoch "$(git show -s --format=%ct HEAD)"

  # Merge per-arch digests into a multi-arch manifest list per component and
  # validate each index before a separate complete-set tag promotion.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge ${{ matrix.component }} manifest and SBOM
    runs-on: ubuntu-24.04
    needs: [ci-gate, build, credential-parity]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, node-agent, nyxid-node-machine, nyxid-machine-updater]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compute lowercase image repo
        id: repo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nyxid/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-platform-sbom-${{ matrix.component }}-*
          path: ${{ runner.temp }}/platform-sboms
      - name: Install pinned SBOM validator and digest publisher
        run: |
          sh scripts/setup-sbom-tools.sh "$RUNNER_TEMP/sbom-tools"
          python3 scripts/bootstrap-build-tool.py regctl --bin-dir "$RUNNER_TEMP/sbom-tools/bin"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require index subject and exact platform SBOM composition before publishing by digest
        run: |
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/check-image-publication-sboms.py index \
            --component '${{ matrix.component }}' --commit "$(git rev-parse HEAD)" --epoch "$(git show -s --format=%ct HEAD)" \
            --evidence "$RUNNER_TEMP/platform-sboms" --output "$RUNNER_TEMP/index-sbom"
      - name: Publish verified index and attach its SBOM without promoting tags
        id: merged
        run: |
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/check-image-publication-sboms.py publish-index \
            --evidence "$RUNNER_TEMP/index-sbom" --repository '${{ steps.repo.outputs.image }}' --regctl "$RUNNER_TEMP/sbom-tools/bin/regctl"
      - name: Attest multi-architecture release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.repo.outputs.image }}
          subject-digest: ${{ steps.merged.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-index-sbom-${{ matrix.component }}
          path: ${{ runner.temp }}/index-sbom/
          if-no-files-found: error
          retention-days: 14

  image-sbom-closure:
    name: Complete Image Publication SBOM Closure
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-index-sbom-*
          path: ${{ runner.temp }}/index-sboms
      - name: Require complete expected publication set before any tag promotion
        run: |
          sh scripts/setup-sbom-tools.sh "$RUNNER_TEMP/sbom-tools"
          "$RUNNER_TEMP/sbom-tools/python/bin/pip" install --require-hashes --only-binary=:all: -r security/python-build-requirements.txt
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/make-publication-plan.py images --output "$RUNNER_TEMP/image-plan.json"
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/check-image-publication-sboms.py closure \
            --plan "$RUNNER_TEMP/image-plan.json" --evidence "$RUNNER_TEMP/index-sboms" --output "$RUNNER_TEMP/image-sboms.json"

  promote:
    name: Promote ${{ matrix.component }} verified tags
    needs: [merge, image-sbom-closure, credential-parity]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, node-agent, nyxid-node-machine, nyxid-machine-updater]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compute lowercase image repo
        id: repo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nyxid/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-index-sbom-*
          path: ${{ runner.temp }}/index-sboms
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            # Tag pushes: semver ladder + `latest`
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Main branch pushes: rolling tags
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Revalidate every planned SBOM subject then promote exact verified index
        env:
          PROMOTION_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          sh scripts/setup-sbom-tools.sh "$RUNNER_TEMP/sbom-tools"
          "$RUNNER_TEMP/sbom-tools/python/bin/pip" install --require-hashes --only-binary=:all: -r security/python-build-requirements.txt
          python3 scripts/bootstrap-build-tool.py regctl --bin-dir "$RUNNER_TEMP/sbom-tools/bin"
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/make-publication-plan.py images --output "$RUNNER_TEMP/image-plan.json"
          "$RUNNER_TEMP/sbom-tools/python/bin/python" scripts/promote-sbom-images.py \
            --plan "$RUNNER_TEMP/image-plan.json" --evidence "$RUNNER_TEMP/index-sboms" \
            --component '${{ matrix.component }}' --tags "$PROMOTION_TAGS" --regctl "$RUNNER_TEMP/sbom-tools/bin/regctl"

  # ---------------------------------------------------------------------------
  # Flip new packages to public visibility. Idempotent: a no-op once public.
  # Runs only on push events (not workflow_dispatch) to avoid surprises.
  # ---------------------------------------------------------------------------
  make-public:
    name: Ensure public visibility
    runs-on: ubuntu-latest
    needs: promote
    if: github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - name: Flip package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend node-agent nyxid-node-machine nyxid-machine-updater; do
            package="nyxid/${component}"
            encoded=$(printf '%s' "$package" | jq -sRr @uri)
            echo "Ensuring ghcr.io/${owner}/${package} is public..."
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${encoded}/visibility" \
              -f visibility=public \
              || echo "  (skipped: package may not exist yet or already public)"
          done
