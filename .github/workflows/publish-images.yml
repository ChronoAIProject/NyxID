name: Publish Images

# Publishes multi-arch (amd64 + arm64) container images to GitHub Container
# Registry on:
#   - every push to `main`             -> tags: main, main-<sha>, edge
#   - every pushed tag matching v*.*.* -> tags: <version>, <major>.<minor>, <major>, latest
#
# Components: backend, frontend, node-agent, nyxid-node-machine.
# mcp-proxy is intentionally excluded (source not yet in repo).
#
# Build strategy: native runner matrix (no QEMU). The `build` job fans out
# across (component x platform), with linux/arm64 jobs running on
# ubuntu-24.04-arm for native speed. Each build pushes by digest only; the
# `merge` job then creates the multi-arch manifest list with the real tags.
# Reference: https://docs.docker.com/build/ci/github-actions/multi-platform/
#
# Published images are public. A one-time visibility flip runs after each
# run; the flip is idempotent.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  # ---------------------------------------------------------------------------
  # Reuse the CI workflow as a gate so we never publish a broken build.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    # Must cover every scope a ci.yml job requests, or this workflow fails to
    # start (checked on PRs by scripts/check-reusable-workflow-permissions.py).
    permissions:
      contents: read
      attestations: read
    with:
      # The publish gate is a release validation, not a PR check, so path
      # filtering must not skip anything. Force the full suite to run
      # regardless of which files were touched in the merge commit.
      force-all: true

  # ---------------------------------------------------------------------------
  # Build each component for each platform on its native runner while CI runs.
  # Each job pushes by digest only (no tags). A failed CI gate leaves no tagged
  # release because `merge` waits for both the builds and the gate.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, node-agent, nyxid-node-machine, nyxid-machine-updater]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: linux-arm64
          - component: backend
            context: .
            file: backend/Dockerfile
          - component: frontend
            # Repo-root context (not frontend/): the frontend image needs the
            # docs source at docs/site, read by the vite docs-sync publish-gate
            # at build time, which lives outside frontend/. See frontend/Dockerfile.
            context: .
            file: frontend/Dockerfile
          - component: node-agent
            context: .
            file: cli/Dockerfile.node
          - component: nyxid-node-machine
            context: .
            file: cli/Dockerfile.machine
          - component: nyxid-machine-updater
            context: .
            file: cli/Dockerfile.machine-updater
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Export exact committed image inputs
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/image-source" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare backend image memory reserve
        if: matrix.component == 'backend'
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh

      - name: Compute lowercase image repo
        id: repo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nyxid/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only -- tags are applied by the merge job on the manifest list.
      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.repo.outputs.image }}
          labels: |
            org.opencontainers.image.title=nyxid-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Verify exported image inputs before build
        run: python3 scripts/export-build-source.py verify --destination "$RUNNER_TEMP/image-source" --commit "${{ steps.source.outputs.commit }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/image-source/source
          file: ${{ runner.temp }}/image-source/source/${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Full source commit and commit epoch identify every actual builder.
          # Telemetry config is fetched at runtime
          # from the backend's /api/v1/public/config endpoint, so no
          # build-args for telemetry are needed here.
          build-args: |
            NYXID_GIT_HASH=${{ steps.source.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.source.outputs.epoch }}
          outputs: type=image,name=${{ steps.repo.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform_pair }}
          provenance: false

      - name: Verify exported image inputs after build
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: python3 scripts/export-build-source.py verify --destination "$RUNNER_TEMP/image-source" --commit "${{ steps.source.outputs.commit }}"

      - name: Verify machine browser and desktop
        if: matrix.component == 'nyxid-node-machine'
        timeout-minutes: 10
        env:
          MACHINE_IMAGE: ${{ steps.repo.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          docker build --build-arg MACHINE_IMAGE="$MACHINE_IMAGE" \
            -f cli/tests/Dockerfile.machine -t nyxid-machine-e2e:ci .
          docker run --rm --shm-size=256m --security-opt seccomp=cli/resources/machine-container/seccomp.json nyxid-machine-e2e:ci
          python3 cli/tests/machine_mount_denied_profile.py cli/resources/machine-container/seccomp.json /tmp/nyxid-machine-deny-mount.json
          docker run --rm --shm-size=256m --security-opt seccomp=/tmp/nyxid-machine-deny-mount.json nyxid-machine-e2e:ci

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.component == 'nyxid-machine-updater'
        with:
          node-version: '24'
      - name: Verify production updater under documented restrictions
        if: matrix.component == 'nyxid-machine-updater'
        timeout-minutes: 10
        env:
          UPDATER_PRODUCTION_IMAGE: ${{ steps.repo.outputs.image }}@${{ steps.build.outputs.digest }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --ignore-scripts --prefix frontend
          node cli/tests/machine_updater_production.mjs

      - name: Attest published image digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.repo.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Merge per-arch digests into a multi-arch manifest list per component and
  # apply the real tags. One merge job per component.
  # ---------------------------------------------------------------------------
  merge:
    name: Merge ${{ matrix.component }} manifest
    runs-on: ubuntu-latest
    needs: [ci-gate, build]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, node-agent, nyxid-node-machine, nyxid-machine-updater]
    steps:
      - name: Compute lowercase image repo
        id: repo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/nyxid/${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.repo.outputs.image }}
          tags: |
            # Tag pushes: semver ladder + `latest`
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # Main branch pushes: rolling tags
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.repo.outputs.image }}@sha256:%s ' *)

      - name: Resolve merged image digest
        id: merged
        run: |
          digest=$(docker buildx imagetools inspect '${{ steps.repo.outputs.image }}:${{ steps.meta.outputs.version }}' --format '{{json .Manifest.Digest}}' | jq -r .)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest multi-architecture release
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.repo.outputs.image }}
          subject-digest: ${{ steps.merged.outputs.digest }}
          push-to-registry: true

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ steps.repo.outputs.image }}:${{ steps.meta.outputs.version }}

  # ---------------------------------------------------------------------------
  # Flip new packages to public visibility. Idempotent: a no-op once public.
  # Runs only on push events (not workflow_dispatch) to avoid surprises.
  # ---------------------------------------------------------------------------
  make-public:
    name: Ensure public visibility
    runs-on: ubuntu-latest
    needs: merge
    if: github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - name: Flip package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for component in backend frontend node-agent nyxid-node-machine nyxid-machine-updater; do
            package="nyxid/${component}"
            encoded=$(printf '%s' "$package" | jq -sRr @uri)
            echo "Ensuring ghcr.io/${owner}/${package} is public..."
            gh api \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${owner}/packages/container/${encoded}/visibility" \
              -f visibility=public \
              || echo "  (skipped: package may not exist yet or already public)"
          done
