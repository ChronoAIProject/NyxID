name: Build Dev Images

on: workflow_call

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} (dev)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    # Share the component's publisher slot with builds queued before the change.
    concurrency:
      group: publish-dev-images-${{ matrix.component }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            file: backend/Dockerfile
            cargo_build_args: CARGO_BUILD_JOBS=4
          - component: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prepare backend image memory reserve
        if: matrix.component == 'backend'
        timeout-minutes: 5
        run: bash .github/scripts/prepare-backend-runner.sh

      - name: Compute image coordinates
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner}/nyxid/${{ matrix.component }}"
          {
            echo "repo=$repo"
            echo "tag=dev-${GITHUB_SHA::7}"
            echo "hash=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure Ubuntu archive DNS
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ensure-ubuntu-archive-dns.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # Repo-root context for both images, as in publish-images.yml.
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.title=nyxid-${{ matrix.component }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            NYXID_GIT_HASH=${{ steps.image.outputs.hash }}
            ${{ matrix.cargo_build_args }}
          # Restore from the dev cache first, then main's. Only the dev
          # reference is written, so main builds keep their own cache intact.
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64
            type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-linux-amd64
          cache-to: type=registry,ref=${{ steps.image.outputs.repo }}:buildcache-dev-linux-amd64,mode=max,ignore-error=true
          provenance: false

      - name: Promote the current dev tip
        env:
          IMAGE: ${{ steps.image.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tip=$(git ls-remote --exit-code origin refs/heads/dev)
          if [[ "${tip%%[[:space:]]*}" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:dev" "$IMAGE@$DIGEST"
          else
            echo "Skipping floating dev tag for superseded $GITHUB_SHA."
          fi
