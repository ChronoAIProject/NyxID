# Keeps a warm Rust build cache for the tag-triggered Release workflow.
#
# Release builds run only for tags, and a tag run can restore caches saved on
# the default branch but not caches saved by an earlier tag. This workflow
# builds the same dist matrix on `main`, so each release restores compiled
# dependencies instead of rebuilding them on every platform.
#
# The cache key must match release.yml exactly: the same `dist plan` matrix,
# runners, containers, packages, `dist build` arguments and shared key.
# The daily run restores each cache (refreshing it under the repository's
# least-recently-used eviction) and rebuilds only when it is missing.
name: Release Build Cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - "build-support/**"
      - "scripts/*build*.py"
      - "scripts/guard-dist-cargo.py"
      - "scripts/publication_contract.py"
      - "scripts/check-dist-artifacts.py"
      - "scripts/install-release-dependencies.sh"
      - "scripts/apt-snapshot-install.sh"
      - "scripts/apt-*.awk"
      - "security/apt-*"
      - "security/publication-policy.json"
      - .github/workflows/release.yml
      - .github/workflows/release-cache.yml
  # Pull requests that change this workflow build the matrix to verify it,
  # without saving: caches from pull request refs are not visible to tags.
  pull_request:
    paths:
      - .github/workflows/release-cache.yml
      - scripts/install-release-dependencies.sh
      - .github/scripts/test_install_release_dependencies.py
      - .github/scripts/test_install_linux_build_deps.py
      - scripts/apt-snapshot-install.sh
      - "scripts/apt-*.awk"
      - "security/apt-*"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Export exact cache-plan inputs
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/plan-source" --commit "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Install checksummed dist
        run: |
          python3 scripts/bootstrap-build-tool.py cargo-dist --bin-dir "$HOME/.cargo/bin"
          python3 scripts/bootstrap-build-tool.py cargo-auditable --bin-dir "$HOME/.cargo/bin"
      - id: plan
        run: |
          python3 scripts/run-exported-build.py --export "$RUNNER_TEMP/plan-source" \
            --commit "${{ steps.source.outputs.commit }}" --receipt "$RUNNER_TEMP/plan-execution.json" \
            --generated target -- dist plan --output-format=json > "$RUNNER_TEMP/plan-dist-manifest.json"
          python3 scripts/check-build-inputs.py --dist-plan "$RUNNER_TEMP/plan-dist-manifest.json"
          python3 scripts/make-publication-plan.py cli --dist-plan "$RUNNER_TEMP/plan-dist-manifest.json" --output "$RUNNER_TEMP/publication-plan.json"
          echo "manifest=$(jq -c "." "$RUNNER_TEMP/plan-dist-manifest.json")" >> "$GITHUB_OUTPUT"
      - name: Upload complete expected cache-build plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-publication-plan
          path: ${{ runner.temp }}/publication-plan.json
          if-no-files-found: error

  warm:
    name: warm (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Export exact committed cache-build inputs
        run: python3 scripts/export-build-source.py export --destination "$RUNNER_TEMP/release-source" --commit "${{ needs.plan.outputs.source-commit }}"
      - name: Install reviewed release dependencies
        run: sh scripts/install-release-dependencies.sh
      - name: Install checksummed Rust bootstrap in container
        if: ${{ matrix.container }}
        run: |
          python3 scripts/bootstrap-build-tool.py rustup --bin-dir "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Select exact Rust toolchain
        if: ${{ !matrix.container }}
        uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          components: clippy, rustfmt
      # Keep in sync with the cache step in release.yml's build-local-artifacts.
      - name: Restore Rust build cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dist-${{ join(matrix.targets, '-') }}
          # The producer removes directory-only restored staging residue and
          # rejects/preserves any stale artifact or symlink before dist runs.
          workspaces: ${{ runner.temp }}/release-source/source -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install checksummed dist
        run: |
          python3 scripts/bootstrap-build-tool.py cargo-dist --bin-dir "$HOME/.cargo/bin"
          python3 scripts/bootstrap-build-tool.py cargo-auditable --bin-dir "$HOME/.cargo/bin"
      - name: Fetch complete expected cache-build plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cache-publication-plan
          path: ${{ runner.temp }}/release-plan
      - name: Build artifacts
        env:
          TARGET: ${{ matrix.targets[0] }}
          TARGET_COUNT: ${{ toJSON(matrix.targets) }}
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          jq -e 'length == 1' <<< "$TARGET_COUNT"
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            export CC=clang
            export CXX=clang++
          fi
          python3 scripts/run-dist-build.py --export "$RUNNER_TEMP/release-source" \
            --plan "$RUNNER_TEMP/release-plan/publication-plan.json" --mode local --target "$TARGET" \
            --evidence "$RUNNER_TEMP/build-evidence/$TARGET"
