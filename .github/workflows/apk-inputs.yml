name: APK Inputs

on:
  workflow_call:
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

jobs:
  policy:
    name: APK Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate catalog matrix, callers and negative fixtures
        run: |
          python3 scripts/check-apk-inputs.py
          python3 scripts/test-apk-inputs.py
          python3 scripts/test-apk-preflight.py
          python3 scripts/test-apk-archives.py

  durable-present:
    name: APK durable archives present
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require every current catalog archive in the repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-apk-durability.py

  replay:
    name: APK Closures (${{ matrix.arch }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Replay actual signed archives with network disabled and reject tampering
        run: >-
          python3 scripts/test-apk-replay.py --arch '${{ matrix.arch }}'
          --output "$RUNNER_TEMP/apk-replay"
      - name: Retain replay logs and installed package records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-replay-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/apk-replay/
            !${{ runner.temp }}/apk-replay/payload/*.apk
          if-no-files-found: error
          retention-days: 7

  image-layers:
    name: APK Dockerfile Layers (${{ matrix.arch }})
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reject stale frozen inputs before scheduled image checks
        if: github.event_name == 'schedule'
        run: python3 scripts/check-build-input-freshness.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build every actual APK stage prefix without publishing
        run: >-
          python3 scripts/test-apk-image-inputs.py --platform 'linux/${{ matrix.arch }}'
          --output "$RUNNER_TEMP/apk-image-layers"
      - name: Retain exact package prefixes, logs and inventories
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-image-layers-${{ matrix.arch }}
          path: ${{ runner.temp }}/apk-image-layers/
          if-no-files-found: error
          retention-days: 7

  apk-pass:
    name: APK Inputs Passed
    if: always()
    needs: [policy, replay, image-layers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every APK check
        env:
          POLICY: ${{ needs.policy.result }}
          REPLAY: ${{ needs.replay.result }}
          LAYERS: ${{ needs.image-layers.result }}
        run: |
          test "$POLICY" = success
          test "$REPLAY" = success
          test "$LAYERS" = success
