name: Weekly Build Input Refresh

on:
  schedule:
    - cron: '7 1 * * 1'

permissions:
  contents: read

concurrency:
  group: weekly-build-input-refresh
  cancel-in-progress: false

jobs:
  freshness:
    name: Scheduled Build Input Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/check-build-input-freshness.py

  candidates:
    name: Verify Weekly Candidates
    permissions:
      contents: read
    uses: ./.github/workflows/build-input-maintenance.yml

  publish-candidate:
    name: Open Catalog Candidate PR and Store APK Archives
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    needs: candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-candidate-apt
          path: ${{ runner.temp }}/catalog-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: catalog-candidate-apk-*
          merge-multiple: true
          path: ${{ runner.temp }}/catalog-candidate
      - name: Publish only verified catalog candidates and archive assets
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_DATE: ${{ needs.candidates.outputs.catalog-date }}
        run: |
          gh auth setup-git
          python3 scripts/publish-build-input-candidates.py \
            --candidate "$RUNNER_TEMP/catalog-candidate" --date "$CATALOG_DATE"
