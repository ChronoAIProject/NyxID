version: 2

updates:
  # Rust (backend + node-agent)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
    groups:
      rust-minor:
        update-types:
          - minor
          - patch

  # Frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    groups:
      npm-minor:
        update-types:
          - minor
          - patch

  # SDK
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - sdk
    groups:
      sdk-minor:
        update-types:
          - minor
          - patch

  # Mobile
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    groups:
      mobile-minor:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Independent published integration and test dependency roots.
  - package-ecosystem: npm
    directory: /integrations/oracle/cdp-worker
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /integrations/openclaw
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /cli/tests/updater-npm
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /security/npm-tools
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /.github/tools/claude
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /cli/tests/machine_context_spike
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /security/artifact-tools
    schedule: { interval: weekly }

  # Immutable digest updates still require authenticated pin receipts.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /cli
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /cli/tests
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /cli/tests/machine_context_spike
    schedule: { interval: weekly }

  # Hash-locked workflow parser dependencies.
  - package-ecosystem: pip
    directory: /security
    schedule: { interval: weekly }
