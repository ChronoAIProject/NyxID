# Use verified model and output bounds. Billing is configured separately with
# nyxid admin billing service set-managed; access stays disabled until reviewed.
variables:
  model:
    type: model_id
    prompt: Exact verified Telnyx model ID
  max_output_tokens:
    type: int
    minimum: 1
    maximum: 32768
    prompt: Verified maximum output tokens
services:
  - slug: telnyx-platform
    name: Telnyx Platform
    description: Verified fixed-model text chat paid with NyxID credits
    service_type: http
    service_category: internal
    visibility: public
    base_url: https://api.telnyx.com/v2
    auth_method: bearer
    forward_access_token: false
    platform_key:
      enabled: false
      audience: restricted
      allowed_owner_ids: []
    proxy_operation_policy:
      rules:
        - method: POST
          path_template: /ai/openai/chat/completions
    operations:
      - name: chat_completions
        method: POST
        path: /ai/openai/chat/completions
        description: Generate text with the configured Telnyx model
        request_content_type: application/json
        request_body_schema:
          type: object
          additionalProperties: false
          required: [model, messages, max_tokens]
          properties:
            model:
              type: string
              enum: ["${model}"]
            messages:
              type: array
              minItems: 1
              maxItems: 128
              items:
                type: object
                additionalProperties: false
                required: [role, content]
                properties:
                  role: {type: string, enum: [system, user, assistant]}
                  content: {type: string, minLength: 1}
            max_tokens:
              type: integer
              minimum: 1
              maximum: "${max_output_tokens}"
            stream: {type: boolean, enum: [false], default: false}
            temperature: {type: number, minimum: 0, maximum: 2}
