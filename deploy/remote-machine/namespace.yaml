apiVersion: v1
kind: Namespace
metadata:
  name: nyxid-machine
  labels:
    # Docker-default NET_RAW is outside PSA baseline. The exact Sandbox
    # admission policy still rejects privileged/host-namespace workloads and
    # fixes capabilities; non-root workers retain their own no_new_privs.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    nyxid.dev/managed: "true"
