apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nyxid-machine
resources:
  - upstream/agents.x-k8s.io_sandboxes.yaml
  - namespace.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - manager-service-account.yaml
  - manager-role.yaml
  - manager-role-binding.yaml
  - workload-service-account.yaml
  - identity-review-role.yaml
  - network-policy.yaml
  - admission.yaml
configMapGenerator:
  - name: remote-machine-profile
    files:
      - fixed-machine.profile
    options:
      immutable: true
