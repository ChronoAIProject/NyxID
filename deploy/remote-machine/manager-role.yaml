apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nyxid-machine-manager
  namespace: nyxid-machine
rules:
  # Agent Sandbox remains the Pod/PVC creator. Recovery may delete exact
  # residual original children with UID/resourceVersion preconditions; no
  # pod/exec, child creation, child patch or finalizer mutation is granted.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
  # Read-only observations bind Pod/PVC UIDs to Sandbox ownerReferences.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # Explicit operator health probe; does not mutate quota or grant permissions.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
