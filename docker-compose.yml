# Docker Compose for NyxID.
#
# Usage:
#     cp .env.production.example .env.production
#     # edit ENCRYPTION_KEY and MONGO_ROOT_PASSWORD
#     docker compose up -d
#
# JWT signing keys are auto-generated on first startup (ENVIRONMENT=development).
# For production, generate your own keys, set ENVIRONMENT=production, and use
# docker-compose.prod.yml (read-only keys mount, localhost-only ports).
# See docs/DEPLOYMENT.md.

services:
  backend:
    image: ghcr.io/chronoaiproject/nyxid/backend:${NYXID_VERSION:-latest}
    container_name: nyxid-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-nyxid}:${MONGO_ROOT_PASSWORD}@mongodb:27017/nyxid?authSource=admin
    volumes:
      - ./keys:/app/keys
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/chronoaiproject/nyxid/frontend:${NYXID_VERSION:-latest}
    container_name: nyxid-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

  mongodb:
    image: mongo:8.0
    container_name: nyxid-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nyxid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: nyxid
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
