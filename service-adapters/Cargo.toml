[package]
name = "nyxid-service-adapters"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-specific HTTP adapters shared by NyxID and credential nodes."

[dependencies]
reqwest = { version = "0.12.28", features = ["rustls-tls"], default-features = false }
serde_json = { workspace = true }
http = "1.4"
thiserror = "2"
tokio = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", optional = true }
rcgen = { version = "0.14", optional = true }

[features]
test-support = ["dep:tokio", "dep:tokio-rustls", "dep:rcgen"]

[dev-dependencies]
tokio = { workspace = true }
tokio-rustls = "0.26"
rcgen = "0.14"

[package.metadata.dist]
dist = false
