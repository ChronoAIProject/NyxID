# Quick Start Docker Compose for NyxID.
#
# Usage:
#     cp .env.production.example .env.production
#     # edit ENCRYPTION_KEY and MONGO_ROOT_PASSWORD
#     docker compose -f docker-compose.quickstart.yml --env-file .env.production pull
#     docker compose -f docker-compose.quickstart.yml --env-file .env.production up -d
#
# Differences from docker-compose.prod.yml:
#   - Keys volume is read-write (allows JWT auto-generation in dev mode)
#   - Ports bind to 0.0.0.0 instead of 127.0.0.1 (easier local access)
#
# For production, use docker-compose.prod.yml with pre-generated JWT keys
# and ENVIRONMENT=production. See docs/DEPLOYMENT.md.

services:
  backend:
    image: ghcr.io/chronoaiproject/nyxid/backend:${NYXID_VERSION:-latest}
    container_name: nyxid-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-nyxid}:${MONGO_ROOT_PASSWORD}@mongodb:27017/nyxid?authSource=admin
    volumes:
      - ./keys:/app/keys
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/chronoaiproject/nyxid/frontend:${NYXID_VERSION:-latest}
    container_name: nyxid-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

  mongodb:
    image: mongo:8.0
    container_name: nyxid-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nyxid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: nyxid
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
