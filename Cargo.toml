[workspace]
members = ["backend", "cli"]
resolver = "3"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/ChronoAIProject/NyxID"
rust-version = "1.93"

[workspace.dependencies]
axum = { version = "0.8.8", features = ["macros", "ws"] }
tokio = { version = "1.51", features = ["full"] }
mongodb = "3.5.2"
bson = { version = "2.15", features = ["uuid-1", "chrono-0_4"] }
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Config for cargo-dist. We use dist for the build matrix and packaging, then
# shape the final release assets in CI to match NyxID's public naming contract.
[workspace.metadata.dist]
cargo-dist-version = "0.30.0"
ci = ["github"]
hosting = ["github"]
installers = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
unix-archive = ".tar.xz"
windows-archive = ".zip"
checksum = "sha256"
pr-run-mode = "skip"

[workspace.metadata.dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-14"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
strip = true
lto = "thin"
