    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
  <title>NyxID Chat - Four Target-State Workflows</title>
  <script>
    (() => {
      const root = document.documentElement;
      let mode = "system";
      try {
        const persisted = JSON.parse(localStorage.getItem("nyxid.theme") || "null");
        const saved = persisted?.state?.mode;
        if (["system", "light", "dark"].includes(saved)) mode = saved;
      } catch (_) {
        // A blocked or malformed local store falls back to NyxID's system default.
      }
      const prefersDark = typeof matchMedia !== "function" || matchMedia("(prefers-color-scheme: dark)").matches;
      const resolved = mode === "system" ? (prefersDark ? "dark" : "light") : mode;
      root.classList.toggle("theme-light", resolved === "light");
      root.classList.toggle("theme-dark", resolved === "dark");
    })();
  </script>

* { box-sizing: border-box; }

html {

  min-height: 100%;

  scroll-behavior: smooth;
}

body {

  color: var(--color-foreground);

button { font: inherit; letter-spacing: 0; -webkit-tap-highlight-color: transparent; }

.chrome-section,

.message-table { width: 100%; margin-top: 8px; overflow: hidden; border: 1px solid var(--color-hairline); border-radius: var(--radius-lg); border-collapse: separate; border-spacing: 0; color: color-mix(in srgb, var(--color-foreground) 90%, transparent); font-size: 12px; }

.narrator { align-self: center; max-width: 680px; margin: -2px 30px; color: var(--color-muted-foreground); text-align: center; font-size: 10px; font-style: italic; line-height: 1.55; }

.icon-tile svg { width: 17px; height: 17px; }
.card-heading { min-width: 0; flex: 1; }

.badge-warning { border-color: color-mix(in srgb, var(--color-warning) 30%, transparent); background: color-mix(in srgb, var(--color-warning) 10%, transparent); color: var(--color-warning); }

# NyxID Chat - Four Target-State Use Cases

These transcripts depict the target-state flow in section 4 of the NyxID Chat - Aevatar
Support Contract: gaps G1-G9 are assumed closed except where the contract itself reserves a
capability, leaves a bridge unspecified, or leaves a v1 scope decision open (G9). The `web`
executor remains reserved and is never emitted. For lane-A NyxID approvals, only observable
behavior is shown: NyxID records the decision, and Aevatar wakes and rechecks the gated step.
The G8 bridge remains unspecified; no bridge command is invented.

All people, repositories, invoices, candidates, results, links, and identifiers below are
fictional. The user is Calvin, acting in the same fictional organization throughout. UC1a and
UC1b are alternative starting states, not sequential tasks: UC1a begins with GitHub and Lark
unconnected, while UC1b begins with both connected. UC3 and UC4 independently assume that Lark
(`lark-feishu`) is connected.

## Transcript convention

`User` and `Assistant` messages are blockquotes. Italic square-bracketed narrator lines report
facts outside the chat surface. Cards use the following closed set:

- `CARD: INPUT` renders an actor-owned pending input from `nyxid.input.request`; the answer is
  one `input.resolve` command containing either one `freeText` value or one flat list of opaque
  option IDs.
- `CARD: PLAN` renders the full `TaskPlan` from `nyxid.task.snapshot`.
- `CARD: CONNECT` renders a NyxID browser action from `nyxid.action.request`; completion wakes
  the actor with `action.continue` and is proven by a typed postcondition.
- `CARD: NYXID APPROVAL` renders a lane-A NyxID-owned decision surface. Aevatar observes the
  outcome but cannot decide, loosen, or bypass it.
- `CARD: ARTIFACT` is a documentation-only visual treatment of the assistant's final delivery
  message. It is not a wire frame, command, or contract object.

Status glyphs map one-to-one to the closed step statuses: `○ planned`, `⏸ waiting`, `◐ running`,
`● done`, `✕ failed`, `⊘ skipped`, `⊗ cancelled`, and `? uncertain`. Every plan row spells out
the literal status and renders `externalEffect` separately. Substeps use only `running`, `done`,
or `failed`; they are presentation phases within one operation and never hide another external
call.

Readable IDs follow one disjoint scheme: tasks such as `task-uc1a`; origin and continuation
turns such as `turn-uc1a-1` and `turn-uc1a-2`; browser actions such as `act-github-1`; inputs
such as `input-uc1a-gaps` and `input-uc1a-gate`; and NyxID approvals such as
`nyxid-appr-uc1a-1`. One goal keeps one task ID across its turns, and every continuation gets
a new turn ID.

Each main task starts at plan revision 1 with only its gap-input step. After one composite gap
answer, disclosed capability-resolution reads may run, and revision 2 communicates the full
execution approach. In a confirm-gated plan, the gate is the first pending step of this
execution-phase revision; the already-done gap step remains visible ahead of it. This is the
explicit interpretation of section 7.5's "first step" rule used here. Gap and gate inputs never
share a `requestId`. Lane B in these transcripts is demonstrated by gap and plan-gate inputs;
an Aevatar-scoped tool approval is intentionally out of scope, so `approval.resolve` does not
appear in any scenario.

`source: tool: X` is documentation shorthand for the step's tool identity: slug-derived for a
NyxID-brokered operation and the mounted skill identity otherwise. It does not replace section
7.3's structured `source.kind: "tool"` fields. Consecutive `CARD: PLAN` snapshots represent one
live plan card re-rendering in place; they are shown separately here only to make state changes
auditable.

        const control = controlLine ? controlLine.slice(controlLine.indexOf(":") + 1).trim() : "Connect via NyxID";
        const rows = parts.lines.filter((line) => line !== controlLine);
        return `<article class="card connect-card">${renderCardHeader("Connect", parts.title, "plug", "Action required")}${renderRows(rows)}<div class="trust-line">${iconSvg("shield")}<span>Opens a NyxID-owned browser journey. Credential entry stays in NyxID.</span></div><footer class="card-footer"><button class="button button-primary" type="button">${iconSvg("plug")}<span>${inline(control)}</span></button><span class="footer-copy">Nothing is shared until you finish.</span></footer></article>`;
      }

      function renderApprovalCard(parts) {
        const pending = /awaiting decision/i.test(parts.title);
        const expired = /expired/i.test(parts.title);
        const countdown = parts.lines.find((line) => line.trim().startsWith("Countdown:"));
        const badgeLine = parts.lines.find((line) => line.trim().startsWith("Badge:"));
        const trust = badgeLine ? badgeLine.slice(badgeLine.indexOf(":") + 1).trim() : "Decided on NyxID - not by the assistant";
        const bodyLines = parts.lines.filter((line) => line !== countdown && line !== badgeLine);
        if (!pending) {
          const tone = expired ? "failed" : "success";
          const status = expired ? "Expired" : "Decided";
          return `<article class="receipt receipt-${tone}"><div class="receipt-heading">${iconSvg(expired ? "alert" : "check")}<span>NyxID approval</span>${badge(status, expired ? "destructive" : "success")}</div><p class="receipt-note">${inline(parts.title)}</p>${renderRows(bodyLines)}<div class="trust-line">${iconSvg("shield")}<span>${inline(trust)}</span></div></article>`;
        }
        return `<article class="card approval-card">${renderCardHeader("NyxID approval", parts.title, "shield", "Awaiting decision")} ${renderRows(bodyLines)}<div class="trust-line">${iconSvg("shield")}<span>${inline(trust)}</span></div><footer class="card-footer"><button class="button button-primary" type="button">${iconSvg("shield")}<span>Approve</span></button><button class="button button-outline" type="button">${iconSvg("x")}<span>Deny</span></button>${countdown ? `<span class="countdown">${iconSvg("clock")}${inline(countdown.trim())}</span>` : ""}</footer></article>`;
      }

      function renderArtifactCard(parts) {
        const warning = /no reservation was made/i.test(parts.title);
        const verified = parts.lines.filter((line) => /^(Verified against\b|Research artifact only:)/.test(line.trim()));
        const body = parts.lines.filter((line) => !verified.includes(line));
        const tone = warning ? "warning" : "success";
        return `<article class="receipt receipt-${tone}"><div class="receipt-heading">${iconSvg(warning ? "alert" : "check")}<span>Artifact</span>${badge(warning ? "Research only" : "Verified", warning ? "warning" : "success")}</div><p class="receipt-note">${inline(parts.title)}</p>${renderRows(body)}${verified.map((line) => `<div class="verified-footer">${iconSvg("check")}<span>${inline(line.trim())}</span></div>`).join("")}</article>`;
      }

      function renderCard(content, answer) {
        const parts = cardParts(content);
        if (!parts) return "";
        if (parts.type === "INPUT") return renderInputCard(parts, answer);
        if (parts.type === "PLAN") return renderPlanCard(parts);
        if (parts.type === "CONNECT") return renderConnectCard(parts);
        if (parts.type === "NYXID APPROVAL") return renderApprovalCard(parts);
        return renderArtifactCard(parts);
      }

      function nextUserAnswer(items, fromIndex) {
        for (let index = fromIndex + 1; index < items.length; index += 1) {
          if (items[index].type === "message" && items[index].role === "user") return items[index].text;
          if (items[index].type === "card" && cardParts(items[index].content)?.type === "INPUT") return "";
        }
        return "";
      }

      function renderItems(items) {
        return items.map((item, index) => {
          if (item.type === "scenario") return `<div class="scenario-heading" id="${item.id}"><span class="badge badge-accent">${inline(item.label)}</span><h3>${inline(item.title)}</h3></div>`;
          if (item.type === "precondition") return `<p class="scenario-precondition">${inline(item.text)}</p>`;
          if (item.type === "message" && item.role === "assistant") {
            return `<div class="assistant-row"><span class="assistant-identity" aria-hidden="true"><img src="nyxid-coloured-icon.svg" alt=""></span><div class="message assistant assistant-copy">${renderTextBlock(item.text)}</div></div>`;
          }
          if (item.type === "message") return `<div class="message user">${renderTextBlock(item.text)}</div>`;
          if (item.type === "narrator") return `<div class="narrator">[${inline(item.text)}]</div>`;
          if (item.type === "wire") return `<div class="wire">wire: ${inline(item.text)}</div>`;
          if (item.type === "card") {
            const parts = cardParts(item.content);
            const answer = parts?.type === "INPUT" ? nextUserAnswer(items, index) : "";
            return renderCard(item.content, answer);
          }
          if (item.type === "details") return `<details class="alt"><summary>${inline(item.label)}</summary><div class="alt-body">${renderItems(item.items)}</div></details>`;
          return "";
        }).join("");
      }

      const sections = parseSections(source);
      const conventionEnd = source.search(/\n## UC1 -/);
      const convention = conventionEnd >= 0 ? source.slice(0, conventionEnd).trim() : "";
      const conventionHTML = convention ? `<details class="conventions"><summary>Transcript conventions</summary><div class="conventions-body">${renderConvention(convention)}</div></details>` : "";
      app.innerHTML = conventionHTML + sections.map((section, index) => {
        const hasScenarios = section.items.some((item) => item.type === "scenario");
        const precondition = hasScenarios ? null : section.items.find((item) => item.type === "precondition");
        const threadItems = hasScenarios ? section.items : section.items.filter((item) => item.type !== "precondition");
        return `<section class="conversation" id="${section.id}" role="tabpanel" aria-labelledby="tab-${section.id}"${index ? " hidden" : ""}><div class="conversation-head"><h2>${inline(section.title)}</h2>${precondition ? `<p class="precondition">${inline(precondition.text)}</p>` : ""}</div><div class="thread">${renderItems(threadItems)}</div></section>`;
      }).join("");

      tabs.innerHTML = sections.map((section, index) => `<button class="tab" id="tab-${section.id}" role="tab" aria-controls="${section.id}" aria-selected="${index === 0}" tabindex="${index === 0 ? "0" : "-1"}" data-target="${section.id}">${tabLabels[index]}</button>`).join("");

      const themeToggle = document.getElementById("theme-toggle");
      const systemTheme = typeof matchMedia === "function" ? matchMedia("(prefers-color-scheme: dark)") : null;
      let themeMode = "system";

      try {
        const persisted = JSON.parse(localStorage.getItem("nyxid.theme") || "null");
        const saved = persisted?.state?.mode;
        if (["system", "light", "dark"].includes(saved)) themeMode = saved;
      } catch (_) {
        // Keep the production default when storage is unavailable.
      }

      function resolvedTheme() {
        if (themeMode !== "system") return themeMode;
        return systemTheme === null || systemTheme.matches ? "dark" : "light";
      }

      function applyTheme() {
        const resolved = resolvedTheme();
        const isDark = resolved === "dark";
        document.documentElement.classList.toggle("theme-dark", isDark);
        document.documentElement.classList.toggle("theme-light", !isDark);
        themeToggle.innerHTML = iconSvg(isDark ? "sun" : "moon");
        themeToggle.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        themeToggle.title = isDark ? "Switch to light mode" : "Switch to dark mode";
      }

      themeToggle.addEventListener("click", () => {
        themeMode = resolvedTheme() === "dark" ? "light" : "dark";
        try {
          localStorage.setItem("nyxid.theme", JSON.stringify({ state: { mode: themeMode }, version: 1 }));
        } catch (_) {
          // Theme changes still apply for the current page when storage is blocked.
        }
        applyTheme();
      });

      systemTheme?.addEventListener?.("change", () => {
        if (themeMode === "system") applyTheme();
      });
      applyTheme();

      function activate(id, updateHash = true) {
        const validId = sections.some((section) => section.id === id) ? id : "uc1";
        document.querySelectorAll(".conversation").forEach((panel) => { panel.hidden = panel.id !== validId; });
        document.querySelectorAll(".tab").forEach((tab) => {
          const active = tab.dataset.target === validId;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
        });
        if (updateHash) history.replaceState(null, "", `#${validId}`);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      tabs.addEventListener("click", (event) => {
        const tab = event.target.closest(".tab");
        if (tab) activate(tab.dataset.target);
      });

      tabs.addEventListener("keydown", (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        const controls = [...tabs.querySelectorAll(".tab")];
        const current = controls.indexOf(document.activeElement);
        let next = current;
        if (event.key === "ArrowRight") next = (current + 1) % controls.length;
        if (event.key === "ArrowLeft") next = (current - 1 + controls.length) % controls.length;
        if (event.key === "Home") next = 0;
        if (event.key === "End") next = controls.length - 1;
        controls[next].focus();
        activate(controls[next].dataset.target);
        event.preventDefault();
      });

      window.addEventListener("hashchange", () => activate(location.hash.slice(1), false));
      activate(location.hash.slice(1) || "uc1", false);
    })();
  </script>
</body>
</html>
