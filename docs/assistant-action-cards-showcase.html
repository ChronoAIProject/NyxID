<!doctype html>
<html lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <meta name="color-scheme" content="dark light" />
    <title>NyxID Assistant Action Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-nyx-50: #ede5fe;
        --color-nyx-200: #b894fb;
        --color-nyx-500: #5a2af1;
        --color-nyx-secondary-400: #a672fb;
        --color-nyx-secondary-500: #9555f5;
        --color-background: #0d0d0d;
        --color-foreground: #fafafa;
        --color-card: #171717;
        --color-card-foreground: #fafafa;
        --color-muted: #262626;
        --color-muted-foreground: #a3a3a3;
        --color-destructive: #ef4444;
        --color-border: #262626;
        --color-success: #10b981;
        --color-info: #3b82f6;
        --color-text-tertiary: #525252;
        --color-hairline: rgba(255, 255, 255, 0.08);
        --color-hairline-strong: rgba(255, 255, 255, 0.15);
        --color-overlay: rgba(255, 255, 255, 0.03);
        --color-overlay-strong: rgba(255, 255, 255, 0.06);
        --radius-sm: 0.375rem;
        --radius-md: 0.625rem;
        --radius-lg: 0.75rem;
        --radius-xl: 0.875rem;
        --font-sans: "Mona Sans", system-ui, -apple-system, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html.theme-light {
        color-scheme: light;
        --color-background: #fafafa;
        --color-foreground: #18181b;
        --color-card: #ffffff;
        --color-card-foreground: #18181b;
        --color-muted: #f4f4f5;
        --color-muted-foreground: #52525b;
        --color-destructive: #dc2626;
        --color-border: #e4e4e7;
        --color-success: #059669;
        --color-info: #2563eb;
        --color-text-tertiary: #71717a;
        --color-hairline: rgba(0, 0, 0, 0.1);
        --color-hairline-strong: rgba(0, 0, 0, 0.18);
        --color-overlay: rgba(0, 0, 0, 0.04);
        --color-overlay-strong: rgba(0, 0, 0, 0.07);
      }

      html.theme-dark {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--color-background);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background: var(--color-background);
        color: var(--color-foreground);
        font-family: var(--font-sans);
        font-size: 13px;
        line-height: 1.4;
        transition:
          background-color 180ms ease,
          color 180ms ease;
      }

      button,
      a {
        font: inherit;
      }

      button {
        -webkit-tap-highlight-color: transparent;
      }

      svg {
        display: block;
      }

      .site-header {
        border-bottom: 1px solid var(--color-border);
        background: color-mix(in srgb, var(--color-background) 92%, transparent);
      }

      .site-header-inner {
        width: min(100% - 32px, 1080px);
        margin: 0 auto;
        padding: 30px 0 28px;
      }

      .header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }

      .brand-line {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--color-muted-foreground);
        font-family: var(--font-mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .brand-mark {
        display: inline-flex;
        width: 24px;
        height: 24px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(166, 114, 251, 0.3);
        border-radius: var(--radius-md);
        background: rgba(166, 114, 251, 0.1);
        color: var(--color-nyx-secondary-400);
      }

      h1 {
        max-width: 720px;
        margin: 18px 0 0;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .lede {
        max-width: 680px;
        margin: 10px 0 0;
        color: var(--color-muted-foreground);
        font-size: 13px;
        line-height: 1.6;
      }

      .theme-toggle {
        display: inline-flex;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--color-hairline);
        border-radius: var(--radius-lg);
        background: var(--color-overlay);
        color: var(--color-muted-foreground);
        cursor: pointer;
        transition:
          border-color 180ms ease,
          color 180ms ease,
          background-color 180ms ease;
      }

      .theme-toggle:hover,
      .theme-toggle:focus-visible {
        border-color: var(--color-hairline-strong);
        background: var(--color-overlay-strong);
        color: var(--color-foreground);
        outline: none;
      }

      .counts {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-top: 24px;
      }

      .count {
        min-width: 0;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-card);
        padding: 11px 12px;
      }

      .count-value {
        display: block;
        color: var(--color-foreground);
        font-family: var(--font-mono);
        font-size: 16px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .count-label {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--color-text-tertiary);
        font-size: 9px;
        text-overflow: ellipsis;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap;
      }

      main {
        width: min(100% - 32px, 680px);
        margin: 0 auto;
        padding: 18px 0 80px;
      }

      .catalogue-section {
        padding-top: 54px;
        scroll-margin-top: 24px;
      }

      .catalogue-section:first-child {
        padding-top: 26px;
      }

      .section-kicker {
        margin: 0;
        color: var(--color-nyx-secondary-400);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .section-heading-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-top: 7px;
      }

      h2 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .section-count {
        flex: 0 0 auto;
        color: var(--color-text-tertiary);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .section-why {
        margin: 6px 0 0;
        color: var(--color-muted-foreground);
        font-size: 12px;
        line-height: 1.55;
      }

      .specimens {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }

      .specimen {
        min-width: 0;
      }

      .specimen-meta {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 3px 7px;
      }

      .meta-left,
      .meta-right {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
      }

      .verb {
        min-width: 0;
        overflow: hidden;
        color: var(--color-muted-foreground);
        font-family: var(--font-mono);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        display: inline-flex;
        max-width: 100%;
        min-width: 0;
        align-items: center;
        border: 1px solid;
        border-radius: var(--radius-md);
        padding: 2px 8px;
        font-size: 10px;
        font-weight: 500;
        line-height: 1.4;
        transition:
          color 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .badge span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge-default {
        border-color: rgba(90, 42, 241, 0.3);
        background: rgba(90, 42, 241, 0.15);
        color: var(--color-nyx-200);
      }

      .badge-secondary {
        border-color: transparent;
        background: var(--color-muted);
        color: var(--color-muted-foreground);
      }

      .badge-destructive {
        border-color: color-mix(in srgb, var(--color-destructive) 30%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 15%, transparent);
        color: var(--color-destructive);
      }

      .badge-success {
        border-color: color-mix(in srgb, var(--color-success) 30%, transparent);
        background: color-mix(in srgb, var(--color-success) 10%, transparent);
        color: var(--color-success);
      }

      .badge-info {
        border-color: color-mix(in srgb, var(--color-info) 30%, transparent);
        background: color-mix(in srgb, var(--color-info) 10%, transparent);
        color: var(--color-info);
      }

      .badge-accent {
        border-color: rgba(90, 42, 241, 0.3);
        background: rgba(90, 42, 241, 0.1);
        color: var(--color-nyx-secondary-400);
      }

      html.theme-light .badge-default {
        border-color: transparent;
        background: var(--color-nyx-500);
        color: #ffffff;
      }

      html.theme-light .badge-secondary {
        border-color: var(--color-muted-foreground);
        background: transparent;
        color: var(--color-muted-foreground);
      }

      html.theme-light .badge-destructive {
        border-color: transparent;
        background: var(--color-destructive);
        color: #ffffff;
      }

      html.theme-light .badge-success {
        border-color: transparent;
        background: var(--color-success);
        color: #ffffff;
      }

      html.theme-light .badge-info {
        border-color: transparent;
        background: var(--color-info);
        color: #ffffff;
      }

      html.theme-light .badge-accent {
        border-color: transparent;
        background: var(--color-nyx-secondary-500);
        color: #ffffff;
      }

      .tag {
        padding-inline: 6px;
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .card {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        background: var(--color-card);
        color: var(--color-card-foreground);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      }

      .card-header {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 12px;
        padding: 14px 16px;
      }

      .icon-tile {
        display: flex;
        width: 36px;
        height: 36px;
        flex: 0 0 36px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(166, 114, 251, 0.3);
        border-radius: var(--radius-lg);
        background: rgba(166, 114, 251, 0.1);
        color: var(--color-nyx-secondary-400);
      }

      .card-destructive .icon-tile,
      .card-unsupported .icon-tile {
        border-color: color-mix(in srgb, var(--color-destructive) 30%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 10%, transparent);
        color: var(--color-destructive);
      }

      .icon-tile svg {
        width: 17px;
        height: 17px;
      }

      .card-heading {
        min-width: 0;
        flex: 1 1 auto;
      }

      .title-line {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      h3 {
        min-width: 0;
        margin: 0;
        color: var(--color-foreground);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
      }

      .card-body {
        margin: 6px 0 0;
        color: var(--color-muted-foreground);
        font-size: 12px;
        line-height: 1.55;
      }

      .data-section {
        display: grid;
        gap: 10px;
        border-top: 1px solid var(--color-border);
        border-bottom: 1px solid var(--color-border);
        background: var(--color-muted);
        padding: 12px 16px;
      }

      .chip-row {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .chip-label {
        flex: 0 0 auto;
        color: var(--color-muted-foreground);
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .chip {
        max-width: 100%;
      }

      .chip svg {
        width: 12px;
        height: 12px;
        flex: 0 0 auto;
        margin-right: 4px;
      }

      .mono {
        font-family: var(--font-mono);
      }

      .trust-line,
      .danger-line {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 11px 16px;
        color: var(--color-muted-foreground);
        font-size: 11px;
        line-height: 1.55;
      }

      .trust-line svg,
      .danger-line svg {
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
        margin-top: 1px;
      }

      .trust-line svg {
        color: var(--color-info);
      }

      .danger-line {
        color: var(--color-destructive);
      }

      .card-footer {
        display: flex;
        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        border-top: 1px solid var(--color-border);
        background: var(--color-muted);
        padding: 12px 16px;
      }

      .button {
        display: inline-flex;
        height: 28px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid;
        border-radius: var(--radius-lg);
        padding: 0 10px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: default;
        transition:
          filter 180ms ease,
          opacity 180ms ease,
          border-color 180ms ease;
      }

      .button svg {
        width: 12px;
        height: 12px;
        flex: 0 0 12px;
      }

      .button-primary {
        border-color: transparent;
        background: linear-gradient(to right, #a672fb 0%, #5e00f5 100%);
        color: #ffffff;
        box-shadow: 0 0 12px rgba(90, 42, 241, 0.25);
      }

      .button-destructive {
        border-color: color-mix(in srgb, var(--color-destructive) 30%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 10%, transparent);
        color: var(--color-destructive);
      }

      .button-outline {
        border-color: var(--color-hairline);
        background: transparent;
        color: var(--color-muted-foreground);
      }

      .button[disabled] {
        cursor: not-allowed;
        opacity: 0.35;
      }

      .footer-copy {
        min-width: 0;
        margin-left: auto;
        color: var(--color-muted-foreground);
        font-size: 10px;
        text-align: right;
      }

      .receipt {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-xl);
        background: var(--color-overlay);
        padding: 16px;
      }

      .receipt-success {
        border-color: color-mix(in srgb, var(--color-success) 30%, transparent);
        background: color-mix(in srgb, var(--color-success) 6%, transparent);
      }

      .receipt-failed {
        border-color: color-mix(in srgb, var(--color-destructive) 30%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 6%, transparent);
      }

      .receipt-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--color-foreground);
        font-size: 12px;
        font-weight: 600;
      }

      .receipt-heading svg {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
      }

      .receipt-success .receipt-heading svg,
      .receipt-low .receipt-heading svg {
        color: var(--color-success);
      }

      .receipt-failed .receipt-heading svg {
        color: var(--color-destructive);
      }

      .receipt-neutral .receipt-heading svg {
        color: var(--color-muted-foreground);
      }

      .receipt-note {
        margin: 8px 0 0;
        color: var(--color-muted-foreground);
        font-size: 12px;
        line-height: 1.55;
      }

      .receipt .data-section {
        margin: 12px -16px -4px;
        border-bottom: 0;
      }

      .microtag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 11px;
        color: var(--color-text-tertiary);
        font-family: var(--font-mono);
        font-size: 9px;
      }

      .microtag svg {
        width: 11px;
        height: 11px;
      }

      .dashboard-link {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 11px;
        color: var(--color-nyx-secondary-400);
        font-size: 11px;
        font-weight: 500;
        text-decoration: none;
      }

      .dashboard-link svg {
        width: 12px;
        height: 12px;
      }

      .flow-storyboard {
        display: grid;
        gap: 22px;
        margin-top: 20px;
      }

      .flow-frame {
        position: relative;
        display: grid;
        min-width: 0;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 12px;
      }

      .flow-frame:not(:last-child)::after {
        position: absolute;
        top: 38px;
        bottom: -22px;
        left: 17px;
        width: 1px;
        background: var(--color-hairline-strong);
        content: "";
      }

      .flow-index {
        position: relative;
        z-index: 1;
        display: flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(166, 114, 251, 0.35);
        border-radius: 999px;
        background: color-mix(in srgb, var(--color-nyx-secondary-400) 12%, var(--color-background));
        color: var(--color-nyx-secondary-400);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
      }

      .flow-frame-branch .flow-index {
        border-color: var(--color-hairline-strong);
        background: var(--color-background);
        color: var(--color-muted-foreground);
      }

      .flow-frame-error .flow-index {
        border-color: color-mix(in srgb, var(--color-destructive) 35%, transparent);
        background: color-mix(in srgb, var(--color-destructive) 9%, var(--color-background));
        color: var(--color-destructive);
      }

      .flow-content {
        min-width: 0;
      }

      .flow-caption {
        min-width: 0;
        padding: 1px 2px 9px;
      }

      .flow-caption strong {
        display: block;
        color: var(--color-foreground);
        font-size: 12px;
        font-weight: 600;
      }

      .flow-caption span {
        display: block;
        margin-top: 2px;
        color: var(--color-muted-foreground);
        font-size: 10px;
        line-height: 1.5;
      }

      .flow-surface-stack,
      .branch-stack {
        display: grid;
        min-width: 0;
        gap: 10px;
      }

      .dialog-mock {
        position: relative;
        min-width: 0;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-card);
        color: var(--color-card-foreground);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.16),
          0 0 20px rgba(90, 42, 241, 0.04);
      }

      .dialog-chrome {
        display: grid;
        min-width: 0;
        gap: 15px;
        padding: 18px;
      }

      .dialog-close {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--color-muted-foreground);
        cursor: default;
      }

      .dialog-close svg {
        width: 14px;
        height: 14px;
      }

      .modal-step {
        padding-right: 36px;
        color: var(--color-nyx-secondary-400);
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .mock-back {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        align-items: center;
        gap: 5px;
        border: 0;
        background: transparent;
        color: var(--color-muted-foreground);
        padding: 0;
        font-size: 10px;
        cursor: default;
      }

      .mock-back svg {
        width: 11px;
        height: 11px;
      }

      .step-header {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 12px;
        padding-right: 30px;
      }

      .service-glyph {
        display: flex;
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-muted);
        color: var(--color-foreground);
      }

      .service-glyph svg {
        width: 17px;
        height: 17px;
      }

      .step-heading-copy {
        min-width: 0;
      }

      .dialog-title {
        margin: 0;
        color: var(--color-foreground);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.25;
      }

      .dialog-description {
        margin: 4px 0 0;
        color: var(--color-muted-foreground);
        font-size: 12px;
        line-height: 1.5;
      }

      .mock-label {
        margin: 0 0 7px;
        color: var(--color-foreground);
        font-size: 11px;
        font-weight: 500;
      }

      .service-prefill {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
        border: 2px solid color-mix(in srgb, var(--color-nyx-secondary-400) 70%, transparent);
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--color-nyx-secondary-400) 6%, transparent);
        padding: 12px;
      }

      .service-prefill-copy {
        min-width: 0;
        flex: 1 1 auto;
      }

      .service-prefill-copy strong,
      .service-prefill-copy span {
        display: block;
      }

      .service-prefill-copy strong {
        color: var(--color-foreground);
        font-size: 12px;
      }

      .service-prefill-copy span {
        margin-top: 2px;
        overflow: hidden;
        color: var(--color-muted-foreground);
        font-family: var(--font-mono);
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .prefill-note,
      .handoff-note,
      .verify-summary {
        display: flex;
        min-width: 0;
        align-items: flex-start;
        gap: 8px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-overlay);
        padding: 11px 12px;
        color: var(--color-muted-foreground);
        font-size: 11px;
        line-height: 1.55;
      }

      .prefill-note svg,
      .handoff-note svg,
      .verify-summary svg {
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
        margin-top: 1px;
        color: var(--color-nyx-secondary-400);
      }

      .choice-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .choice-tile {
        display: flex;
        min-width: 0;
        min-height: 92px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 2px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: transparent;
        padding: 10px;
        color: var(--color-foreground);
        text-align: center;
      }

      .choice-tile.selected {
        border-color: color-mix(in srgb, var(--color-nyx-secondary-400) 70%, transparent);
        background: color-mix(in srgb, var(--color-nyx-secondary-400) 6%, transparent);
      }

      .choice-tile svg {
        width: 18px;
        height: 18px;
      }

      .choice-tile strong {
        font-size: 10px;
        font-weight: 500;
      }

      .choice-tile span {
        color: var(--color-muted-foreground);
        font-size: 9px;
        line-height: 1.4;
      }

      .scope-list {
        display: grid;
        gap: 7px;
      }

      .scope-row {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
        background: var(--color-overlay);
        padding: 10px 11px;
      }

      .scope-check {
        display: flex;
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
        background: var(--color-nyx-secondary-500);
        color: #ffffff;
      }

      .scope-check svg {
        width: 11px;
        height: 11px;
      }

      .scope-copy {
        min-width: 0;
      }

      .scope-copy strong,
      .scope-copy span {
        display: block;
      }

      .scope-copy strong {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
      }

      .scope-copy span {
        margin-top: 2px;
        color: var(--color-muted-foreground);
        font-size: 9px;
      }

      .dialog-actions {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 1px;
      }

      .dialog-actions-single .button,
      .button-wide {
        width: 100%;
      }

      .dialog-actions .button {
        height: 36px;
        padding-inline: 14px;
      }

      .error-panel {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        border: 1px solid color-mix(in srgb, var(--color-destructive) 28%, transparent);
        border-radius: var(--radius-lg);
        background: color-mix(in srgb, var(--color-destructive) 10%, transparent);
        padding: 11px 12px;
        color: var(--color-destructive);
        font-size: 11px;
        line-height: 1.5;
      }

      .error-panel svg {
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
        margin-top: 1px;
      }

      .verify-summary {
        color: var(--color-foreground);
      }

      .verify-summary > div {
        min-width: 0;
        flex: 1 1 auto;
      }

      .verify-summary svg {
        color: var(--color-success);
      }

      .reference-row {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--color-border);
        margin-top: 9px;
        padding-top: 9px;
        color: var(--color-muted-foreground);
        font-size: 10px;
      }

      .reference-row code {
        color: var(--color-foreground);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      .continue-event {

        min-width: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 7px 12px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-overlay);
        padding: 9px 11px;
        color: var(--color-muted-foreground);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1.5;
      }

      .continue-event-main {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .continue-event-note {
        flex: 0 0 auto;
        color: var(--color-text-tertiary);
        font-family: var(--font-sans);
        font-size: 9px;
      }

      .assistant-bubble {
        width: min(88%, 510px);
        border: 1px solid var(--color-border);
        border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
        background: var(--color-muted);
        padding: 11px 13px;
        color: var(--color-foreground);
        font-size: 11px;
        line-height: 1.55;
      }

      .assistant-bubble-label {
        display: block;
        margin-bottom: 4px;
        color: var(--color-text-tertiary);
        font-family: var(--font-mono);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .page-footer {
        width: min(100% - 32px, 680px);
        margin: 0 auto;
        border-top: 1px solid var(--color-border);
        padding: 22px 0 36px;
        color: var(--color-text-tertiary);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1.6;
        text-align: center;
      }

      @media (max-width: 560px) {
        .site-header-inner,
        main,
        .page-footer {
          width: min(100% - 24px, 680px);
        }

        .site-header-inner {
          padding-top: 20px;
        }

        h1 {
          font-size: 24px;
        }

        .counts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .count:first-child {
          grid-column: span 2;
        }

        .catalogue-section {
          padding-top: 44px;
        }

        .card-header {
          padding: 13px 14px;
        }

        .data-section,
        .card-footer {
          padding-right: 14px;
          padding-left: 14px;
        }

        .trust-line,
        .danger-line {
          padding-right: 14px;
          padding-left: 14px;
        }

        .footer-copy {
          width: 100%;
          margin-left: 0;
          text-align: left;
        }

        .specimen-meta {
          align-items: flex-start;
        }

        .meta-right {
          justify-content: flex-end;
        }

        .flow-frame {
          grid-template-columns: 30px minmax(0, 1fr);
          gap: 8px;
        }

        .flow-index {
          width: 28px;
          height: 28px;
          font-size: 9px;
        }

        .flow-frame:not(:last-child)::after {
          top: 32px;
          left: 13px;
        }

        .dialog-chrome {
          gap: 13px;
          padding: 15px;
        }

        .dialog-close {
          top: 11px;
          right: 11px;
        }

        .step-header {
          gap: 9px;
        }

        .choice-grid {
          gap: 7px;
        }

        .choice-tile {
          min-height: 98px;
          padding: 8px 6px;
        }

        .dialog-actions {
          flex-wrap: wrap;
        }

        .dialog-actions .button {
          flex: 1 1 auto;
        }

        .assistant-bubble {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }

          github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3.3-.4 6.8-1.6 6.8-7A5.4 5.4 0 0 0 19.4 4 5 5 0 0 0 19.3.5S18.2.1 15 1.8a13.4 13.4 0 0 0-7 0C4.8.1 3.7.5 3.7.5A5 5 0 0 0 3.6 4a5.4 5.4 0 0 0-1.4 3.7c0 5.4 3.5 6.6 6.8 7A4.8 4.8 0 0 0 8 18v4"/><path d="M8 19c-3 .9-3-1.5-4-2"/>',
          arrowLeft: '<path d="m15 18-6-6 6-6"/>',
          plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a6 6 0 0 1-12 0V8z"/>',
          globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 0 20M12 2a15.3 15.3 0 0 0 0 20"/>',
          key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15 6l3 3M18 3l3 3"/>',
          refresh: '<path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/>',
          server: '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/>',
          user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
          app: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18M3 9h18"/>',
          shield: '<path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3z"/><path d="m9 12 2 2 4-4"/>',
          device: '<rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/>',
          trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/>',
          link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
          unlink: '<path d="m18.84 12.25 1.69-1.69a5 5 0 0 0-7.07-7.07l-1.72 1.72M5.17 11.75l-1.7 1.7a5 5 0 0 0 7.07 7.07l1.7-1.7M8 2v3M2 8h3M16 19v3M19 16h3"/>',
          building: '<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M8 10h.01M16 10h.01M8 14h.01M16 14h.01"/>',
          bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>',
          check: '<path d="m20 6-11 11-5-5"/>',
          x: '<path d="M18 6 6 18M6 6l12 12"/>',
          alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
          external: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
          bolt: '<path d="m13 2-9 12h8l-1 8 9-12h-8z"/>'
        };
        const path = paths[name] || paths.shield;
        return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function badge(text, variant, extraClass) {
        return '<span class="badge badge-' + variant + (extraClass ? " " + extraClass : "") + '"><span>' + escapeHtml(text) + '</span></span>';
      }

      function riskBadge(risk) {
        if (risk === "destructive" || risk === "unsupported") return badge(risk, "destructive", "tag");
        if (risk === "grant") return badge(risk, "accent", "tag");
        return badge(risk, "secondary", "tag");
      }

      function renderRows(rows) {
        if (!rows || rows.length === 0) return "";
        return '<div class="data-section">' + rows.map(function (row) {
          const chips = row.chips.map(function (chip) {
            const kind = chip.kind === "node" ? "info" : "secondary";
            const icon = chip.kind === "node" ? iconSvg("server") : "";
            return '<span class="badge badge-' + kind + ' chip' + (chip.mono ? " mono" : "") + '">' + icon + '<span>' + escapeHtml(chip.text) + '</span></span>';
          }).join("");
          return '<div class="chip-row"><span class="chip-label">' + escapeHtml(row.label) + '</span>' + chips + '</div>';
        }).join("") + '</div>';
      }

      function stateBadge(card) {
        if (card.state === "unsupported") return badge(card.badge, "destructive", "");
        if (card.state === "in_progress") return badge(card.badge, "info", "");
        return badge(card.badge || (card.risk === "destructive" ? "Destructive action" : "Confirmation required"), card.risk === "destructive" ? "destructive" : "accent", "");
      }

      function renderActionCard(card) {
        const unsupported = card.state === "unsupported";
        const destructive = card.risk === "destructive";
        const busy = card.state === "in_progress";
        const cardClass = unsupported ? "card-unsupported" : destructive ? "card-destructive" : "card-grant";
        const journey = card.journey
          ? '<div class="trust-line">' + iconSvg("shield") + '<span>' + escapeHtml(card.journey) + '</span></div>'
          : "";
        const danger = destructive
          ? '<div class="danger-line">' + iconSvg("alert") + '<span>This cannot be undone. You will be asked every time.</span></div>'
          : "";
        const primary = unsupported || !card.cta
          ? ""
          : '<button class="button ' + (destructive ? "button-destructive" : "button-primary") + '" type="button"' + (busy ? " disabled" : "") + '>' + iconSvg(busy ? "refresh" : destructive ? "trash" : "shield") + '<span>' + escapeHtml(card.cta) + '</span></button>';
        const decline = '<button class="button button-outline" type="button"' + (busy ? " disabled" : "") + '>' + iconSvg("x") + '<span>Decline</span></button>';
        const footer = card.footer || (destructive ? "Asked every time. Never remembered." : "One confirmation.");
        return '<div class="card ' + cardClass + '">' +
          '<div class="card-header">' +
            '<div class="icon-tile">' + iconSvg(card.icon) + '</div>' +
            '<div class="card-heading"><div class="title-line"><h3>' + escapeHtml(card.title) + '</h3>' + stateBadge(card) + '</div>' +
            '<p class="card-body">' + escapeHtml(card.body) + '</p></div>' +
          '</div>' +
          renderRows(card.rows) + journey + danger +
          '<div class="card-footer">' + primary + decline + '<span class="footer-copy">' + escapeHtml(footer) + '</span></div>' +
        '</div>';
      }

      function renderReceipt(card) {
        const tone = card.tone || "low";
        const note = card.note ? '<div class="microtag">' + escapeHtml(card.note) + '</div>' : "";
        const microtag = card.inventory
          ? '<div class="microtag">' + iconSvg("bolt") + '<span>Executed immediately - no confirmation</span></div>'
          : note;
        const link = card.link
          ? '<a class="dashboard-link" href="#" onclick="return false">' + escapeHtml(card.link) + iconSvg("external") + '</a>'
          : "";
        return '<div class="receipt receipt-' + tone + '">' +
          '<div class="receipt-heading">' + iconSvg(card.icon || "check") + '<span>' + escapeHtml(card.title) + '</span></div>' +
          '<p class="receipt-note">' + escapeHtml(card.body) + '</p>' +
          renderRows(card.rows) + microtag + link +
        '</div>';
      }

      function renderSpecimen(card, index) {
        const tags = (card.tags || []).map(function (tag) {
          return badge(tag, "secondary", "tag");
        }).join("");
        const marker = badge(card.marker, card.marker === "shipped" ? "success" : "secondary", "tag");
        const variant = card.variant ? badge(card.variant, "secondary", "tag") : "";
        return '<article class="specimen" data-card-index="' + index + '" data-verb="' + escapeHtml(card.verb) + '" data-risk="' + escapeHtml(card.risk) + '" data-form="' + escapeHtml(card.form) + '" data-inventory="' + String(card.inventory) + '">' +
          '<div class="specimen-meta">' +
            '<div class="meta-left"><code class="verb">' + escapeHtml(card.verb) + '</code>' + riskBadge(card.risk) + variant + tags + '</div>' +
            '<div class="meta-right">' + marker + '</div>' +
          '</div>' +
          (card.form === "receipt" ? renderReceipt(card) : renderActionCard(card)) +
        '</article>';
      }

      function renderSection(sectionKey, sectionCards) {
        const meta = sectionMeta[sectionKey];
        return '<section class="catalogue-section" id="section-' + escapeHtml(sectionKey) + '">' +
          '<p class="section-kicker">' + escapeHtml(meta.kicker) + '</p>' +
          '<div class="section-heading-row"><h2>' + escapeHtml(meta.title) + '</h2><span class="section-count">' + sectionCards.length + ' cards</span></div>' +
          '<p class="section-why">' + escapeHtml(meta.why) + '</p>' +
          '<div class="specimens">' + sectionCards.map(function (card) { return renderSpecimen(card, cards.indexOf(card)); }).join("") + '</div>' +
        '</section>';
      }

      function renderDialogMock(config) {
        const back = config.back
          ? '<button class="mock-back" type="button">' + iconSvg("arrowLeft") + '<span>' + escapeHtml(config.back) + '</span></button>'
          : "";
        const glyph = config.icon
          ? '<span class="service-glyph">' + iconSvg(config.icon) + '</span>'
          : "";
        const actions = config.actions && config.actions.length
          ? '<div class="dialog-actions' + (config.wideAction ? " dialog-actions-single" : "") + '">' + config.actions.map(function (action) {
              const icon = action.icon ? iconSvg(action.icon) : "";
              return '<button class="button ' + (action.variant === "primary" ? "button-primary" : "button-outline") + '" type="button">' + icon + '<span>' + escapeHtml(action.label) + '</span></button>';
            }).join("") + '</div>'
          : "";

        return '<div class="dialog-mock" data-modal-step="' + escapeHtml(config.step) + '">' +
          '<div class="dialog-chrome">' +
            '<button class="dialog-close" type="button" aria-label="Close dialog">' + iconSvg("x") + '</button>' +
            '<div class="modal-step">' + escapeHtml(config.indicator) + '</div>' +
            back +
            '<div class="step-header">' + glyph +
              '<div class="step-heading-copy"><h3 class="dialog-title">' + escapeHtml(config.title) + '</h3>' +
              '<p class="dialog-description">' + escapeHtml(config.description) + '</p></div>' +
            '</div>' +
            config.body + actions +
          '</div>' +
        '</div>';
      }

      function renderContinueEvent(disposition, resourceId) {
        const eventText = disposition === "completed"
          ? '→ action.continue posted · req_7 completed · resource ' + resourceId
          : '→ action.continue posted · req_7 · disposition: ' + disposition;
        return '<div class="continue-event" data-disposition="' + escapeHtml(disposition) + '">' +
          '<span class="continue-event-main">' + escapeHtml(eventText) + '</span>' +
          '<span class="continue-event-note">automatic — no user action</span>' +
        '</div>';
      }

      function renderFlowFrame(index, title, description, content, extraClass) {
        return '<article class="flow-frame' + (extraClass ? " " + extraClass : "") + '" data-flow-stage="' + escapeHtml(index) + '">' +
          '<div class="flow-index" aria-hidden="true">' + escapeHtml(index) + '</div>' +
          '<div class="flow-content">' +
            '<div class="flow-caption"><strong>' + escapeHtml(title) + '</strong><span>' + escapeHtml(description) + '</span></div>' +
            '<div class="flow-surface-stack">' + content + '</div>' +
          '</div>' +
        '</article>';
      }

      function renderFlow() {
        const pending = cards.find(function (card) { return card.section === "states" && card.variant === "pending"; });
        const completed = cards.find(function (card) { return card.section === "states" && card.variant === "completed"; });
        const failed = cards.find(function (card) { return card.section === "states" && card.variant === "failed"; });
        const declined = cards.find(function (card) { return card.section === "states" && card.variant === "declined"; });

        const serviceModal = renderDialogMock({
          step: "service",
          indicator: "Service · automatic prefill",
          title: "Add AI Service",
          description: "Pick from the catalog or create a custom endpoint.",
          body:
            '<div><p class="mock-label">Selected service</p>' +
              '<div class="service-prefill"><span class="service-glyph">' + iconSvg("github") + '</span>' +
                '<span class="service-prefill-copy"><strong>GitHub</strong><span>api-github</span></span>' +
                badge("OAuth", "secondary", "tag") +
              '</div></div>' +
            '<div class="prefill-note">' + iconSvg("check") + '<span><code class="mono">prefillSlug</code> matched GitHub. The real dialog advances to Routing automatically; there is no second service-selection click.</span></div>',
          actions: []
        });

        const routingModal = renderDialogMock({
          step: "routing",
          indicator: "Routing · 1 of 3",
          back: "Back to catalog",
          icon: "github",
          title: "Configure routing for GitHub",
          description: "Developer platform for repositories, issues, and automation.",
          body:
            '<div><p class="mock-label">How should requests reach this service?</p>' +
              '<div class="choice-grid">' +
                '<div class="choice-tile selected">' + iconSvg("globe") + '<strong>Direct</strong><span>NyxID proxies to endpoint</span></div>' +
                '<div class="choice-tile">' + iconSvg("server") + '<strong>Via Node</strong><span>Route through credential node</span></div>' +
              '</div></div>' +
            '<div><p class="mock-label">Which OAuth app authorizes this?</p>' +
              '<div class="choice-grid">' +
                '<div class="choice-tile selected">' + iconSvg("logo") + '<strong>NyxID managed</strong><span>One click. Curated scopes.</span></div>' +
                '<div class="choice-tile">' + iconSvg("key") + '<strong>Your own OAuth app</strong><span>Use your own client credentials.</span></div>' +
              '</div></div>',
          actions: [{ label: "Next: Connect", variant: "primary" }],
          wideAction: true
        });

        const authorizeBody =
          '<div><p class="mock-label">Requested access</p>' +
            '<div class="scope-list"><div class="scope-row"><span class="scope-check">' + iconSvg("check") + '</span>' +
              '<span class="scope-copy"><strong>repo</strong><span>Repository access selected in NyxID</span></span>' +
            '</div></div></div>' +
          '<div class="handoff-note">' + iconSvg("external") + '<span>The GitHub popup opens on NyxID’s surface. The token never enters this chat; the assistant receives only brokered access after you finish.</span></div>';

        const authorizeModal = renderDialogMock({
          step: "authorize",
          indicator: "Authorize · 2 of 3",
          back: "Back",
          icon: "github",
          title: "Connect to GitHub",
          description: "This service uses OAuth to authenticate. Review access, then continue to GitHub.",
          body: authorizeBody,
          actions: [{ label: "Continue to GitHub", variant: "primary", icon: "external" }],
          wideAction: true
        });

        const verifyModal = renderDialogMock({
          step: "verify",
          indicator: "Verify · 3 of 3",
          icon: "github",
          title: "Service “GitHub” connected",
          description: "Connect your AI tools to this service through NyxID.",
          body:
            '<div class="verify-summary">' + iconSvg("check") + '<div><strong>Connection verified</strong><div class="reference-row"><span>User service</span><code>us_44</code></div></div></div>',
          actions: [{ label: "Done", variant: "primary" }]
        });

        const authorizeErrorModal = renderDialogMock({
          step: "authorize-error",
          indicator: "Authorize · retry",
          back: "Back",
          icon: "github",
          title: "Connect to GitHub",
          description: "This service uses OAuth to authenticate. Review access, then continue to GitHub.",
          body: authorizeBody + '<div class="error-panel">' + iconSvg("alert") + '<span>GitHub authorization did not start. Check the popup setting and try again; nothing has been reported to the assistant yet.</span></div>',
          actions: [{ label: "Try again", variant: "primary", icon: "refresh" }],
          wideAction: true
        });

        const frames = [
          renderFlowFrame("1", "Card pending", "The assistant request waits in chat until the user chooses Connect GitHub or Decline.", renderActionCard(pending), ""),
          renderFlowFrame("2", "Service prefill", "GitHub resolves from api-github automatically before the first user-visible choice.", serviceModal, ""),
          renderFlowFrame("3", "Modal · Routing", "Direct is preselected; the user can still choose a credential node or their own OAuth app.", routingModal, ""),
          renderFlowFrame("4", "Modal · Authorize", "OAuth leaves the chat surface without moving reusable credential material through the transcript.", authorizeModal, ""),
          renderFlowFrame("5", "Modal · Verify", "The post-connect success step owns the created user-service reference and reports only after Done.", verifyModal, ""),
          renderFlowFrame("6", "Card completed", "The receipt collapses the journey, the continuation posts automatically, and the assistant resumes.",
            renderReceipt(completed) + renderContinueEvent("completed", "us_44") +
            '<div class="assistant-bubble"><span class="assistant-bubble-label">Assistant</span>GitHub is connected. I can continue with the repository task now.</div>', ""),
          renderFlowFrame("7A", "Branch · Authorize error", "The modal keeps a recoverable OAuth error local; a terminal failure reports only after the journey cannot continue.",
            authorizeErrorModal + '<p class="mock-label">If the journey ends after retry</p>' + renderReceipt(failed) + renderContinueEvent("failed"),
            "flow-frame-branch flow-frame-error"),
          renderFlowFrame("7B", "Branch · Declined", "Decline resolves directly from the pending card. AddKeyDialog never opens.",
            '<div class="handoff-note">' + iconSvg("x") + '<span>Decline pressed on the chat card · no modal opened</span></div>' +
            renderReceipt(declined) + renderContinueEvent("declined"), "flow-frame-branch")
        ];

        return '<section class="catalogue-section flow-section" id="section-flow">' +
          '<p class="section-kicker">Part II / continuous journey</p>' +
          '<div class="section-heading-row"><h2>Flow</h2><span class="section-count">' + frames.length + ' frames · 5 modal views</span></div>' +
          '<p class="section-why">From assistant request to NyxID-owned authorization, automatic continuation, and the resumed conversation. Every stage stays visible for review.</p>' +
          '<div class="flow-storyboard">' + frames.join("") + '</div>' +
        '</section>';
      }

      function renderCounts() {
        const inventory = cards.filter(function (card) { return card.inventory; });
        const totals = {
          catalogue: inventory.length,
          rendered: cards.length,
          low: inventory.filter(function (card) { return card.risk === "low"; }).length,
          grant: inventory.filter(function (card) { return card.risk === "grant"; }).length,
          destructive: inventory.filter(function (card) { return card.risk === "destructive"; }).length
        };
        document.body.dataset.catalogueCount = String(totals.catalogue);
        document.body.dataset.renderedCount = String(totals.rendered);
        document.body.dataset.lowCount = String(totals.low);
        document.body.dataset.grantCount = String(totals.grant);
        document.body.dataset.destructiveCount = String(totals.destructive);
        const items = [
          [totals.catalogue, "Catalogue"],
          [totals.rendered, "Rendered incl. states"],
          [totals.low, "Low"],
          [totals.grant, "Grant"],
          [totals.destructive, "Destructive"]
        ];
        document.getElementById("counts").innerHTML = items.map(function (item) {
          return '<div class="count"><span class="count-value">' + item[0] + '</span><span class="count-label">' + item[1] + '</span></div>';
        }).join("");
      }

      function renderCatalogue() {
        const sectionKeys = [];
        cards.forEach(function (card) {
          if (!sectionKeys.includes(card.section)) sectionKeys.push(card.section);
        });
        document.getElementById("catalogue").innerHTML = sectionKeys.map(function (sectionKey) {
          const section = renderSection(sectionKey, cards.filter(function (card) { return card.section === sectionKey; }));
          return sectionKey === "states" ? section + renderFlow() : section;
        }).join("");
      }

      function syncThemeButton() {
        const light = document.documentElement.classList.contains("theme-light");
        const button = document.getElementById("themeToggle");
        const label = light ? "Switch to dark theme" : "Switch to light theme";
        button.innerHTML = iconSvg(light ? "moon" : "sun");
        button.setAttribute("aria-label", label);
        button.setAttribute("title", label);
      }

      document.getElementById("brandMark").innerHTML = iconSvg("logo");
      document.getElementById("themeToggle").addEventListener("click", function () {
        const root = document.documentElement;
        const light = root.classList.toggle("theme-light");
        root.classList.toggle("theme-dark", !light);
        syncThemeButton();
      });

      renderCounts();
      renderCatalogue();
      syncThemeButton();
    </script>
  </body>
</html>
