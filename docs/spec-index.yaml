  - area: sandboxes
    title: Sandboxes (CMA sandboxes, remote machines, sandbox billing, generated files)
    status: current
    specs:
      - { doc: docs/chat/12-cma-sessions.md, role: reference }
      - { doc: docs/superpowers/specs/2026-11-04-cma-worker-v1-design.md, role: design }
      - { doc: docs/CMA_BILLING.md, role: reference }
      - { doc: docs/REMOTE_NYX_MACHINE_FINAL_READ_CONTRACTS.md, role: reference }
      - { doc: docs/REMOTE_MACHINE_DELETE_RECOVERY.md, role: runbook }
      - { doc: docs/chat/10-uploads.md, role: reference }  # section "Generated Sandbox files"
    governs:
      - backend/src/services/assistant_cma_*
      - backend/src/handlers/assistant_cma_*
