registries:
  - { code: backend/src/routes.rs, spec: docs/API.md, holds: routes }
  - { code: backend/src/config.rs, spec: docs/ENV.md, holds: environment variables and defaults }
  - { code: backend/src/errors/mod.rs, spec: AGENTS.md, holds: error codes (Critical Rule 3) }
  - { code: backend/src/db.rs, spec: docs/security/PERSONAL_ERASURE_INVENTORY.md, holds: collections and indexes }
  - { code: backend/src/services/personal_data_registry.rs, spec: docs/security/PERSONAL_ERASURE_INVENTORY.md, holds: collection registration }

input_of:
  - { doc: docs/assistant/CMA_WORKER_GUIDE.md, consumer: runtime and test, read_by: backend/src/services/assistant_cma_tools.rs }
  - { doc: docs/assistant/CHANNEL_SETUP_GUIDE.md, consumer: runtime, read_by: backend/src/handlers/assistant_team.rs }
  - { doc: docs/AI_AGENT_PLAYBOOK.md, consumer: runtime, read_by: backend/src/handlers/llms_txt.rs }
  - { doc: docs/examples/nyxbot-voice-service.template.json, consumer: runtime, read_by: backend/src/services/voice/catalog.rs }
  - { doc: docs/security/PERSONAL_ERASURE_INVENTORY.md, consumer: test, read_by: backend/src/services/personal_data_registry.rs }
  - { doc: docs/security/ENCRYPTED_FIELD_INVENTORY.md, consumer: test, read_by: backend/src/services/encrypted_record_migration/tests/registry.rs }
  - { doc: docs/AGENT_OPERATION_SCOPES.md, consumer: test, read_by: backend/src/services/agent_operation_scope_tests.rs }
  - { doc: docs/ACCOUNT_DATA_EXPORT.md, consumer: test, read_by: backend/src/services/account_export_model_tests.rs }
  - { doc: docs/chat/activity-history-compat.md, consumer: test, read_by: "frontend/src/schemas/assistant-history-compat.test.ts, mobile/src/features/assistant/assistantHistoryCompat.test.ts" }
  - { doc: "docs/site/**", consumer: frontend build, read_by: frontend/vite.config.ts (publish gate; pages must be in frontend/src/features/docs/manifest.ts) }

