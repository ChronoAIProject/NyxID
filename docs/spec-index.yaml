# NyxID spec index: which spec governs which code.
#
# Agents: search this file for the path you are editing, e.g.
#   grep -n "handlers/triggers.rs" docs/spec-index.yaml
# or for its parent folder, then read every matching area's specs.
# A path can match more than one area.
#
# Human-readable version: docs/README.md. How to keep specs current:
# AGENTS.md ("Specs: keep them current as you work") and
# docs/SPEC_MAINTENANCE.md (nightly check).
#
# Fields
#   area         short area label (also the owner label)
#   specs        governing documents; `role` is reference (current behaviour,
#                edited in place), design (why; frozen), runbook (operations)
#                or guide (tasks)
#   governs      git pathspec globs (`*` within a path segment)
#   verified_at  last commit at which the specs were checked against the code
#   input_of     docs that code, tests or the frontend build read directly
#                (edit with care; run the named consumer)

version: 1

areas:
  - area: nyxbot
    title: NyxBot (NyxAgent engine, agents, groups, shared agents)
    status: current
    specs:
      - { doc: docs/chat/08-nyxagent-engine.md, role: reference }
      - { doc: docs/chat/09-nyxbot-orchestrator.md, role: design }
      - { doc: docs/chat/12-shared-agents-and-groups.md, role: reference }
      - { doc: docs/NYXBOT_SERVICE_EXECUTION.md, role: reference }
      - { doc: docs/NYXBOT_FIRST_RUN.md, role: reference }
    governs:
      - backend/src/services/assistant_*
      - backend/src/handlers/assistant_*
      - backend/src/models/assistant_*
      - backend/src/services/nyxbot_*
      - backend/src/handlers/nyxbot*
      - frontend/src/components/assistant/*
    verified_at: 1f8bcaf10c2b6222456e71300e2f75e539d41778

  - area: channels
    title: Channel bots (relay, Agent Event Gateway, platform adapters)
    status: current
    specs:
      - { doc: docs/CHANNEL_BOT_RELAY.md, role: reference }
      - { doc: docs/CHANNEL_EVENT_GATEWAY.md, role: reference }
      - { doc: docs/CHANNEL_THREAD_FOLLOW.md, role: reference }
      - { doc: docs/CHANNEL_THREAD_FOLLOW_GATEWAY_CONTRACT.md, role: reference }
      - { doc: docs/TELEGRAM_NEW.md, role: reference }
      - { doc: docs/PLATFORM_BOTFATHER.md, role: reference }
      - { doc: docs/AURINKO_INTEGRATION.md, role: reference }
    governs:
      - backend/src/services/channel_*
      - backend/src/services/channel_adapters/*
      - backend/src/handlers/channel_*
      - backend/src/models/channel_*
      - backend/src/services/nyxbot_gateway_*
      - backend/src/handlers/nyxbot_gateway_*
      - backend/src/services/telegram_*
      - backend/src/handlers/telegram_*
      - backend/src/services/whatsapp_native*
      - backend/src/services/org_channel_service*
    verified_at: 1f8bcaf10c2b6222456e71300e2f75e539d41778

  - area: automations
    title: Automations (triggers, webhook and schedule sources)
    status: current
    specs:
      - { doc: docs/NYXBOT_SCHEDULES.md, role: reference }
      - { doc: docs/API.md, role: reference }  # section "Inbound Triggers"
    governs:
      - backend/src/services/trigger_*
      - backend/src/handlers/trigger*
      - backend/src/models/trigger*
      - backend/src/handlers/assistant_schedules.rs
    verified_at: 1f8bcaf10c2b6222456e71300e2f75e539d41778

  - area: notifications
    title: Notifications (NyxBot feed, push, approvals delivery)
    status: current
    specs:
      - { doc: docs/chat/12-notifications.md, role: reference }
