# NyxID spec index: which spec governs which code.
#
# Agents: this file is short. Read it and pick every area with a `governs`
# pattern that matches the path you are editing, then use each spec's `covers`
# line to choose what to read. If several areas match, start with the most
# specific pattern (for example `assistant_cma_*` before `assistant_*`).
# Patterns use git's default pathspec matching, where `*` matches any
# characters including `/`; to test one:
#   git ls-files -- '<pattern>' | grep -Fx '<your path>'
#
# Human-readable version: docs/README.md. How to keep specs current:
# AGENTS.md ("Specs: keep them current as you work") and
# docs/SPEC_MAINTENANCE.md (nightly check).
#
# Fields
#   area         short area label (also the owner label)
#   specs        governing documents; `role` is reference (current behaviour,
#                edited in place), design (why; frozen), runbook (operations)
#                or guide (tasks); `covers` says what to read it for
#   governs      git pathspec patterns (`*` matches any characters, including `/`);
#                the nightly check runs `git log -- '<pattern>'` with them
#   verified_at  last commit at which the specs were checked against the code
#   input_of     docs that code, tests or the frontend build read directly
#                (edit with care; run the named consumer)

