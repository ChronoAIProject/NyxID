[package]
name = "nyxid-companion"
version = "0.1.0"
description = "NyxID desktop meal companion"
authors = ["NyxID"]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"

[lib]
name = "nyxid_companion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "nyxid-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
chrono = { version = "0.4.43", features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "=2.12.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.5.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tempfile = "3"
thiserror = "2"

# This application is deliberately independent from NyxID's root Cargo workspace.
[workspace]
resolver = "3"
