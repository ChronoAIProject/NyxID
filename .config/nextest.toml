[profile.ci]
fail-fast = false
# Terminate any test after five minutes so a stalled runner or hung test reports
# its name and output (and junit.xml is still written) instead of consuming the
# entire job timeout. No retries: a flaky test must stay visible.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# This test observes real MongoDB heartbeats against wall-clock deadlines.
# Keep concurrent fixture creation and cleanup out of its observation window.
[[profile.ci.overrides]]
filter = "test(=handlers::assistant_nyxagent::tests::capacity_wait_beyond_31_seconds_keeps_heartbeat_and_owner_slot)"
threads-required = "num-cpus"

# These tests require positive live-consent reads within the production 200ms
# MongoDB / 250ms overall deadlines. Reserve the runner's test slots so unrelated
# MongoDB fixture churn cannot turn their healthy-admission preconditions into
# intentional fail-closed drops. Keep the real deadlines and all assertions.
[[profile.ci.overrides]]
filter = "test(=telemetry::tests::track_enqueues_scrubbed_capture_job_with_common_properties) | test(=telemetry::tests::track_silently_drops_when_channel_is_full) | test(=telemetry::tests::dispatch_checks_live_revision_across_independent_clients)"
threads-required = "num-cpus"

# Mounted admission requires live OAuth authority before testing flag denial.
# Concurrent fixture churn exhausted the real authority-read deadline in coverage;
# keep that deadline and the 403/no-effects assertions while reserving test slots.
[[profile.ci.overrides]]
filter = "test(=routes::remote_machine_flag_tests::flag_absent_and_explicit_off_block_all_mounted_admission_before_effects_for_users_and_admins)"
threads-required = "num-cpus"

# This fixture fills every uncertainty slot through the real 250ms dispatch
# admission budget. Keep unrelated MongoDB churn out of its positive admissions;
# preserve the production deadline, retained-proof assertions and no-retry policy.
[[profile.ci.overrides]]
filter = "test(=services::analytics_dispatch_service::tests::retained_uncertainty_is_bounded_without_expiring_proof_and_accepted_rows_are_removed)"
threads-required = "num-cpus"
