apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyxid-backend
  namespace: chronoai-platform
  labels:
    app.kubernetes.io/name: nyxid-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nyxid
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nyxid-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyxid-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: nyxid
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/aelf-shared-k8s-prod/aelf-prod-registry/nyxid-backend:0.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: public
              containerPort: 3001
              protocol: TCP
            - name: internal
              containerPort: 3002
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nyxid-config
            - secretRef:
                name: nyxid-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: INSTANCE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INTERNAL_ADVERTISE_URL
              value: "http://$(POD_IP):3002"
            - name: INTERNAL_DISPATCH_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: nyxid-secrets
                  key: INTERNAL_DISPATCH_HMAC_KEY
                  optional: true
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/nyxid/keys
              readOnly: true
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: public
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: public
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: jwt-keys
          secret:
            secretName: nyxid-jwt-keys
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nyxid-backend
  namespace: chronoai-platform
  labels:
    app.kubernetes.io/name: nyxid-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nyxid
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nyxid-backend
  ports:
    - name: public
      port: 3001
      targetPort: public
      protocol: TCP
---
# Peer traffic uses this Service. The ingress never targets it.
apiVersion: v1
kind: Service
metadata:
  name: nyxid-backend-headless
  namespace: chronoai-platform
  labels:
    app.kubernetes.io/name: nyxid-backend
    app.kubernetes.io/component: backend-internal
    app.kubernetes.io/part-of: nyxid
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nyxid-backend
  ports:
    - name: internal
      port: 3002
      targetPort: internal
      protocol: TCP
---
# Port 3001 remains reachable from ingress and frontend pods. Port 3002 accepts
# traffic only from another backend pod, even if a Service is misconfigured.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nyxid-backend-internal
  namespace: chronoai-platform
  labels:
    app.kubernetes.io/name: nyxid-backend
    app.kubernetes.io/component: backend-internal
    app.kubernetes.io/part-of: nyxid
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nyxid-backend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: public
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nyxid-backend
      ports:
        - port: internal
          protocol: TCP
