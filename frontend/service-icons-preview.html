<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyxID service icons preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f5f7;
        color: #22272b;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 650;
      }
      p {
        margin: 0 0 30px;
        color: #56616b;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 600;
      }
      section {
        margin-top: 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }
      .tile {
        min-height: 142px;
        padding: 18px;
        border: 1px solid #d9dee3;
        border-radius: 6px;
        background: white;
      }
      .glyphs {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 80px;
        margin-bottom: 12px;
      }
      .light {
        --color-background: #fff;
        --color-muted: #edf0f2;
      }
      .preview-large {
        width: 54px;
        height: 54px;
        color: #33434d;
      }
      .preview-small {
        width: 20px;
        height: 20px;
        color: #33434d;
      }
      .name {
        font-weight: 600;
      }
      .slug {
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          monospace;
        color: #687680;
      }
      .dark .tile {
        background: #191f23;
        border-color: #343d43;
        color: #edf2f4;
      }
      .dark .preview-large,
      .dark .preview-small {
        color: #e5ecef;
      }
      .dark .slug {
        color: #a9b8c0;
      }
      .dark .grid {
        padding: 16px;
        background: #111619;
        border-radius: 6px;
      }
      @media (max-width: 480px) {
        main {
          padding: 26px 16px 48px;
        }
        h1 {
          font-size: 23px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NyxID service icons</h1>
      <p>New auto-connected service marks at preview and dashboard sizes.</p>
      <div id="root"></div>
    </main>
    <script type="module">
      import "/src/app.css";
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { SERVICE_ICONS } from "/src/components/service-icons/index.tsx";

      const services = [
        ["CMA", "cma"],
        ["Agent Event Gateway", "cmaeg"],
        [
          "CMA GitHub observer (staging)",
          "cma-trigger-github-observer-staging",
        ],
        ["Aevatar", "aevatar"],
        ["NyxAgent", "llm-nyx"],
        ["ORNN API", "ornn-api"],
        ["Talos", "talos"],
        ["Chrono LLM (public)", "chrono-llm-public"],
        ["Chrono Sandbox", "chrono-sandbox"],
        ["Chrono Storage Service", "chrono-storage-service"],
      ];
      const element = React.createElement;

      function tiles() {
        return services.map(([name, slug]) => {
          const Icon = SERVICE_ICONS[slug];
          return element(
            "div",
            { className: "tile", key: slug },
            element(
              "div",
              { className: "glyphs" },
              element(Icon, { className: "preview-large" }),
              element(Icon, { className: "preview-small" }),
            ),
            element("div", { className: "name" }, name),
            element("div", { className: "slug" }, slug),
          );
        });
      }

      createRoot(document.getElementById("root")).render(
        element(
          React.Fragment,
          null,
          element(
            "section",
            { className: "light" },
            element("h2", null, "Light surface"),
            element("div", { className: "grid" }, tiles()),
          ),
          element(
            "section",
            { className: "dark" },
            element("h2", null, "Dark surface"),
            element("div", { className: "grid" }, tiles()),
          ),
        ),
      );
    </script>
  </body>
</html>
